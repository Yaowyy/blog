      const since = performance.now() - areaFade;
      if (areaFade && since < 300) { ctx.fillStyle = `rgba(0, 0, 0, ${1 - since / 300})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      const bs = performance.now() - areaBanner;
      if (areaBanner && bs < 1600) {
        ctx.globalAlpha = bs < 1200 ? 1 : 1 - (bs - 1200) / 400;
        ctx.fillStyle = '#fff'; ctx.font = '600 44px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(areaName, canvas.width / 2, 40);
        ctx.globalAlpha = 1;
      }

      rowRects = [];
      drawPanels();
      if (ui) drawWindow();
    }

    // a wall: its picture (anchored bottom-centre on the footprint) or, until there is art, coloured tiles
    function artSize(w) {
      const im = ART[w.art];
      if (!w.art || !ready(im)) return null;
      const dw = (w.artW || w.w || 1) * TILE; return { im, dw, dh: dw * im.naturalHeight / im.naturalWidth };
    }
    function wallTop(w) { const a = artSize(w), f = foot(w); return a ? (f.y1 + 1) * TILE - a.dh : f.y0 * TILE; }
    // neon outline around a picture's silhouette: a ring just outside it plus a soft glow. Built once per picture/size/colour.
    const outlineCache = new Map();
    const OUTLINE_PAD = 14;
    function outlineOf(im, sx, sy, sw, sh, dw, dh, color) {
      const key = `${im.src}|${sx}|${sy}|${Math.round(dw)}|${Math.round(dh)}|${color}`;
      let c = outlineCache.get(key);
      if (c) return c;
      const P = OUTLINE_PAD, W = Math.ceil(dw) + 2 * P, H = Math.ceil(dh) + 2 * P;
      const ring = document.createElement('canvas'); ring.width = W; ring.height = H;
      const r = ring.getContext('2d');
      for (let a = 0; a < 16; a++) r.drawImage(im, sx, sy, sw, sh, P + Math.cos(a / 8 * Math.PI) * 3, P + Math.sin(a / 8 * Math.PI) * 3, dw, dh);   // grow the silhouette by 3 px
      r.globalCompositeOperation = 'source-in'; r.fillStyle = color; r.fillRect(0, 0, W, H);
      r.globalCompositeOperation = 'destination-out'; r.drawImage(im, sx, sy, sw, sh, P, P, dw, dh);   // keep only the ring outside the picture
      c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d');
      g.shadowColor = color; g.shadowBlur = 10; g.drawImage(ring, 0, 0); g.drawImage(ring, 0, 0);   // neon glow
      outlineCache.set(key, c);
      return c;
    }
    const NEON = { building: { color: '#ffdc00', alpha: 0.1 }, enemy: { color: '#ff3b3b', alpha: 0.05 } };
    // blurred triangle for the facing marker, built once: tip at the left (toward the hero), wide side at the right.
    // The blur is a shadow cast by a triangle drawn off to the side, so it works in every browser.
    let facingMarkerCanvas = null;
    function facingMarker() {
      if (facingMarkerCanvas) return facingMarkerCanvas;
      const S = Math.round(TILE * 1.4), c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d'), off = S * 4, h = TILE * 0.42;
      g.shadowColor = '#ffdc00'; g.shadowBlur = 16; g.shadowOffsetX = off;
      g.fillStyle = '#ffdc00';
      g.beginPath(); g.moveTo(S / 2 - h - off, S / 2); g.lineTo(S / 2 + h - off, S / 2 - h * 0.95); g.lineTo(S / 2 + h - off, S / 2 + h * 0.95); g.closePath(); g.fill();
      return (facingMarkerCanvas = c);
    }
    const facingEnemy = () => !anyOpen() && dripAt(player.x + facing.x, player.y + facing.y);
    // the building the hero faces and can use (it has something to open)
    const facedBuilding = () => { if (anyOpen()) return null; const w = wallAt(player.x + facing.x, player.y + facing.y); return w && w.opens ? w : null; };

    function drawWall(w) {
      const f = foot(w), a = artSize(w);
      if (a) {
        ctx.imageSmoothingQuality = 'high';
        const x = footCX(w) * TILE - a.dw / 2, y = (f.y1 + 1) * TILE - a.dh;
        ctx.drawImage(a.im, x, y, a.dw, a.dh);
        if (w === facedBuilding()) {   // interactable: yellow neon outline
          ctx.save(); ctx.globalAlpha = NEON.building.alpha;
          ctx.drawImage(outlineOf(a.im, 0, 0, a.im.naturalWidth, a.im.naturalHeight, a.dw, a.dh, NEON.building.color), x - OUTLINE_PAD, y - OUTLINE_PAD);
          ctx.restore();
        }
      } else {
        ctx.fillStyle = w.color;
        ctx.fillRect(f.x0 * TILE, f.y0 * TILE, (f.x1 - f.x0 + 1) * TILE, (f.y1 - f.y0 + 1) * TILE);
      }
    }

    // ---- combat drawing ---------------------------------------------------------
    function dripPos() {
      const p = Math.min(1, (gameTime - drip.stepStart) / DRIP.stepMs);
      return { x: drip.fromX + (drip.x - drip.fromX) * p, y: drip.fromY + (drip.y - drip.fromY) * p };
    }
    // one cell of a Drip sheet, puddle centre on the tile's bottom-centre, scaled so his body is DRIP_BODY tiles
    function drawDripCell(im, spec, frame, cx, feet, squash, neon) {
      const fw = im.naturalWidth / spec.frames, fh = im.naturalHeight, s = DRIP_BODY * TILE / spec.body;
      ctx.save(); ctx.translate(cx, feet); if (drip.lookX > 0) ctx.scale(-1, 1);   // art faces left
      ctx.scale(1, squash || 1);
      ctx.imageSmoothingQuality = 'high';
      if (neon) {   // neon outline behind him while the hero faces him (red while alive, yellow when his loot can be taken)
        ctx.save(); ctx.globalAlpha = neon.alpha;
        ctx.drawImage(outlineOf(im, frame * fw, 0, fw, fh, fw * s, fh * s, neon.color), -spec.ax * s - OUTLINE_PAD, -fh * s - OUTLINE_PAD);
        ctx.restore();
      }
      ctx.drawImage(im, frame * fw, 0, fw, fh, -spec.ax * s, -fh * s, fw * s, fh * s);
      ctx.restore();
    }
    function drawDrip(d) {
      const t = gameTime, cx = (d.x + 0.5) * TILE, feet = (d.y + 1) * TILE - 2;
      if (drip.dead) {
        if (ready(ART.dripHurt)) drawDripCell(ART.dripHurt, DRIP_ART.hurt, 1, cx, feet, 1, drip.loot && lootable() && !anyOpen() ? NEON.building : null);
        if (drip.loot) {   // loot waiting: a pulsing gold glint over the puddle, "loot" when faced
          const k = 0.5 + 0.5 * Math.sin(performance.now() / 250), gy = feet - 52;
          ctx.save(); ctx.globalAlpha = 0.5 + 0.5 * k; ctx.fillStyle = '#f5c542';
          ctx.translate(cx + 18, gy); ctx.scale(0.8 + 0.3 * k, 0.8 + 0.3 * k);
          ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(3, -3); ctx.lineTo(12, 0); ctx.lineTo(3, 3); ctx.lineTo(0, 12); ctx.lineTo(-3, 3); ctx.lineTo(-12, 0); ctx.lineTo(-3, -3); ctx.closePath(); ctx.fill();
          ctx.restore();
          if (lootable() && !anyOpen()) {
            ctx.fillStyle = '#fff'; ctx.font = '600 24px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText('loot (Space)', cx, feet - 70);
          }
        }
        return;
      }
      const sinceAtk = t - drip.attackStart, sinceHurt = t - drip.hurtStart;
      if (sinceAtk < 700 && ready(ART.dripAttack)) drawDripCell(ART.dripAttack, DRIP_ART.attack, Math.min(3, Math.floor(sinceAtk / 175)), cx, feet, 1, facingEnemy() ? NEON.enemy : null);
      else if (sinceHurt < 300 && ready(ART.dripHurt)) drawDripCell(ART.dripHurt, DRIP_ART.hurt, 0, cx, feet, 1, facingEnemy() ? NEON.enemy : null);
      else if (ready(ART.dripIdle)) drawDripCell(ART.dripIdle, DRIP_ART.idle, 0, cx, feet, 1 + 0.025 * Math.sin(t / 260), facingEnemy() ? NEON.enemy : null);   // oily wobble
      else { ctx.fillStyle = '#10131C'; ctx.fillRect(d.x * TILE + 10, d.y * TILE + 10, TILE - 20, TILE - 20); }
      if (t < (drip.stunUntil || 0)) {   // magic tar: glowing magenta ring pinning him down
        const k = 0.6 + 0.4 * Math.sin(t / 120);
        ctx.save(); ctx.globalAlpha = k; ctx.strokeStyle = '#ff2bd6'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(cx, feet - 8, 46, 16, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      // health bar over his head
      const bw = 64, bx = cx - bw / 2, by = feet - DRIP_BODY * TILE - 18;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
      ctx.fillStyle = '#e5484d'; ctx.fillRect(bx, by, bw * drip.hp / DRIP.hp, 8);
    }
    // Tart: the hero stands stuck in a glossy oil puddle
    function drawTart(rx, ry) {
      const cx = (rx + 0.5) * TILE, cy = (ry + 1) * TILE - 10, left = (rootedUntil - gameTime) / DRIP.tart.rootMs;
      ctx.save();
      ctx.globalAlpha = Math.min(1, left * 4);
      ctx.fillStyle = '#10131C'; ctx.beginPath(); ctx.ellipse(cx, cy, 40, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#ff2bd6'; ctx.beginPath(); ctx.ellipse(cx, cy, 40, 15, 0, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
      ctx.strokeStyle = '#00e5ff'; ctx.beginPath(); ctx.ellipse(cx, cy, 40, 15, 0, Math.PI * 0.1, Math.PI * 0.5); ctx.stroke();
      ctx.restore();
    }
    function drawProjectiles() {
      for (const pr of projectiles) {
        const x = pr.x * TILE, y = pr.y * TILE - 30, s = 44;   // flies at chest height
        ctx.save(); ctx.translate(x, y); ctx.rotate((gameTime - pr.t) / 90);
        if (ready(ART.magicTart)) ctx.drawImage(ART.magicTart, -s / 2, -s / 2, s, s);
        else { ctx.fillStyle = '#ff2bd6'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
    }
    function drawFloaters() {
      const LIFE = 900;
      for (let i = floaters.length - 1; i >= 0; i--) if (gameTime - floaters[i].t > LIFE) floaters.splice(i, 1);
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 30px ' + MONO; ctx.lineWidth = 5; ctx.strokeStyle = '#000';
      for (const f of floaters) {
        const k = (gameTime - f.t) / LIFE, x = f.x * TILE, y = f.y * TILE - k * 36;
        ctx.globalAlpha = 1 - k * k;
        ctx.strokeText(f.text, x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
      }
      ctx.restore();
    }
    // enemy panel at the top while fighting: portrait, name, health, mana
    function drawFoePanel() {
      const w = 300, h = 80, x = (canvas.width - w) / 2, y = 12;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(255, 43, 214, 0.6)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      if (ready(ART.dripPortrait)) { ctx.imageSmoothingQuality = 'high'; ctx.drawImage(ART.dripPortrait, x + 8, y + 8, 64, 64); }
      const tx = x + 84, bw = w - 84 - 14;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = '600 22px ' + MONO;
      ctx.fillText(DRIP.name, tx, y + 20);
      ctx.fillStyle = '#3a1418'; ctx.fillRect(tx, y + 36, bw, 12);
      ctx.fillStyle = '#e5484d'; ctx.fillRect(tx, y + 36, bw * drip.hp / DRIP.hp, 12);
      ctx.fillStyle = '#fff'; ctx.font = '600 14px ' + MONO; ctx.textAlign = 'right';
      ctx.fillText(`${drip.hp}/${DRIP.hp}`, tx + bw, y + 20);
      ctx.fillStyle = '#4ea1ff'; ctx.font = '18px ' + MONO; ctx.textAlign = 'left';
      ctx.fillText(ICON.mana.repeat(drip.mana) + '◇'.repeat(DRIP.mana - drip.mana), tx, y + 62);
    }

    // hero sprite: feet on the bottom-centre of his tile, small bob while walking, mirrored when facing left
    // hero sprite: feet on the bottom-centre of his tile, mirrored when facing left.
    // While attacking: the punch or sword sheet for the facing direction. With a sword equipped (and not attacking)
    // the sword is drawn on his back: behind him in the side and front views, over the backpack in the back view.
    function drawHeroSprite(rx, ry) {
      const im = ART.heroSprite, walk = ART.heroWalk;
      if (!ready(im)) {   // fallback until the image loads
        ctx.fillStyle = '#808080'; ctx.fillRect(Math.round(rx * TILE), Math.round(ry * TILE), TILE, TILE); return;
      }
      const h = HERO_H * TILE, k = h / 280;   // k: sheet px -> canvas px (walk frames are 280 px tall)
      const cx = (rx + 0.5) * TILE, feet = (ry + 1) * TILE - 4;
      ctx.save();
      if (gameTime - heroHurtStart < 300 && Math.floor((gameTime - heroHurtStart) / 60) % 2 === 0) ctx.globalAlpha = 0.35;   // hit blink
      ctx.imageSmoothingQuality = 'high';
      ctx.translate(cx, feet);
      const since = gameTime - heroAttackStart;
      const key = since < HERO_ATTACK_ANIM_MS && HERO_ATTACK_SHEETS[hasSword() ? 'sword' : 'punch'][heroAttackDir];
      if (key && ready(ART[key])) {   // attack frame
        const c = ATTACK_CELLS[key], f = Math.min(3, Math.floor(since / (HERO_ATTACK_ANIM_MS / 4)));
        if (heroAttackDir === 'side' && lookX < 0) ctx.scale(-1, 1);
        ctx.drawImage(ART[key], f * c.cellW, 0, c.cellW, c.cellH, -c.ax * k, -(c.cellH - c.foot - 2) * k, c.cellW * k, c.cellH * k);
        ctx.restore(); return;
      }
      // straight down / up use the front / back walk (never mirrored); everything else uses the side walk
      const view = moving && moveDir.x === 0 ? (moveDir.y > 0 ? 'down' : 'up') : 'side';
      const vert = view === 'down' ? ART.heroWalkDown : view === 'up' ? ART.heroWalkUp : null;
      const sheet = vert && ready(vert) ? vert : walk;
      if (lookX < 0 && sheet === walk) ctx.scale(-1, 1);
      const sword = hasSword() && ready(ART.bananaSword);
      if (sword && view !== 'up') drawBackSword(view, h);   // behind the body
      if (moving && ready(sheet)) {   // walk cycle frame, picked by distance walked
        const t = Math.min(0.999, (performance.now() - moveStart) / MOVE_MS);
        const f = ((stepsTaken - 1) * FRAMES_PER_TILE + Math.floor(t * FRAMES_PER_TILE)) % WALK_FRAMES;
        const fw = sheet.naturalWidth / WALK_FRAMES, fh = sheet.naturalHeight, w = h * fw / fh;
        ctx.drawImage(sheet, f * fw, 0, fw, fh, -w / 2, -h, w, h);
      } else {
        const w = h * im.naturalWidth / im.naturalHeight;
        ctx.drawImage(im, -w / 2, -h, w, h);
      }
      if (sword && view === 'up') drawBackSword(view, h);    // over the backpack
      ctx.restore();
    }
    // sheathed banana sword: the icon (blade tip up-right) turned so the handle sticks up over his shoulder.
    // Positions are fractions of the hero's height, measured from his feet, in the sprite's own (facing-right) space.
    const BACK_SWORD = { side: { x: -0.13, y: -0.62, rot: 115, size: 0.52 },
                         down: { x: 0.12, y: -0.62, rot: 150, size: 0.52 },
                         up:   { x: 0.00, y: -0.60, rot: 180, size: 0.52 } };
    function drawBackSword(view, h) {
      const b = BACK_SWORD[view], s = b.size * h, bob = moving ? Math.sin((performance.now() - moveStart) / MOVE_MS * Math.PI * 2) * 1.5 : 0;
      ctx.save();
      ctx.translate(b.x * h, b.y * h + bob); ctx.rotate(b.rot * Math.PI / 180);
      ctx.drawImage(ART.bananaSword, -s / 2, -s / 2, s, s);
      ctx.restore();
    }

    function drawWindow() {
      const list = rows();
      const info = ui.kind === 'controls';          // read-only list, nothing to select
      const rowH = info ? 38 : ui.kind === 'shop' || ui.kind === 'loot' || ui.kind === 'scrap' ? 88 : ui.kind === 'cheat' ? 50 : 64;   // shop and loot rows are taller for the item pictures
      const hero = ui.kind === 'hero', inv = ui.kind === 'inventory';
      const wide = hero || inv || ['shop', 'scrap', 'save', 'load', 'logout', 'guest'].includes(ui.kind);
      const pw = (wide ? 11 : 9) * TILE;
      ctx.font = '26px ' + MONO;
      const textLines = WINDOW_TEXT[ui.kind] ? wrapText(WINDOW_TEXT[ui.kind], pw - 80) : [];
      const msgLines = ui.msg ? wrapText(ui.msg, pw - 80) : [];
      const textH = textLines.length ? textLines.length * 34 + 24 : 0, gaps = list.filter(r => r.gapBefore).length * 24;
      const ph = hero || inv ? 7 * TILE : ui.kind === 'rest' ? 5 * TILE
        : Math.min(canvas.height - 20, Math.max(6 * TILE, 110 + textH + list.length * rowH + gaps + Math.max(1, msgLines.length) * 32 + 100));
      const px = (canvas.width - pw) / 2, py = (canvas.height - ph) / 2;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);

      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.font = '600 40px ' + MONO;
      ctx.fillText(hero ? (heroName || DEFAULT_NAME) : TITLES[ui.kind], px + 40, py + 56);
      if (ui.kind === 'shop' || ui.kind === 'work' || ui.kind === 'scrap') {   // wallet in the corner
        ctx.textAlign = 'right';
        ctx.font = '26px ' + MONO;
        ctx.fillStyle = '#8a8a8a';
        ctx.fillText(`${ICON.energy} ${stats.energy}   ${stats.money}$`, px + pw - 40, py + 56);
      }

      ctx.font = '26px ' + MONO; ctx.fillStyle = '#cfcfcf'; ctx.textAlign = 'left';
      textLines.forEach((l, i) => ctx.fillText(l, px + 40, py + 110 + i * 34));
      const top = py + 110 + textH;
      let gapY = 0;
      list.forEach((r, i) => {
        if (r.gapBefore) gapY += 24;
        const y = top + i * rowH + gapY, sel = !info && i === ui.cursor;
        rowRects.push({ x: px + 24, y, w: pw - 48, h: rowH - 8, i });
        if (sel) { ctx.fillStyle = 'rgba(255, 220, 0, 0.12)'; ctx.fillRect(px + 24, y, pw - 48, rowH - 8); }
        ctx.fillStyle = r.dim ? '#6a6a6a' : sel || info ? '#fff' : '#cfcfcf';
        ctx.font = (sel ? '600 ' : '') + (info ? '22px ' : ui.kind === 'cheat' ? '26px ' : '30px ') + MONO;
        ctx.textAlign = 'left';
        let tx = px + 40;
        if (r.pic !== undefined) {   // item picture slot (shop)
          const sz = rowH - 12, sx = px + 74, sy = y + (rowH - 8 - sz) / 2;
          drawSlot(sx, sy, sz, r.item || (r.pic ? { name: r.left } : null));
          ctx.fillStyle = sel ? '#fff' : '#cfcfcf'; ctx.font = (sel ? '600 ' : '') + '30px ' + MONO;
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          if (sel) ctx.fillText('>', px + 40, y + (rowH - 8) / 2);
          tx = sx + sz + 16;
          ctx.fillText(r.left, tx, y + (rowH - 8) / 2);
        } else ctx.fillText((info ? '' : sel ? '> ' : '  ') + r.left, tx, y + (rowH - 8) / 2);
        ctx.textAlign = 'right';
        if (info) ctx.fillStyle = '#8a8a8a';
        ctx.fillText(r.right, px + pw - 40, y + (rowH - 8) / 2);
      });

      ctx.textAlign = 'left';
      if (msgLines.length) {   // long messages wrap onto more lines
        ctx.fillStyle = '#f5c542';
        ctx.font = '26px ' + MONO;
        msgLines.forEach((l, i) => ctx.fillText(l, px + 40, py + ph - 88 - (msgLines.length - 1 - i) * 32));
      }
      ctx.fillStyle = '#8a8a8a';
      ctx.font = '22px ' + MONO;
      ctx.fillText(hero ? 'H or Esc close' : ui.kind === 'gameover' ? 'Space start a new game' : inv ? 'A/D/W/S choose · Space equip/learn/unequip · I or Esc close' : ui.kind === 'loot' ? 'W/S choose · Space take · Esc close' : ui.kind === 'cheat' ? 'W/S choose · Space apply · P or Esc close' : ui.kind === 'scrap' ? 'W/S choose · Space buy / sell · Esc close' : ui.kind === 'rest' ? (restReadyAt > Date.now() ? (ui.back ? 'Esc back' : 'Esc close') : 'Space confirm · Esc close') : info ? (ui.back ? 'Esc back' : 'Esc close') : (ui.back ? 'W/S choose · Space select · Esc back' : 'W/S choose · Space select · Esc close'), px + 40, py + ph - 40);
    }

    function wrapText(text, maxW) {   // uses the current ctx.font
      const out = []; let line = '';
      for (const w of text.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
      }
      if (line) out.push(line);
      return out;
    }

    // one square slot; item = { name } or null
    function drawSlot(x, y, size, item) {
      const frame = ART.slot;
      if (ready(frame)) { ctx.imageSmoothingQuality = 'high'; ctx.drawImage(frame, x, y, size, size); }
      const pic = item && ART[(itemDef(item.name) || {}).art];
      if (item && item.name === 'money') {   // money has no item art: a big gold $
        ctx.fillStyle = '#f5c542'; ctx.font = `700 ${Math.round(size * 0.55)}px ` + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('$', x + size / 2, y + size / 2 + size * 0.03);
      } else if (item && ready(pic)) {   // item picture inside the frame
        const i = size * 0.14;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(pic, x + i, y + i, size - 2 * i, size - 2 * i);
      } else if (item) {
        const i = size * 0.16;
        ctx.fillStyle = '#f2d24b'; ctx.fillRect(x + i, y + i, size - 2 * i, size - 2 * i);   // placeholder art for the item
        const fs = Math.round(size * 0.14);   // text scales with the slot
        ctx.fillStyle = '#000'; ctx.font = `600 ${fs}px ` + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        item.name.split(' ').forEach((w, j, arr) => ctx.fillText(w, x + size / 2, y + size / 2 + (j - (arr.length - 1) / 2) * fs * 1.2));
      }
      if (item && (item.count || 1) > 1) {   // stack size, bottom-right
        const fs = Math.round(size * 0.2);
        ctx.font = `700 ${fs}px ` + MONO; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
        ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(item.count, x + size - size * 0.1, y + size - size * 0.1);
        ctx.fillStyle = '#fff'; ctx.fillText(item.count, x + size - size * 0.1, y + size - size * 0.1);
      }
      if (!item && !ready(frame)) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, size - 2, size - 2);
      }
    }

    // inventory: a row of INVENTORY_SLOTS slots
    // ---- side panels ------------------------------------------------------------
    const INV_PANEL = { w: 7 * TILE, h: 290 }, HERO_PANEL = { w: 8 * TILE, h: 6 * TILE };
    function drawPanels() {
      if (panels.hero) drawHeroPanel();
      if (panels.inventory) drawInventoryPanel();
    }
    function panelFrame(x, y, w, h, title, on) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = on ? '#fff' : 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      ctx.fillStyle = on ? '#fff' : '#8a8a8a'; ctx.font = '600 28px ' + MONO; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(title, x + 24, y + 34);
    }
    function selFrame(x, y, size, on) {   // yellow frame on the selected slot (grey when the panel isn't focused)
      ctx.strokeStyle = on ? '#ffdc00' : 'rgba(255, 220, 0, 0.35)'; ctx.lineWidth = 4;
      ctx.strokeRect(x - 5, y - 5, size + 10, size + 10);
    }
    const bonusText = def => def ? Object.entries(def.gain || {}).map(([st, n]) => `+${n} ${ICON[st]}`).join(' ') : '';

    // inventory: bottom right, just above the info bar. Backpack slots only (equipped items are in the hero panel).
    function drawInventoryPanel() {
      const pn = panels.inventory, on = focus === 'inventory', w = INV_PANEL.w, h = INV_PANEL.h;
      const x = canvas.width - w - 16, y = canvas.height - h - 16;
      panelFrame(x, y, w, h, 'Inventory', on);
      const size = 96, gap = 16, total = INVENTORY_SLOTS * size + (INVENTORY_SLOTS - 1) * gap, x0 = x + (w - total) / 2, sy = y + 62;
      for (let i = 0; i < INVENTORY_SLOTS; i++) {
        const sx = x0 + i * (size + gap);
        drawSlot(sx, sy, size, inventory[i] || null);
        rowRects.push({ x: sx, y: sy, w: size, h: size, i, panel: 'inventory' });
        if (i === pn.cursor) selFrame(sx, sy, size, on);
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '18px ' + MONO;
      const ly = sy + size + 26, sel = inventory[pn.cursor];
      if (pn.msg) { ctx.fillStyle = '#f5c542'; ctx.fillText(pn.msg, x + 24, ly); }
      else if (sel) {   // what the selected item is, and its total price
        const def = itemDef(sel.name) || {}, n = sel.count || 1;
        ctx.fillStyle = '#fff';
        ctx.fillText(`${sel.name} · ${sel.class || 'item'}${sel.class === 'resource' ? ` · ${n}/${def.stack}` : ''}`, x + 24, ly);
        ctx.fillStyle = '#cfcfcf';
        ctx.fillText(sel.class === 'skill' ? 'Space to learn' : sel.class === 'resource' ? 'crafting resource' : `${bonusText(def)} when equipped · Space equip`, x + 24, ly + 26);
        const unit = def.class === 'equipment' ? def.price : def.value;   // equipment: shop price; resources: value per piece
        ctx.fillStyle = '#f5c542';
        ctx.fillText(unit === undefined ? 'total price: —' : `total price: ${unit * n}$${n > 1 ? `  (${n} × ${unit}$)` : ''}`, x + 24, ly + 52);
      } else { ctx.fillStyle = '#8a8a8a'; ctx.fillText('empty slot', x + 24, ly); }
      ctx.fillStyle = '#8a8a8a'; ctx.font = '16px ' + MONO;
      ctx.fillText('A/D choose · Space use · I or Esc close', x + 24, y + h - 18);
    }

    // hero: middle left. Full-body picture, stats, and the equipped slots (W/S choose, Space unequips).
    function drawHeroPanel() {
      const pn = panels.hero, on = focus === 'hero', w = HERO_PANEL.w, h = HERO_PANEL.h;
      const x = 16, y = (canvas.height - h) / 2, top = y + 64;
      panelFrame(x, y, w, h, heroName || DEFAULT_NAME, on);
      const bw = 180, bh = 320;
      ctx.fillStyle = '#1B2233'; ctx.fillRect(x + 24, top, bw, bh);
      const full = ART.heroFull;
      if (ready(full)) {   // full-body art, fitted into the box
        const ih = bh - 24, iw = Math.min(bw - 16, ih * full.naturalWidth / full.naturalHeight), ih2 = iw * full.naturalHeight / full.naturalWidth;
        ctx.imageSmoothingQuality = 'high'; ctx.drawImage(full, x + 24 + (bw - iw) / 2, top + (bh - ih2) / 2, iw, ih2);
      }
      const lines = [
        [`${ICON.health} health`, stats.health, 'health'], [`${ICON.strength} strength`, stats.strength, 'strength'],
        [`${ICON.mana} mana`, stats.mana, 'mana'], [`${ICON.charisma} charisma`, stats.charisma, 'charisma'],
        [`${ICON.energy} energy`, stats.energy, 'energy'],
        ['crit (spells)', `${(critChance() * 100).toFixed(2)}%`, 'crit'],
      ];
      const bonus = {};   // equipment bonus, shown as "base +bonus" with the bonus in green
      for (const it of equipped) for (const [st, n] of Object.entries((itemDef(it.name) || {}).gain || {})) bonus[st] = (bonus[st] || 0) + n;
      const lx = x + 24 + bw + 24, rx = x + w - 24 - 96 - 24;
      ctx.font = '20px ' + MONO; ctx.textBaseline = 'middle';
      lines.forEach(([k, v, key], i) => {
        const ly = top + 16 + i * 38, b = bonus[key] || 0;
        ctx.textAlign = 'left'; ctx.fillStyle = '#8a8a8a'; ctx.fillText(k, lx, ly);
        ctx.textAlign = 'right';
        if (b) {
          const extra = ` +${b}`;
          ctx.fillStyle = '#3ddc84'; ctx.fillText(extra, rx, ly);
          ctx.fillStyle = '#fff'; ctx.fillText(String(v - b), rx - ctx.measureText(extra).width, ly);
        } else { ctx.fillStyle = '#fff'; ctx.fillText(String(v), rx, ly); }
      });
      const size = 96, gap = 16, sx = x + w - 24 - size;
      for (let i = 0; i < EQUIP_SLOTS; i++) {
        const sy = top + i * (size + gap);
        drawSlot(sx, sy, size, equipped[i] || null);
        rowRects.push({ x: sx, y: sy, w: size, h: size, i, panel: 'hero' });
        if (i === pn.cursor) selFrame(sx, sy, size, on);
      }
      ctx.textAlign = 'left'; ctx.font = '18px ' + MONO;
      const ly = top + bh + 30, sel = equipped[pn.cursor];
      if (pn.msg) { ctx.fillStyle = '#f5c542'; ctx.fillText(pn.msg, x + 24, ly); }
      else if (sel) { ctx.fillStyle = '#cfcfcf'; ctx.fillText(`${sel.name} · ${bonusText(itemDef(sel.name))} · Space to unequip`, x + 24, ly); }
      else { ctx.fillStyle = '#8a8a8a'; ctx.fillText('empty equipment slot', x + 24, ly); }
      ctx.fillStyle = '#8a8a8a'; ctx.font = '16px ' + MONO;
      ctx.fillText('W/S choose · Space unequip · H or Esc close', x + 24, y + h - 18);
    }

    function toggleInventory() { if (!ui) togglePanel('inventory'); }
    document.getElementById('inv-btn').addEventListener('click', e => { e.currentTarget.blur(); if (!naming()) toggleInventory(); });

    // ---- account screen + cheat password -------------------------------------------
    const accEl = document.getElementById('account'), lockEl = document.getElementById('cheat-lock');
    const naming = () => !accEl.hidden || !lockEl.hidden;   // an overlay with text fields is open: the game ignores keys
    const $ = id => document.getElementById(id);
    let accMode = 'create';
    const accMsg = (m, ok) => { $('acc-err').textContent = m; $('acc-err').classList.toggle('ok', !!ok); };
    function setAccMode(mode) {
      accMode = mode; accMsg(''); $('acc-resend-row').hidden = true;
      $('acc-title').textContent = mode === 'create' ? 'Create account' : 'Log in';
      $('acc-submit').textContent = mode === 'create' ? 'Create account' : 'Log in';
      $('acc-name-row').hidden = mode !== 'create';
      $('acc-pass').autocomplete = mode === 'create' ? 'new-password' : 'current-password';
      $('acc-switch').textContent = mode === 'create' ? 'Already have an account? Log in' : 'New here? Create an account';
    }
    function showAccount(mode, msg, ok) {
      accEl.hidden = false; held.clear(); tapped.clear();
      const last = store.get(STORE.last);
      setAccMode(mode || (last ? 'login' : 'create'));
      $('acc-email').value = last || ''; $('acc-pass').value = '';
      if (msg) accMsg(msg, ok);
      $('acc-guest').textContent = heroName && !account ? 'Back to the game (guest)' : 'Play as guest (no saving)';
      if (!sb) accMsg("Can't reach the account server. Check your connection and reload, or play as a guest.");
      setTimeout(() => (accMode === 'login' && last ? $('acc-pass') : accMode === 'create' ? $('acc-name') : $('acc-email')).focus(), 0);
    }
    $('acc-switch').addEventListener('click', e => {
      e.preventDefault();
      setAccMode(accMode === 'create' ? 'login' : 'create');
    });
    // guest: play without an account (no saving). If a guest run is already going, just go back to it.
    $('acc-guest').addEventListener('click', e => {
      e.preventDefault();
      if (heroName && !account) { accEl.hidden = true; document.activeElement?.blur(); return; }
      enterGame(null);
    });
    // from the guest prompt: park the current run so it survives the email-confirmation reload, then show the form
    function toAccount(mode) {
      ui = null; closePanels();
      store.set(GUEST_RUN, { at: Date.now(), state: snapshot() });
      showAccount(mode);
      if (mode === 'create') $('acc-name').value = '';
    }
    $('acc-name').addEventListener('input', () => { const v = cleanName($('acc-name').value); if (v !== $('acc-name').value) $('acc-name').value = v; });
    let pendingEmail = '';   // email waiting for confirmation (for "resend")
    $('acc-resend').addEventListener('click', async e => {
      e.preventDefault();
      if (!pendingEmail) return;
      const { error } = await sb.auth.resend({ type: 'signup', email: pendingEmail, options: { emailRedirectTo: RETURN_URL } });
      accMsg(error ? error.message : `Sent again to ${pendingEmail}. Check your inbox (and spam).`, !error);
    });
    $('acc-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!sb) return;
      const email = $('acc-email').value.trim().toLowerCase(), pass = $('acc-pass').value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return accMsg('Enter a valid email.');
      if (pass.length < 6) return accMsg('Password needs at least 6 characters.');
      $('acc-submit').disabled = true; $('acc-resend-row').hidden = true;
      try {
        if (accMode === 'create') {
          const name = cleanName($('acc-name').value);
          if (!name) return accMsg('Enter a hero name (letters only).');
          const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { hero_name: name }, emailRedirectTo: RETURN_URL } });
          if (error) return accMsg(error.message);
          // Supabase answers an already-registered email with a user that has no identities (so it doesn't reveal who is signed up)
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0)
            return accMsg('This email already has an account. Log in instead.');
          store.set(STORE.last, email);
          if (data.session) return enterGame(data.session.user);   // confirmation switched off in Supabase: straight in
          pendingEmail = email; setAccMode('login'); $('acc-email').value = email;
          accMsg(`Almost done! We sent a confirmation link to ${email}. Open it to activate your account; it brings you back here.`, true);
          $('acc-resend-row').hidden = false;
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
          if (error) {
            if (/confirm/i.test(error.message)) { pendingEmail = email; $('acc-resend-row').hidden = false; return accMsg('Please confirm your email first: open the link we sent you.'); }
            return accMsg(/invalid/i.test(error.message) ? 'Wrong email or password.' : error.message);
          }
          store.set(STORE.last, email);
          enterGame(data.user);
        }
      } finally { $('acc-submit').disabled = false; }
    });
    // logged in (or offline with user = null): start a new run, then continue from the online save if there is one
    async function enterGame(user) {
      account = user ? { id: user.id, email: user.email } : null;
      heroName = user ? (user.user_metadata?.hero_name || user.email.split('@')[0]).slice(0, 10) : 'guest';
      accEl.hidden = true; document.activeElement?.blur();
      newGame(); renderStats();
      lastAutosave = Date.now();   // don't autosave the fresh run over an existing save
      const { slots } = await listSlots();   // continue from the newest slot (autosave or manual)
      const latest = Object.values(slots || {}).sort((a, b) => new Date(b.at) - new Date(a.at))[0];
      const guestRun = account && store.get(GUEST_RUN);
      if (guestRun) store.set(GUEST_RUN, null);
      if (!account || account.id !== user.id) return;
      if (guestRun && guestRun.state && !latest && Date.now() - guestRun.at < 7 * 24 * 3600 * 1000) {   // a brand-new account takes over the guest run
        applySave(guestRun.state); await writeSlot(1);
        float('guest run saved', '#3ddc84', player.x + 0.5, player.y - 0.8);
      } else if (latest) { applySave(latest.state); float('welcome back', '#3ddc84', player.x + 0.5, player.y - 0.8); }
      lastAutosave = Date.now();
    }
    async function logOut() {
      ui = null; closePanels(); cheatsUnlocked = false;
      if (account) await writeSlot(1);   // autosave before leaving
      if (sb && account) await sb.auth.signOut();
      account = null; heroName = null; slotInfo = { state: 'loading', slots: {} };
      newGame(); renderStats(); showAccount('login');
    }
    // on page load: already logged in (Supabase keeps the session), or just back from the confirmation link?
    (async () => {
      const hash = new URLSearchParams(location.hash.slice(1));
      const linkError = hash.get('error_description');
      if (!sb) return showAccount();
      const { data } = await sb.auth.getSession();
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);   // tidy the address bar
      if (data.session) {
        const confirmedNow = hash.get('type') === 'signup';
        await enterGame(data.session.user);
        if (confirmedNow) float('email confirmed!', '#3ddc84', player.x + 0.5, player.y - 1.2);
      } else if (linkError) showAccount('login', `That link didn't work (${linkError.replace(/\+/g, ' ')}). Log in to get a new one.`);
      else showAccount();
    })();

    function openCheats() {
      if (cheatsUnlocked) { openWindow('cheat'); return; }
      lockEl.hidden = false; $('cheat-err').textContent = ''; $('cheat-pass').value = ''; held.clear(); tapped.clear();
      setTimeout(() => $('cheat-pass').focus(), 0);
    }
    $('cheat-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (await sha256($('cheat-pass').value) !== CHEAT_HASH) { $('cheat-err').textContent = 'Wrong password.'; $('cheat-pass').select(); return; }
      cheatsUnlocked = true; lockEl.hidden = true; document.activeElement?.blur(); openWindow('cheat');
    });
    $('cheat-pass').addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); lockEl.hidden = true; document.activeElement?.blur(); } });

    // ---- input --------------------------------------------------------------
    addEventListener('keydown', e => {
      if (naming() || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) spacePressed(); return; }
      if (k === 'p') { e.preventDefault(); if (!e.repeat && !locked()) { if (ui && ui.kind === 'cheat') closeWindow(); else openCheats(); } return; }   // CHEAT menu (testing) — remove before release
      if (k === 'i') { e.preventDefault(); if (!e.repeat && !ui) togglePanel('inventory'); return; }
      if (k === 'h') { e.preventDefault(); if (!e.repeat && !ui) togglePanel('hero'); return; }
      if (e.key === 'Escape') { e.preventDefault(); if (!e.repeat) escPressed(); return; }
      if (ui && /^[1-9]$/.test(e.key)) { choose(+e.key - 1); return; }
      if (!anyOpen() && /^[1-3]$/.test(e.key)) { e.preventDefault(); if (!e.repeat) castSpell(+e.key - 1); return; }
      if (!KEYS.includes(k)) return;
      e.preventDefault();
      if (anyOpen()) { press([k]); return; }        // cursor moves, repeat allowed
      if (!e.repeat) press([k]);
    });
    addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (KEYS.includes(k)) release([k]);
    });
    addEventListener('blur', () => held.clear());

    // tap/click a row in a window to pick it
    canvas.addEventListener('pointerdown', e => {
      if (!anyOpen() || naming()) return;
      const r = canvas.getBoundingClientRect();
      const s = Math.min(r.width / canvas.width, r.height / canvas.height);   // object-fit: contain
      const ox = (r.width - canvas.width * s) / 2, oy = (r.height - canvas.height * s) / 2;
      const cx = (e.clientX - r.left - ox) / s, cy = (e.clientY - r.top - oy) / s;
      const hit = rowRects.find(b => (!ui || !b.panel) && cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h);
      if (hit && hit.panel) { focus = hit.panel; panels[hit.panel].cursor = hit.i; panels[hit.panel].msg = ''; }   // click a panel slot: focus + select
      else if (hit) choose(hit.i);
    });

    if (areaName === 'slums') spawnDrip();   // loaded straight into the slums
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
