<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Game</title>
<style>
  :root { color-scheme: dark; --bg: #000; --grid: #fff; --player: #808080; --muted: #8a8a8a;
          /* on-screen width of the grid; one tile is --w / 17 */
          --w: min(100vw - 32px, 1360px, calc((100vh - 140px) * 17 / 11)); }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--grid); margin: 0;
    padding-inline: 16px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    user-select: none; -webkit-user-select: none;
  }
  /* stage and HUD share one width so the HUD lines up with the grid's edges */
  #stage, .hud { width: var(--w); }
  #stage { aspect-ratio: 17 / 11; position: relative; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
  /* HUD: left (portrait + body stats) · middle (ability tiles) · right (charisma, money, deals) */
  .hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px 24px; align-items: center;
         font-size: 26px; font-variant-numeric: tabular-nums; }
  .hud-left, .hud-right { display: flex; gap: 24px; align-items: center; }
  .hud-right { justify-self: end; }
  .abilities { display: flex; gap: 8px; }
  .inv-btn { width: calc(var(--w) / 17); aspect-ratio: 1; margin-left: 24px; padding: 0; box-sizing: border-box;
             background: transparent; color: var(--grid); border: 2px solid var(--grid); font: 1.3em/1 ui-monospace, monospace; cursor: pointer; }
  .inv-btn { background: center / 62% no-repeat, center / 100% no-repeat; border: 0; }
  .inv-btn:hover { background-color: rgba(255, 255, 255, 0.08); }
  .inv-btn:focus-visible { outline: 2px solid #ffdc00; outline-offset: 2px; }
  .ability[data-key]:not([data-key=""])::after { content: attr(data-key); position: absolute; right: 8%; bottom: 4%; font-size: 1.4em; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .ability { position: relative;
             width: calc(var(--w) / 17); aspect-ratio: 1; box-sizing: border-box; background: center / 100% no-repeat;
             display: grid; place-items: center; padding: 8%; text-align: center; font-size: 0.42em; font-weight: 600; line-height: 1.05; color: #ff2bd6; }   /* learned skill's name until it has art */
  @media (max-width: 760px) {
    .hud { display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 16px; gap: 8px 12px; }
    .abilities { order: 3; width: 100%; justify-content: center; }
    .hud-left, .hud-right, .stats, .right-row { gap: 10px; }
    .abilities { gap: 4px; }
    .inv-btn { margin-left: 12px; }
  }
  /* naming screen, shown over the grid at the start of a game */
  .naming[hidden] { display: none; }
  .naming { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
  .naming-box { background: #000; border: 2px solid var(--grid); padding: 28px 32px; display: grid; gap: 16px; max-width: calc(100% - 32px); box-sizing: border-box; }
  .naming-box h2 { margin: 0; font-size: 28px; }
  .naming-box input { font: 600 28px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--grid); background: transparent;
                      border: 0; border-bottom: 2px solid var(--grid); padding: 4px 0; width: 12ch; max-width: 100%; outline: none; }
  .naming-box input:focus-visible { border-bottom-color: #ffdc00; }
  .naming-box p { margin: 0; color: var(--muted); font-size: 16px; }
  .naming-box label { display: grid; gap: 4px; color: var(--muted); font-size: 16px; }
  .naming-box [hidden] { display: none; }
  .naming-box.form input { font-size: 22px; width: 22ch; }
  .naming-box .err { color: #e5484d; min-height: 1.4em; max-width: 30ch; }
  .naming-box .err.ok { color: #3ddc84; }
  .naming-box button:disabled { opacity: 0.5; cursor: default; }
  .naming-box button { font: 600 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #000; background: var(--grid); border: 0; padding: 10px 16px; cursor: pointer; justify-self: start; }
  .naming-box button:focus-visible { outline: 2px solid #ffdc00; outline-offset: 2px; }
  .naming-box a { color: #00e5ff; }
  .portrait { width: calc(var(--w) / 17); aspect-ratio: 1; background: #1B2233 center / cover no-repeat; flex: none; }   /* same size as a grid tile; placeholder for the hero's picture */
  .hero-col { display: grid; gap: 2px; }
  .hero-name { font-size: 0.7em; font-weight: 600; color: var(--grid); line-height: 1.1; }
  .counter { color: var(--muted); white-space: nowrap; }
  .right-col { display: grid; gap: 2px; justify-items: end; }
  .right-row { display: flex; gap: 24px; align-items: center; }
  .area-name { font-size: 0.7em; font-weight: 600; color: var(--muted); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.08em; }
  .counter b { color: var(--grid); font-weight: 600; }
  .stats { display: flex; gap: 24px; color: var(--grid); }
  .stat { display: inline-flex; align-items: baseline; gap: 10px; }
  .stat i { font-style: normal; font-size: 1.3em; line-height: 1; }
  .stat b { font-weight: 600; }
  .stat.hp i { color: #e5484d; }
  .stat.str i { color: #ff8a3d; }
  .stat.mana i { color: #4ea1ff; }
  .stat.nrg i { color: #9dff5c; }
  .stat.cha i { color: #b58cff; }
  .stat.gold i { color: #f5c542; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1360" height="880" aria-label="Game grid, 17 by 11 tiles"></canvas>
  <!-- account screen at the start: create an account (name, email, password) or log in. Accounts live in Supabase;
       a new account must be confirmed through the link Supabase emails before it can log in. -->
  <div class="naming" id="account" hidden>
    <form class="naming-box form" id="acc-form" role="dialog" aria-labelledby="acc-title" novalidate>
      <h2 id="acc-title">Create account</h2>
      <label id="acc-name-row">Hero name <input id="acc-name" maxlength="10" autocomplete="username" spellcheck="false"></label>
      <label>Email <input id="acc-email" type="email" autocomplete="email" spellcheck="false"></label>
      <label>Password <input id="acc-pass" type="password" autocomplete="new-password"></label>
      <p class="err" id="acc-err" role="alert"></p>
      <button type="submit" id="acc-submit">Create account</button>
      <p id="acc-resend-row" hidden><a href="#" id="acc-resend">Resend the confirmation email</a></p>
      <p><a href="#" id="acc-switch">Already have an account? Log in</a></p>
      <p><a href="#" id="acc-guest">Play as guest (no saving)</a></p>
      <p id="acc-hint">Name: letters only, up to 10 · password: 6+ characters. You'll get an email to confirm it's yours.</p>
    </form>
  </div>
  <!-- cheat password prompt (P) -->
  <div class="naming" id="cheat-lock" hidden>
    <form class="naming-box form" id="cheat-form" role="dialog" aria-labelledby="cheat-title">
      <h2 id="cheat-title">Cheats</h2>
      <label>Password <input id="cheat-pass" type="password" autocomplete="off"></label>
      <p class="err" id="cheat-err" role="alert"></p>
      <p>Enter to unlock · Esc to cancel</p>
    </form>
  </div>
</div>

<div class="hud">
  <div class="hud-left">
    <div class="portrait" id="portrait" role="img" aria-label="Hero portrait (placeholder)"></div>
    <div class="hero-col">
    <div class="hero-name" id="hud-name">hero</div>
    <div class="stats" aria-label="Hero stats">
      <span class="stat hp" title="Health"><i aria-hidden="true">&#x2665;&#xFE0E;</i><b id="stat-health">10</b></span>
      <span class="stat str" title="Strength"><i aria-hidden="true">&#x2694;&#xFE0E;</i><b id="stat-strength">1</b></span>
      <span class="stat mana" title="Mana"><i aria-hidden="true">&#x25C6;</i><b id="stat-mana">0</b></span>
    </div>
    </div>
  </div>
  <div class="abilities" aria-label="Abilities (empty)">
    <div class="ability"></div><div class="ability"></div><div class="ability"></div>
    <button class="inv-btn" id="inv-btn" title="Inventory (I)" aria-label="Inventory (I)"></button>
  </div>
  <div class="hud-right">
    <div class="right-col">
    <div class="area-name" id="area-name" title="Current area">city</div>
    <div class="right-row">
    <div class="stats">
      <span class="stat nrg" title="Energy"><i aria-hidden="true">&#x26A1;&#xFE0E;</i><b id="stat-energy">10</b></span>
      <span class="stat cha" title="Charisma"><i aria-hidden="true">&#x2726;</i><b id="stat-charisma">1</b></span>
      <span class="stat gold" title="Money"><i aria-hidden="true">$</i><b id="stat-money">0</b></span>
    </div>
    <div class="counter" title="Deals made at work">deals <b id="stat-deals">0</b></div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
  const COLS = 17, ROWS = 11, TILE = 80;
  // cheat menu (P) is locked behind a password; only its SHA-256 is kept here
  const CHEAT_HASH = '97c10efe01d5c9c88704a12d361d8429b3a6aa2412290a0773109d5d2d603d5e';
  // accounts + saves: Supabase (auth + a "saves" table, one row per player, protected by row-level security).
  // The publishable key is meant to be public; what each player can touch is decided by the table's rules.
  const SUPABASE_URL = 'https://kyrgawnhrqqkclyxldmx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ji4v4gBwHUkccCxS--2Yrg_VHulKUTM';
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;   // null if the library couldn't load
  const RETURN_URL = location.origin + location.pathname;   // the confirmation email links back to this page
  const STORE = { last: 'littlegame.lastEmail' };   // only used to pre-fill the email field
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  async function sha256(text) {
    if (crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (const ch of text) h = (h * 33 + ch.charCodeAt(0)) >>> 0; return 'x' + h.toString(16);   // fallback (non-https)
  }
  const SAVE_VERSION = 1;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  // ---- rules --------------------------------------------------------------
  const START_STATS = { health: 10, strength: 1, mana: 0, charisma: 1, money: 0, energy: 10 };
  // max values; mana's cap is 0 for now (things may raise it later). Other stats have no cap.
  const CAPS = { health: 10, energy: 20, mana: 0 };
  const BASE_CAPS = { ...CAPS };   // the cheat menu can raise CAPS; "new game" puts these back
  const capped = (st, v) => st in CAPS ? Math.min(CAPS[st], v) : v;
  const REST = { price: 1, gain: { health: 5, energy: 5, mana: 1 }, cooldownMs: 5 * 60 * 1000 };   // HomeDome: Space asks to rest for 1$; then 5 min (real time) until the next rest

  // price here is the starting price. Patches (patch: true): each purchase installs the next level (shown as "lvl N"
  // in the shop, starting at lvl 0) and raises that patch's price by 15%, rounded up.
  // Food: never rises on purchase; instead it inflates by FOOD_INFLATION after every work shift (shown rounded up).
  const SHOP_ITEMS = [
    { name: 'food',      price: 1,   gain: { energy: 10, health: 1 }, art: 'food' },
    { name: 'smile patch',   price: 30,  gain: { charisma: 1 }, patch: true, art: 'smilePatch' },
    { name: 'social patch',  price: 90,  gain: { charisma: 2 }, patch: true, art: 'socialPatch' },
    { name: 'persona patch', price: 240, gain: { charisma: 3 }, patch: true, art: 'personaPatch' },
    // class 'equipment': goes to the inventory, gives its bonus only once equipped (I → A/D → Space).
    // kind: only one item per kind (e.g. one sword), counting inventory and equipped items. Bought once.
    { name: 'banana sword', price: 400, gain: { strength: 4, charisma: 1 }, class: 'equipment', kind: 'sword', art: 'bananaSword' },
  ];
  // items that are never sold, only looted
  // class 'resource': stacks (up to `stack` per inventory slot), used for crafting later.
  // class 'skill': doesn't stack; Space in the inventory learns it and puts it in an ability slot (effects come later).
  const LOOT_ITEMS = [
    { name: 'tar',        class: 'resource', stack: 64, gain: {}, art: 'tart', value: 2 },   // value: price per piece (the Scrap Dealer pays this)
    { name: 'magic tar',  class: 'skill', gain: {}, art: 'magicTart' },
    { name: 'scrap',      class: 'resource', stack: 64, gain: {}, value: 1, art: 'scrap' },   // from selling equipment; also sold by the Scrap Dealer
  ];
  // Scrap Dealer (slums): buys equipment for 40% of its shop price plus 1% of that price in scrap (rounded down),
  // resources for 100% of their value (whole stack at once), and sells scrap for 2$ each. Skills and equipped items can't be sold.
  const SCRAP_DEALER = { equipShare: 0.4, scrapPerCost: 0.01, scrapPrice: 2 };
  const INVENTORY_SLOTS = 4;
  const ABILITY_SLOTS = 3;   // spell slots in the bar; keys 1 2 3 cast them
  // spells (learned from 'skill' items). Magic tar: a projectile toward the closest enemy, up to `range` tiles.
  // On hit the enemy can't move for `rootMs` and takes dot[0]–dot[1] damage every second, `ticks` times.
  const SPELLS = {
    'magic tar': { mana: 1, range: 5, speed: 9, rootMs: 3000, dot: [1, 2], ticks: 3, tickMs: 1000 },
  };
  // critical strike (spells only): 0.03% per charisma point, capped at 15%. A crit adds the hero's strength to the damage.
  const CRIT_PER_CHA = 0.0003, CRIT_CAP = 0.15;
  const HERO_MANA_REGEN_MS = 30000;   // hero gets 1 mana back every 30 s of game time (up to the mana cap)
  const EQUIP_SLOTS = 3;   // shown on the right of the hero view (H)
  const itemDef = name => SHOP_ITEMS.find(it => it.name === name) || LOOT_ITEMS.find(it => it.name === name);
  const DEFAULT_NAME = 'hero';
  const cleanName = v => v.replace(/[^\p{L}]/gu, '').slice(0, 10);   // letters only (any alphabet), up to 10
  const startPrices = () => Object.fromEntries(SHOP_ITEMS.map(it => [it.name, it.price]));
  const raisePrice = p => Math.ceil(p * 115 / 100);   // integer maths avoids float drift (60 * 1.15 = 68.999…)
  const FOOD_INFLATION = 0.0062;   // +0.62% food price per work shift → average run ≈ 1000 turns (see design notes)
  const shown = (name, p) => name === 'food' ? Math.ceil(p - 1e-9) : p;   // food keeps a fractional price internally

  // work: trade health for money, 3 random deals, all reroll after one is taken
  // charisma 1 → 1-4 health for 2-5 money; each extra charisma point adds +1 to max health risk
  // and +2 to max money, so risk keeps growing but each health point pays more
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const newDeals = cha => Array.from({ length: 3 }, () => ({ energy: rand(1, 3 + cha), money: rand(2, 3 + 2 * cha) }));   // work costs energy

  // solid things the hero can't walk through, in on-screen coordinates (column, row — counted from 1).
  // x, y = bottom-right tile of the footprint for even widths, bottom-centre for odd; w × h = footprint in tiles,
  // spreading left of x (and right for odd widths) and up from y. Art is centred on the whole footprint.
  // label: shown above it while the hero faces any of its tiles; opens: which window Space opens; art: picture key.
  // ---- razor wire -----------------------------------------------------------
  // Coils run along the city border and block the hero. Corner art has arms to the left and bottom;
  // rot = clockwise quarter turns: 0 = left+bottom, 1 = top+left, 2 = right+top, 3 = bottom+right.
  // Straight art runs left-right; rot 1 makes it run top-bottom. Tiles in on-screen coordinates (from 1).
  function cityCoils() {
    const c = [], add = (x, y, kind, rot) => c.push({ x, y, kind, rot });
    add(1, 1, 'corner', 3); add(17, 1, 'corner', 0); add(1, 11, 'corner', 2); add(17, 11, 'corner', 1);
    add(17, 6, 'corner', 2);   // right edge, above the exit: comes from the top, bends out of the map
    add(17, 9, 'corner', 3);   // right edge, below the exit: comes from the bottom, bends out of the map
    for (let x = 2; x <= 16; x++) { add(x, 1, 'straight', 0); add(x, 11, 'straight', 0); }
    for (let y = 2; y <= 10; y++) add(1, y, 'straight', 1);
    for (const y of [2, 3, 4, 5, 10]) add(17, y, 'straight', 1);   // 17/7 and 17/8 stay open (exit)
    return c;
  }

  // ---- areas ----------------------------------------------------------------
  // exits: stepping onto any of these tiles (column, row — counted from 1) takes the hero to another area,
  // arriving on the given column in the same row, facing `face`.
  const AREAS = {
    city: {
      walls: [
        { x: 2, y: 7, w: 2, h: 2, color: '#2e9e44', label: 'ATB-Market', opens: 'shop', art: 'shop', artW: 2.5 },
        // CaaCaanTeng noodle bar (closed, decorative): columns 6–8, rows 5–6. Solid, nothing to open.
        // Overlaps TradeCorp on 8/6; TradeCorp is drawn in front of it.
        { x: 7, y: 6, w: 3, h: 2, color: '#8a3a7a', label: 'CaaCaanTeng', art: 'noodleBar', artW: 3.2 },
        // hover-car charging station (decorative): columns 12–13, rows 5–6. Solid, no name, nothing to open.
        { x: 13, y: 6, w: 2, h: 2, color: '#3a4257', art: 'charging', artW: 2.3 },
        // front: true draws the picture in front of other buildings (not of the hero)
        { x: 9, y: 7, w: 2, h: 2, color: '#2f6fdb', label: 'TradeCorp', opens: 'work', art: 'work', artW: 2.5, front: true },
        // HomeDome apartments: columns 3–4, rows 3–6, front faces down (door toward row 7). Solid, no function yet.
        { x: 4, y: 6, w: 2, h: 4, color: '#f2f2f2', label: 'HomeDome', opens: 'rest', art: 'homedome', artW: 2.2 },
      ],
      decals: true,
      exits: [{ tiles: [[17, 7], [17, 8]], to: 'slums', arriveX: 2, face: 1 }],
      coils: cityCoils(),
      tar: { side: 'right', row: 7.5 },   // tar puddle at the exit: map edge, centred between rows 7 and 8
    },
    slums: {
      walls: [
        // Scrap Dealer: columns 13–16, rows 5–6 (right side of the slums). Space opens it.
        { x: 14, y: 6, w: 4, h: 2, color: '#6b4a2e', label: 'Scrap Dealer', opens: 'scrap', art: 'scrapDealer', artW: 4.5 },
      ],
      // floor details: more trash, leaves and stains, denser than the city, own layout
      decals: { chance: 1 / 3.5, seed: 7331, weights: { litter: 5, leaves: 5, 'oil stain': 3, crack: 2, 'crack web': 2,
                'puddle cyan': 1, 'puddle pink': 1, graffiti: 1, manhole: 0.5 } },
      exits: [{ tiles: [[1, 7], [1, 8]], to: 'city', arriveX: 16, face: -1 }],
      tar: { side: 'left', row: 7.5 },
    },
  };
  let areaName = 'city';
  let WALLS = AREAS.city.walls;
  // coils under a building are skipped (the building covers that tile)
  const coilAt = (x, y) => (AREAS[areaName].coils || []).find(c => c.x - 1 === x && c.y - 1 === y && !wallAt(x, y));
  const exitAt = (x, y) => AREAS[areaName].exits.find(e => e.tiles.some(([tx, ty]) => tx - 1 === x && ty - 1 === y));
  // footprint in 0-based tiles
  const foot = w => { const ww = w.w || 1, hh = w.h || 1, x0 = w.x - 1 - Math.floor(ww / 2) + (ww % 2 ? 0 : 1);
    return { x0, x1: x0 + ww - 1, y0: w.y - hh, y1: w.y - 1 }; };
  // where buildings overlap, the one you can open wins (e.g. TradeCorp over CaaCaanTeng on column 8)
  const wallAt = (x, y) => { const hits = WALLS.filter(w => { const f = foot(w); return x >= f.x0 && x <= f.x1 && y >= f.y0 && y <= f.y1; });
    return hits.find(w => w.opens) || hits[0]; };
  const inGrid = (x, y) => x >= 0 && x < COLS && y >= 0 && y < ROWS;
  const free = (x, y) => inGrid(x, y) && !wallAt(x, y) && !coilAt(x, y);
  const footCX = w => { const f = foot(w); return (f.x0 + f.x1 + 1) / 2; };   // footprint centre, in tiles
  const START = { x: 8, y: 7 };   // 0-based: column 9, row 8 (just below TradeCorp)

  // ---- enemies ----------------------------------------------------------------
  // Drip: half human, half oil slime. Lives in the middle of the slums (column 9, row 6).
  // When the hero comes within `aggro` tiles (diagonals count as 1) he chases at 1 tile per second
  // and keeps chasing until the hero leaves the slums. Next to the hero (diagonals too) he attacks once per second.
  // Each attack has a 33% chance to also cast Tart (costs 3 mana): the hero can't move for 2 s.
  // Mana comes back at 1 per 5 s. Beaten: lies as a puddle that can be looted (face it, Space) for money, tar and
  // a rare magic tar; comes back after 60 s or when the slums are re-entered (unlooted loot is lost then).
  // All timers run on game time, which stops while a window is open.
  const DRIP = { name: 'Drip', hp: 10, atk: [1, 2], mana: 3, manaRegenMs: 5000, aggro: 4, stepMs: 1000, attackMs: 1000,
                 windupMs: 400, tart: { chance: 1 / 3, cost: 3, rootMs: 2000 }, respawnMs: 60000,
                 loot: { money: [4, 8], tar: [0, 1], magicTarChance: 0.01 },   // rolled when he dies, taken with Space
                 spawn: { x: 9, y: 6 } };   // spawn in on-screen coordinates (from 1)
  const HERO_ATTACK_MS = 1000;   // hero: Space while facing an enemy hits for `strength`, at most once per second
  // sprite calibration (px in each image): body = hood top to puddle bottom, ax = puddle centre in a cell
  const DRIP_ART = { idle: { frames: 1, body: 288, ax: 164.5 }, attack: { frames: 4, body: 198, ax: 241 }, hurt: { frames: 2, body: 334, ax: 203.5 } };
  const DRIP_BODY = 1.5;   // tiles from hood top to puddle bottom (hero is 1.75 tiles tall)

  // ---- art (drawn over the tile grid; the grid still does all collision) ----
  // hero: smooth chibi art from ChatGPT, facing right; flipped for left. Feet sit on the bottom-centre of his tile.
  // art files are published next to this page in the art/ folder (not embedded), so the game file stays small
  const ART_SRC = {
    heroSprite:   'art/heroSprite.png',
    heroFull:     'art/heroFull.png',
    heroPunchSide: 'art/heroPunchSide.png', heroPunchDown: 'art/heroPunchDown.png', heroPunchUp: 'art/heroPunchUp.png',   // attack sheets, 4 frames each
    heroSwordSide: 'art/heroSwordSide.png', heroSwordDown: 'art/heroSwordDown.png', heroSwordUp: 'art/heroSwordUp.png',
    heroWalk:     'art/heroWalk.png',   // 4 walk frames side by side, facing right
    heroWalkDown: 'art/heroWalkDown.png',   // 4 walk frames facing the viewer
    heroWalkUp:   'art/heroWalkUp.png',   // 4 walk frames seen from behind
    shop:         'art/shop.png',   // shop building (mirrored: awning on the right)
    work:         'art/work.png',   // work building, 3 x 2 tile footprint
    invIcon:      'art/invIcon.png',   // inventory button (backpack)
    slot:         'art/slot.png',   // slot frame: inventory, equipment, abilities, inventory button
    bananaSword:  'art/bananaSword.png',   // item icon
    ground:       'art/ground.jpg',   // seamless street floor, no joints (repeats every 6 x 6 tiles)
    decals:       'art/decals.png',   // 16 floor details, 4 x 4 cells
    wireStraight: 'art/wireStraight.png',   // razor-wire coil, horizontal, joins left/right
    wireCorner:   'art/wireCorner.png',   // razor-wire corner, arms to the left and bottom
    tar:          'art/tar.png',   // tar puddle flowing in from the right edge (mirrored for the left edge)
    homedome:     'art/homedome.png',   // HomeDome apartments, front view (faces down)
    noodleBar:    'art/noodleBar.png',   // CaaCaanTeng noodle bar, front view, closed
    charging:     'art/charging.png',   // hover-car charging station, front view
    food: 'art/food.png',   // noodle bowl item icon
    dripIdle: 'art/dripIdle.png',   // Drip, idle / combat stance, faces left
    dripAttack: 'art/dripAttack.png',   // Drip attack, 4 equal cells, faces left
    dripHurt: 'art/dripHurt.png',   // Drip hurt + defeated, 2 equal cells
    dripPortrait: 'art/dripPortrait.png',   // Drip portrait 256x256
    smilePatch: 'art/smilePatch.png',   // smile patch item icon
    socialPatch: 'art/socialPatch.png',   // social patch item icon
    personaPatch: 'art/personaPatch.png',   // persona patch item icon
    tart: 'art/tart.png',   // tart resource icon
    magicTart: 'art/magicTart.png',   // magic tart item + spell icon
    scrapDealer: 'art/scrapDealer.png',   // slums scrap dealer building, front turned slightly left
    scrap: 'art/scrap.png',   // scrap resource icon
    heroPortrait: 'art/heroPortrait.png',
  };
  const ART = Object.fromEntries(Object.entries(ART_SRC).map(([k, src]) => { const im = new Image(); im.src = src; return [k, im]; }));
  const ready = im => im && im.complete && im.naturalWidth > 0;
  const WALK_FRAMES = 4, FRAMES_PER_TILE = 2;   // walk cycle: 2 frames per tile stepped, full cycle every 2 tiles
  const HERO_H = 1.75;   // hero sprite height in tiles (his head overlaps the tile above)
  // hero attack animations: 4 frames per sheet; side sheets face right (mirrored for left).
  // Cells are aligned on the boots: ax = boots centre x, foot = px from the cell bottom to the soles. The hero is 277 px tall
  // in every sheet, like the 280 px walk frames, so they share one scale.
  const HERO_ATTACK_SHEETS = { punch: { side: 'heroPunchSide', down: 'heroPunchDown', up: 'heroPunchUp' },
                               sword: { side: 'heroSwordSide', down: 'heroSwordDown', up: 'heroSwordUp' } };
  const ATTACK_CELLS = {
    heroPunchSide: { cellW: 275, cellH: 283, ax: 98.0, foot: 2.1 },
    heroPunchDown: { cellW: 183, cellH: 283, ax: 91.3, foot: 5.0 },
    heroPunchUp: { cellW: 214, cellH: 356, ax: 95.7, foot: 5.3 },
    heroSwordSide: { cellW: 332, cellH: 341, ax: 137.0, foot: 3.5 },
    heroSwordDown: { cellW: 219, cellH: 405, ax: 106.0, foot: 31.2 },
    heroSwordUp: { cellW: 281, cellH: 389, ax: 147.8, foot: 3.6 }
  };
  const HERO_ATTACK_ANIM_MS = 400;   // 4 frames × 100 ms

  const ICON = { health: '♥', strength: '⚔\uFE0E', mana: '◆', charisma: '✦', money: '$', energy: '⚡\uFE0E' };

  function start(saved) {
    if (saved.areaName && AREAS[saved.areaName]) { areaName = saved.areaName; WALLS = AREAS[areaName].walls; }
    const player = { x: saved.x ?? START.x, y: saved.y ?? START.y };
    if (!free(player.x, player.y)) { player.x = START.x; player.y = START.y; }   // e.g. a building moved onto him
    // facing direction: right by default, then whichever movement button was pressed last
    const facing = { x: saved.fx ?? 1, y: saved.fy ?? 0 };
    const stats = { ...START_STATS, ...(saved.stats || {}) };
    for (const st in CAPS) stats[st] = capped(st, stats[st]);   // older saves may be over the current caps
    let deals = saved.deals || newDeals(stats.charisma);
    let dealsDone = saved.dealsDone ?? 0;   // how many work deals the hero has taken this run
    let heroName = saved.heroName ?? null;  // the account's name
    let account = null;                     // logged-in Supabase user { id, email }, or null (account screen shows)
    // save slots: 1 = autosave (only the game writes it), 2 and 3 = manual. Online per account, or in this browser when offline.
    let slotInfo = { state: 'loading', slots: {} };   // slots[n] = { state, at, summary }
    let cheatsUnlocked = false;             // after the right password, for this page visit
    const inventory = saved.inventory ? saved.inventory.map(it => ({ ...it, name: { 'tart': 'tar', 'magic tart': 'magic tar' }[it.name] || it.name })) : [];   // [{ name, kind, class }] — no bonuses while here
    const equipped = saved.equipped ? [...saved.equipped] : [];      // equipped items — their bonuses apply
    let restReadyAt = saved.restReadyAt ?? 0;   // Date.now() when the HomeDome can be used again
    const RENAMED = { 'tart': 'tar', 'magic tart': 'magic tar' };   // older saves used these item names
    const skills = saved.skills ? saved.skills.map(s => RENAMED[s] || s) : [];            // learned skill names, shown in the ability slots
    const carried = () => [...inventory, ...equipped];
    const prices = { ...startPrices(), ...(saved.prices || {}) };
    const startLevels = () => Object.fromEntries(SHOP_ITEMS.filter(it => it.patch).map(it => [it.name, 0]));
    const levels = { ...startLevels(), ...(saved.levels || {}) };   // installed level of each patch
    // open window: null, or { kind: 'shop' | 'work' | 'menu', cursor, msg }
    let ui = null;
    window.claude?.hot?.snapshot?.(() => ({ x: player.x, y: player.y, fx: facing.x, fy: facing.y, stats, deals, prices, dealsDone, heroName, inventory, equipped, skills, areaName, restReadyAt, levels }));

    document.getElementById('portrait').style.backgroundImage = `url(${ART_SRC.heroPortrait})`;
    document.getElementById('inv-btn').style.backgroundImage = `url(${ART_SRC.invIcon}), url(${ART_SRC.slot})`;
    document.querySelectorAll('.ability').forEach(el => el.style.backgroundImage = `url(${ART_SRC.slot})`);
    let lookX = facing.x < 0 ? -1 : 1;
    let stepsTaken = 0;   // drives the walk animation
    let moveDir = { x: 0, y: 0 };   // direction of the current step (picks the walk sheet)   // which way the sprite faces (keeps the last left/right when moving up/down)

    function renderStats() {
      document.getElementById('portrait').title = heroName || DEFAULT_NAME;
      document.getElementById('hud-name').textContent = heroName || DEFAULT_NAME;
      document.getElementById('stat-deals').textContent = dealsDone;
      document.getElementById('area-name').textContent = areaName;
      document.getElementById('stat-health').textContent = stats.health;
      document.getElementById('stat-energy').textContent = stats.energy;
      document.getElementById('stat-strength').textContent = stats.strength;
      document.getElementById('stat-mana').textContent = stats.mana;
      document.getElementById('stat-charisma').textContent = stats.charisma;
      document.getElementById('stat-money').textContent = stats.money;
      document.querySelectorAll('.ability').forEach((el, i) => {   // learned spells: icon over the slot frame, key number in the corner
        const sp = skills[i], art = sp && ART_SRC[(itemDef(sp) || {}).art];
        el.style.backgroundImage = art ? `url(${art}), url(${ART_SRC.slot})` : `url(${ART_SRC.slot})`;
        el.style.backgroundSize = art ? '62%, 100%' : '100%';
        el.textContent = sp && !art ? sp : '';
        el.dataset.key = sp ? String(i + 1) : '';
        el.title = sp ? `${sp} · key ${i + 1} · ${SPELLS[sp] ? SPELLS[sp].mana + ' mana' : ''}` : 'empty spell slot';
      });
    }
    renderStats();

    // ---- windows ------------------------------------------------------------
    // each row: { left, right, act() -> message }
    function rows() {
      if (!ui) return [];
      if (ui.kind === 'shop') return SHOP_ITEMS.map(it => {
        const gains = Object.entries(it.gain);
        const owned = it.kind && carried().some(x => x.name === it.name);
        return {
          left: it.patch ? `${it.name}  lvl ${levels[it.name]}` : it.name,
          pic: it.art || '', item: it.art ? { name: it.name } : null,   // '' = empty picture slot
          right: `${gains.map(([st, n]) => `+${n} ${ICON[st]}`).join(' ')}   ${owned ? 'owned' : shown(it.name, prices[it.name]) + '$'}`,
          act() {
            const price = shown(it.name, prices[it.name]);
            if (owned) return `You already have the ${it.name}.`;
            if (it.kind && carried().some(x => x.kind === it.kind)) return `You can only carry one ${it.kind}.`;
            if (it.kind && inventory.length >= INVENTORY_SLOTS) return 'Your inventory is full.';
            if (stats.money < price) return `Not enough money for ${it.name}.`;
            // refuse only if nothing it gives can go up (food still helps when only energy or only health is full)
            if (gains.every(([st]) => st in CAPS && stats[st] >= CAPS[st]))
              return gains.length > 1 ? 'You are already full.' : `Your ${gains[0][0]} is already full (${CAPS[gains[0][0]]}).`;
            stats.money -= price;
            if (it.class === 'equipment') {   // no bonus until equipped
              inventory.push({ name: it.name, kind: it.kind, class: it.class });
              return `Got the ${it.name}. Equip it in your inventory (I, Space).`;
            }
            for (const [st, n] of gains) stats[st] = capped(st, stats[st] + n);
            if (it.gain.charisma) deals = newDeals(stats.charisma);
            if (it.name !== 'food') prices[it.name] = raisePrice(price);
            if (it.patch) { levels[it.name]++; return `Installed ${it.name} lvl ${levels[it.name]}. Next: ${prices[it.name]}$.`; }
            return it.name === 'food' ? `Bought ${it.name}.` : `Bought ${it.name}. Now ${prices[it.name]}$.`;
          },
        };
      });
      if (ui.kind === 'work') return deals.map(d => ({
        left: `use ${d.energy ?? d.health} ${ICON.energy}`, right: `get ${d.money}$`,
        act() {
          const cost = d.energy ?? d.health;   // older saved deals used "health"
          if (stats.energy < cost) return 'Not enough energy for that deal. Eat something.';
          stats.energy -= cost; stats.money += d.money; dealsDone++;
          prices.food *= 1 + FOOD_INFLATION;
          deals = newDeals(stats.charisma);
          return `Worked: -${cost} ${ICON.energy}, +${d.money}$. New deals.`;
        },
      }));
      if (ui.kind === 'menu') return [
        { left: 'continue', right: '', act() { ui = null; } },
        { left: 'restart', right: '', act() { openWindow('restart', 1, fromHere()); } },
        { left: 'save', right: account ? '' : 'account needed', gapBefore: true, act() { account ? openSlots('save') : openWindow('guest', 0, fromHere()); } },
        { left: 'load game', right: account ? '' : 'account needed', act() { account ? openSlots('load') : openWindow('guest', 0, fromHere()); } },
        { left: 'controls', right: '', gapBefore: true, act() { openWindow('controls', 0, fromHere()); } },
        account ? { left: 'log out', right: heroName || '', gapBefore: true, act() { openWindow('logout', 1, fromHere()); } }
                : { left: 'create account / log in', right: '', gapBefore: true, act() { openWindow('guest', 0, fromHere()); } },
      ];
      if (ui.kind === 'guest') return [
        { left: 'create account', right: '', act() { toAccount('create'); } },
        { left: 'log in', right: '', act() { toAccount('login'); } },
        { left: 'keep playing', right: '', act() { ui = null; } },
      ];
      if (ui.kind === 'restart') return [
        { left: 'yes', right: '', act() { newGame(); autosave(true); } },
        { left: 'no', right: '', act() { goBack(); } },
      ];
      if (ui.kind === 'logout') return [
        { left: 'log out', right: '', act() { logOut(); } },
        { left: 'stay', right: '', act() { ui = null; } },
      ];
      if (ui.kind === 'save' || ui.kind === 'load') {
        const saving = ui.kind === 'save';
        if (slotInfo.state === 'loading') return [{ left: 'loading saves…', right: '', act() {} }];
        if (slotInfo.state === 'error') return [{ left: "couldn't reach your saves", right: 'retry', act() { refreshSlots(); return 'Retrying…'; } }];
        return [1, 2, 3].map(n => {
          const s = slotInfo.slots[n], label = n === 1 ? 'autosave' : `slot ${n}`;
          return {
            left: label, right: s ? `${s.summary} · ${when(s.at)}` : 'empty', dim: saving && n === 1,
            act() {
              if (saving) {
                if (n === 1) return 'The autosave slot is written by the game only.';
                writeSlot(n).then(err => { if (ui && ui.kind === 'save') ui.msg = err ? `Save failed: ${err}` : `Saved to slot ${n}.`; });
                return 'Saving…';
              }
              if (!s) return 'This slot is empty.';
              applySave(s.state); ui = null; float('game loaded', '#3ddc84', player.x + 0.5, player.y - 0.8);
            },
          };
        });
      }
      if (ui.kind === 'loot') return lootRows();
      if (ui.kind === 'cheat') return cheatRows();
      if (ui.kind === 'scrap') return scrapRows();
      if (ui.kind === 'rest') {
        const wait = restReadyAt - Date.now();
        const clock = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
        if (wait > 0) return [{ left: 'not tired yet', right: `rest again in ${clock(wait)}`, act() { return 'You rested recently. Come back later.'; } }];
        return [{
        left: `rest for ${REST.price}$?`, right: Object.entries(REST.gain).map(([st, n]) => `+${n} ${ICON[st]}`).join('  '),
        act() {
          if (stats.money < REST.price) return `Not enough money to rest (${REST.price}$).`;
          const up = Object.entries(REST.gain).map(([st, n]) => [st, capped(st, stats[st] + n) - stats[st]]).filter(([, d]) => d > 0);
          if (!up.length) return 'You are already fully rested.';
          stats.money -= REST.price;
          for (const [st, d] of up) stats[st] += d;
          restReadyAt = Date.now() + REST.cooldownMs;
          ui = null;   // rested: close the popup and show what came back over the hero
          const colors = { health: '#e5484d', energy: '#9dff5c', mana: '#4ea1ff' };
          up.forEach(([st, d], i) => float(`+${d} ${ICON[st]}`, colors[st], player.x + 0.5, player.y - 0.6 - 0.45 * i));
        },
      }];
      }
      if (ui.kind === 'gameover') return [{ left: 'new game', right: '', act() { newGame(); } }];
      if (ui.kind === 'controls') return CONTROLS.map(([key, what]) => ({ left: key, right: what, act() {} }));
      return [];
    }
    function newGame() {
      Object.assign(stats, START_STATS); dealsDone = 0; Object.assign(prices, startPrices()); deals = newDeals(stats.charisma);
      enterArea('city', START.x, START.y, 1, true);
      inventory.length = 0; equipped.length = 0; skills.length = 0; restReadyAt = 0; Object.assign(levels, startLevels());
      rootedUntil = 0; floaters.length = 0; Object.assign(CAPS, BASE_CAPS);
      ui = null; closePanels();
    }

    // ---- saving -------------------------------------------------------------------
    // everything a run needs; drip/fights/timers restart when loaded
    function snapshot() {
      return { x: player.x, y: player.y, fx: facing.x, fy: facing.y, stats: { ...stats }, deals, prices: { ...prices }, dealsDone,
               inventory: inventory.map(it => ({ ...it })), equipped: equipped.map(it => ({ ...it })), skills: [...skills],
               areaName, restReadyAt, levels: { ...levels }, manaCap: CAPS.mana };
    }
    function applySave(s) {
      Object.assign(CAPS, BASE_CAPS, s.manaCap !== undefined ? { mana: s.manaCap } : {});
      Object.assign(stats, START_STATS, s.stats || {});
      deals = s.deals || newDeals(stats.charisma); dealsDone = s.dealsDone || 0;
      Object.assign(prices, startPrices(), s.prices || {}); Object.assign(levels, startLevels(), s.levels || {});
      inventory.length = 0; inventory.push(...(s.inventory || []));
      equipped.length = 0; equipped.push(...(s.equipped || []));
      skills.length = 0; skills.push(...(s.skills || []));
      restReadyAt = s.restReadyAt || 0; rootedUntil = 0; floaters.length = 0; closePanels();
      const area = AREAS[s.areaName] ? s.areaName : 'city';
      enterArea(area, s.x ?? START.x, s.y ?? START.y, s.fx || 1, true);
      facing.x = s.fx ?? 1; facing.y = s.fy ?? 0;
      if (!free(player.x, player.y)) { player.x = START.x; player.y = START.y; fromX = player.x; fromY = player.y; }
      renderStats();
    }
    // ---- save slots -----------------------------------------------------------------
    // online: one row per (player, slot) in the "saves" table. Offline: localStorage.
    // guests can't save; a guest run is parked here when they go to create an account, and picked up after the first login
    const GUEST_RUN = 'littlegame.guestRun';
    const when = t => { const d = new Date(t); return `${d.getDate()} ${d.toLocaleString('en', { month: 'short' })} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
    const summarize = s => `${s.stats?.money ?? 0}$ · ${s.areaName || 'city'}`;
    async function listSlots() {   // -> { slots } or { error }
      const slots = {};
      if (!account || !sb) return { slots };   // guest: nothing saved
      const { data, error } = await sb.from('saves').select('slot, state, updated_at').eq('user_id', account.id);
      if (error) { console.warn(error); return { error: error.message }; }
      for (const r of data) if (r.slot >= 1 && r.slot <= 3) slots[r.slot] = { state: r.state, at: r.updated_at, summary: summarize(r.state) };
      return { slots };
    }
    async function refreshSlots() {
      slotInfo = { state: 'loading', slots: slotInfo.slots };
      const { slots, error } = await listSlots();
      slotInfo = error ? { state: 'error', slots: {}, error } : { state: 'ready', slots };
    }
    function openSlots(kind) { openWindow(kind, kind === 'save' ? 1 : 0, fromHere()); refreshSlots(); }
    const fromHere = () => ui && { kind: ui.kind, cursor: ui.cursor, back: ui.back };   // the window to come back to
    async function writeSlot(n) {   // -> error text, or null when saved
      const state = { version: SAVE_VERSION, ...snapshot() }, at = new Date().toISOString();
      if (!account || !sb) return 'guests can’t save';
      const { error } = await sb.from('saves').upsert({ user_id: account.id, slot: n, hero_name: heroName, state, updated_at: at }, { onConflict: 'user_id,slot' });
      if (error) { console.warn(error); return error.message; }
      slotInfo.slots[n] = { state, at, summary: summarize(state) };
      return null;
    }
    // autosave into slot 1: every 2 minutes of play, and when changing area (at most once per 5 s)
    const AUTOSAVE_MS = 2 * 60 * 1000;
    let lastAutosave = 0, lastWrite = 0;
    function autosave(force) {
      if (!account || !heroName || naming() || locked() || stats.health <= 0) return;
      if (!force && Date.now() - lastWrite < 5000) return;
      lastAutosave = lastWrite = Date.now(); writeSlot(1);
    }
    setInterval(() => { if (Date.now() - lastAutosave >= AUTOSAVE_MS) autosave(); }, 10000);
    // Scrap Dealer window: first row buys 1 scrap, then one row per inventory slot to sell it
    function scrapRows() {
      const S = SCRAP_DEALER, done = msg => { ui.cursor = Math.min(ui.cursor, inventory.length); return msg; };
      const list = [{ left: 'buy scrap', item: { name: 'scrap' }, pic: 'scrap', right: `-${S.scrapPrice}$`, act() {
        if (stats.money < S.scrapPrice) return `Not enough money (${S.scrapPrice}$).`;
        if (addItem('scrap', 1)) return 'Your inventory is full.';
        stats.money -= S.scrapPrice; return `Bought 1 scrap for ${S.scrapPrice}$.`;
      } }];
      inventory.forEach((it, idx) => {
        const def = itemDef(it.name) || {}, n = it.count || 1;
        const row = { left: `sell ${it.name}`, item: { name: it.name, count: n }, pic: it.name };
        if (def.class === 'equipment') {
          const money = Math.round(def.price * S.equipShare), scrap = Math.floor(def.price * S.scrapPerCost);
          row.right = `+${money}$${scrap ? `  +${scrap} scrap` : ''}`;
          row.act = () => {
            inventory.splice(idx, 1); stats.money += money;
            const lost = scrap ? addItem('scrap', scrap) : 0;
            return done(`Sold ${it.name}: +${money}$${scrap ? `, +${scrap - lost} scrap` : ''}${lost ? ` (${lost} scrap didn't fit)` : ''}.`);
          };
        } else if (def.class === 'resource') {
          const money = (def.value || 0) * n;
          row.right = `×${n}  +${money}$`;
          row.act = () => { inventory.splice(idx, 1); stats.money += money; return done(`Sold ${n} ${it.name}: +${money}$.`); };
        } else {
          row.right = "won't buy";
          row.act = () => `The dealer doesn't buy ${def.class === 'skill' ? 'skills' : 'that'}.`;
        }
        list.push(row);
      });
      return list;
    }

    // ---- cheat menu (P) — FOR TESTING ONLY, remove before release -----------------------
    function cheatRows() {
      const row = (left, right, act) => ({ left, right, act() { const m = act(); renderStats(); return m; } });
      const give = (name, n) => { const left = addItem(name, n); return left ? `Inventory full: ${n - left} of ${n} ${name} added.` : `Added ${n} ${name}.`; };
      return [
        row('money', '+500$', () => { stats.money += 500; return '+500$.'; }),
        row('refill', 'full ♥ ⚡ ◆', () => { for (const st in CAPS) stats[st] = CAPS[st]; return 'Health, energy and mana refilled.'; }),
        row('mana cap', `+3 (now ${CAPS.mana})`, () => { CAPS.mana += 3; stats.mana = CAPS.mana; return `Mana cap ${CAPS.mana}, mana full.`; }),
        row('charisma', '+10 ✦', () => { stats.charisma += 10; deals = newDeals(stats.charisma); return `Charisma ${stats.charisma}.`; }),
        row('strength', '+5 ⚔', () => { stats.strength += 5; return `Strength ${stats.strength}.`; }),
        row('magic tar', 'into inventory', () => give('magic tar', 1)),
        row('tar', '+10 into inventory', () => give('tar', 10)),
        row('banana sword', 'into inventory', () => { if (inventory.length >= INVENTORY_SLOTS) return 'Inventory full.'; inventory.push({ name: 'banana sword', kind: 'sword', class: 'equipment' }); return 'Added banana sword.'; }),
        row('rest cooldown', 'reset', () => { restReadyAt = 0; return 'HomeDome can be used again.'; }),
        row('Drip', areaName !== 'slums' ? 'only in the slums' : drip && !drip.dead ? 'defeat (loot drops)' : 'respawn', () => {
          if (areaName !== 'slums' || !drip) return 'Drip lives in the slums.';
          if (drip.dead) { spawnDrip(); return 'Drip is back.'; }
          damageDrip(drip.hp, 'cheat', '#8a8a8a'); return 'Drip defeated. His loot is on the puddle.';
        }),
        row('go to', areaName === 'city' ? 'slums' : 'city', () => {
          const to = areaName === 'city' ? 'slums' : 'city';
          ui = null; enterArea(to, to === 'city' ? START.x : 1, to === 'city' ? START.y : 7, 1);
        }),
      ];
    }
    const TITLES = { shop: 'ATB-Market', work: 'TradeCorp', menu: 'Menu', controls: 'Controls', hero: 'Hero', inventory: 'Inventory', gameover: 'Game over', loot: 'Loot · Drip', rest: 'HomeDome', cheat: 'Cheats (testing)', scrap: 'Scrap Dealer',
                     restart: 'Restart', save: 'Save', load: 'Load game', logout: 'Log out', guest: 'Playing as guest' };
    // windows with a paragraph above their options
    const WINDOW_TEXT = {
      restart: 'Are you sure?',
      guest: 'Guests can’t save. Create a free account to keep this run, or log in to continue a saved one.',
      logout: 'Log out? Sure. Leave your hero alone in a neon city crawling with gangs, killer drones, and things lurking in dark alleys. Without you, they’ll be robbed, hunted, and probably found face-down in a puddle under a flickering noodle sign. But hey, I’m sure you have VERY important things to do.',
    };
    const CONTROLS = [
      ['W A S D', 'move'],
      ['two keys, e.g. W+D', 'move diagonally'],
      ['Space', 'open / select'],
      ['Space (facing an enemy)', 'attack'],
      ['Space (facing a beaten enemy)', 'loot'],
      ['Esc', 'back to the previous window / close'],
      ['Esc (nothing open)', 'menu'],
      ['H', 'hero (left)'],
      ['I', 'inventory (bottom right)'],
      ['H / I (both open)', 'switch focus'],
      ['W / S (hero)', 'choose equipped item'],
      ['Space (hero)', 'unequip'],
      ['A / D (inventory)', 'choose a slot'],
      ['Space (inventory)', 'equip / learn'],
      ['W / S', 'choose in a window'],
      ['1 2 3', 'pick a row (window) / cast spell'],
    ];

    // windows opened from another window remember it: Esc (or "no") goes back there instead of closing everything
    function openWindow(kind, cursor = 0, back = null) {
      ui = { kind, cursor, msg: '', back };
      held.clear(); tapped.clear();
    }
    const locked = () => !!ui && ui.kind === 'gameover';   // only "new game" gets you out
    function closeWindow() { if (!locked()) ui = null; }

    // side panels: inventory (bottom right) and hero (middle left) can be open at the same time.
    // Keys go to the focused one: the last one opened (H / I on an open but unfocused panel focuses it; a click too).
    // Like other windows they pause the game and stop the hero from walking. Esc closes everything.
    const panels = { inventory: null, hero: null };   // each: { cursor, msg } or null
    let focus = null;                                 // 'inventory' | 'hero' | null
    const anyOpen = () => !!ui || !!panels.inventory || !!panels.hero;
    function togglePanel(name) {
      if (locked()) return;
      if (!panels[name]) { panels[name] = { cursor: 0, msg: '' }; focus = name; held.clear(); tapped.clear(); }
      else if (focus !== name) focus = name;
      else { panels[name] = null; const other = name === 'hero' ? 'inventory' : 'hero'; focus = panels[other] ? other : null; }
    }
    function closePanels() { panels.inventory = panels.hero = null; focus = null; }
    function closeAll() { if (locked()) return; ui = null; closePanels(); }

    function choose(i) {
      const list = rows();
      if (!ui || i < 0 || i >= list.length) return;
      ui.cursor = i;
      const msg = list[i].act();
      if (ui) ui.msg = msg || '';
      renderStats();
    }
    function moveCursor(d) {
      const n = rows().length;
      if (ui && n) { ui.cursor = (ui.cursor + d + n) % n; ui.msg = ''; }
    }

    // equip the selected inventory item: only class 'equipment'; bonuses apply from now on
    // Space in the inventory: equipment is equipped, a skill is learned, resources just sit there
    function useSelected(pn) {
      const item = inventory[pn.cursor];
      if (!item) { pn.msg = 'This slot is empty.'; return; }
      const def = itemDef(item.name) || {};
      if (def.class === 'skill') {
        if (skills.includes(item.name)) { pn.msg = `You already know ${item.name}.`; return; }
        if (skills.length >= ABILITY_SLOTS) { pn.msg = 'No free spell slot.'; return; }
        inventory.splice(pn.cursor, 1); skills.push(item.name);
        pn.msg = `Learned ${item.name}: spell slot ${skills.length}, key ${skills.length}.`;
        renderStats(); return;
      }
      if (def.class === 'resource') { pn.msg = `${item.name} is a resource, used for crafting later.`; return; }
      equipSelected(item, def, pn);
    }
    // Space on an equipped slot in the hero panel: the item goes back to the backpack and its bonuses are removed
    function unequipSelected(pn) {
      const item = equipped[pn.cursor];
      if (!item) { pn.msg = 'Nothing equipped in this slot.'; return; }
      if (inventory.length >= INVENTORY_SLOTS) { pn.msg = 'Your inventory is full.'; return; }
      const def = itemDef(item.name) || { gain: {} };
      equipped.splice(pn.cursor, 1);
      inventory.push(item);
      const gains = Object.entries(def.gain);
      for (const [st, n] of gains) stats[st] -= n;
      if (def.gain.charisma) deals = newDeals(stats.charisma);
      pn.cursor = Math.min(pn.cursor, Math.max(0, equipped.length - 1));
      pn.msg = `Unequipped the ${item.name}: ${gains.map(([st, n]) => `-${n} ${ICON[st]}`).join(' ')}`;
      renderStats();
    }
    function equipSelected(item, def, pn) {
      if (!def || def.class !== 'equipment') { pn.msg = `The ${item.name} can't be equipped.`; return; }
      if (equipped.length >= EQUIP_SLOTS) { pn.msg = 'No free equipment slot.'; return; }
      inventory.splice(pn.cursor, 1);
      equipped.push(item);
      const gains = Object.entries(def.gain);
      for (const [st, n] of gains) stats[st] += n;
      if (def.gain.charisma) deals = newDeals(stats.charisma);
      pn.msg = `Equipped the ${item.name}: ${gains.map(([st, n]) => `+${n} ${ICON[st]}`).join(' ')}`;
      renderStats();
    }

    // Space: open the tile the hero faces, pick the highlighted row, or equip in the inventory
    function spacePressed() {
      if (ui) { choose(ui.cursor); return; }
      if (focus === 'inventory' && panels.inventory) { useSelected(panels.inventory); return; }
      if (focus === 'hero' && panels.hero) { unequipSelected(panels.hero); return; }
      if (moving) return;
      if (dripAt(player.x + facing.x, player.y + facing.y)) { heroAttack(); return; }
      if (lootable()) { openWindow('loot'); return; }
      const w = wallAt(player.x + facing.x, player.y + facing.y);
      if (w && w.opens) openWindow(w.opens);
    }
    function goBack() { const b = ui.back; openWindow(b.kind, b.cursor, b.back); }
    function escPressed() {   // Esc: back to the previous window, or close everything, or open the menu
      if (locked()) return;
      if (ui && ui.back) goBack();
      else if (anyOpen()) closeAll();
      else openWindow('menu');
    }   // Esc: close everything, or open the menu

    // ---- combat -----------------------------------------------------------------
    let gameTime = 0, lastFrame = performance.now();   // game clock: stops while a window is open
    let drip = null;   // the slums enemy, or null in other areas
    let rootedUntil = 0;   // Tart: hero can't move until this game time
    let heroNextAttack = 0, heroHurtStart = -1e9, heroAttackStart = -1e9, heroAttackDir = 'side';
    const hasSword = () => equipped.some(it => it.kind === 'sword');
    const floaters = [];   // rising combat text: { text, color, x, y, t } (x, y in tiles)
    const float = (text, color, x, y) => floaters.push({ text, color, x, y, t: gameTime });
    const dripAt = (x, y) => drip && !drip.dead && drip.x === x && drip.y === y;
    const heroFree = (x, y) => free(x, y) && !dripAt(x, y);
    const cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));

    function spawnDrip() {
      let sx = DRIP.spawn.x - 1, sy = DRIP.spawn.y - 1;
      if (!free(sx, sy) || (sx === player.x && sy === player.y)) {   // nearest free tile that isn't the hero's
        let best = null;
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
          if (!free(x, y) || exitAt(x, y) || (x === player.x && y === player.y)) continue;
          const d = Math.hypot(x - sx, y - sy); if (!best || d < best.d) best = { x, y, d };
        }
        if (best) { sx = best.x; sy = best.y; }
      }
      drip = { x: sx, y: sy, fromX: sx, fromY: sy, stepStart: -1e9, hp: DRIP.hp, mana: DRIP.mana, manaT: gameTime,
               aggro: false, nextAttack: 0, attackStart: -1e9, hitAt: 0, hurtStart: -1e9, dead: false, deadAt: 0, lookX: -1 };
    }

    function updateDrip() {
      if (!drip) return;
      const t = gameTime;
      if (drip.dead) { if (t - drip.deadAt >= DRIP.respawnMs) spawnDrip(); return; }
      while (drip.dot && t >= drip.dot.next) {   // magic tar damage over time
        const sp = drip.dot.spell;
        spellHit(rand(sp.dot[0], sp.dot[1]));
        if (drip.dead) return;
        if (--drip.dot.left <= 0) drip.dot = null; else drip.dot.next += sp.tickMs;
      }
      if (drip.mana >= DRIP.mana) drip.manaT = t;   // regen timer only runs while mana is missing
      while (drip.mana < DRIP.mana && t - drip.manaT >= DRIP.manaRegenMs) { drip.mana++; drip.manaT += DRIP.manaRegenMs; }
      const dist = cheb(player.x, player.y, drip.x, drip.y);
      if (!drip.aggro && dist <= DRIP.aggro) drip.aggro = true;
      if (!drip.aggro) return;
      if (player.x !== drip.x) drip.lookX = player.x > drip.x ? 1 : -1;
      if (drip.hitAt && t >= drip.hitAt) { drip.hitAt = 0; dripStrikes(); }
      if (t - drip.stepStart < DRIP.stepMs) return;              // still gliding to the next tile
      const stuck = t < (drip.stunUntil || 0);                   // magic tar: can still swing, can't walk
      if (dist === 1) {                                         // next to the hero: attack once per second
        if (t >= drip.nextAttack && !drip.hitAt) { drip.attackStart = t; drip.hitAt = t + DRIP.windupMs; drip.nextAttack = t + DRIP.attackMs; }
        return;
      }
      if (stuck || drip.hitAt || t - drip.attackStart < 700) return;   // stuck, or letting the swing finish
      // step to the neighbouring tile that gets closest to the hero (no corner cutting, not onto the hero or an exit)
      let best = null;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = drip.x + dx, ny = drip.y + dy;
        if ((!dx && !dy) || !free(nx, ny) || exitAt(nx, ny) || (nx === player.x && ny === player.y)) continue;
        if (dx && dy && (!free(drip.x + dx, drip.y) || !free(drip.x, drip.y + dy))) continue;
        const score = cheb(nx, ny, player.x, player.y) * 100 + Math.hypot(nx - player.x, ny - player.y);
        if (!best || score < best.score) best = { nx, ny, score };
      }
      if (!best || cheb(best.nx, best.ny, player.x, player.y) >= dist) return;
      drip.fromX = drip.x; drip.fromY = drip.y; drip.x = best.nx; drip.y = best.ny; drip.stepStart = t;
    }

    // Drip's swing lands (after the wind-up) if the hero is still next to him
    function dripStrikes() {
      if (cheb(player.x, player.y, drip.x, drip.y) !== 1 || stats.health <= 0) return;
      const dmg = rand(DRIP.atk[0], DRIP.atk[1]);
      stats.health = Math.max(0, stats.health - dmg);
      heroHurtStart = gameTime;
      float(`-${dmg}`, '#e5484d', player.x + 0.5, player.y - 0.6);
      if (drip.mana >= DRIP.tart.cost && Math.random() < DRIP.tart.chance) {
        drip.mana -= DRIP.tart.cost;
        rootedUntil = gameTime + DRIP.tart.rootMs;
        float('Tart!', '#ff2bd6', player.x + 0.5, player.y - 1.1);
      }
      renderStats();
      if (stats.health <= 0) gameOver();
    }

    function heroAttack() {
      if (gameTime < heroNextAttack) return;
      heroNextAttack = gameTime + HERO_ATTACK_MS;
      heroAttackStart = gameTime;   // attack animation in the facing direction (diagonals use the side view)
      heroAttackDir = facing.x ? 'side' : facing.y > 0 ? 'down' : 'up';
      if (facing.x) lookX = facing.x;
      damageDrip(stats.strength, `-${stats.strength}`, '#fff');
    }

    function damageDrip(dmg, text, color) {
      drip.hp = Math.max(0, drip.hp - dmg);
      drip.hurtStart = gameTime; drip.aggro = true;
      float(text, color, drip.x + 0.5, drip.y - 0.9);
      if (drip.hp <= 0) {   // nothing is given yet: the loot waits on his puddle
        drip.dead = true; drip.deadAt = gameTime; drip.hitAt = 0; drip.dot = null; drip.stunUntil = 0;
        const L = DRIP.loot, items = [];
        const tars = rand(L.tar[0], L.tar[1]);
        if (tars) items.push({ name: 'tar', count: tars });
        if (Math.random() < L.magicTarChance) items.push({ name: 'magic tar', count: 1 });
        drip.loot = { money: rand(L.money[0], L.money[1]), items };
      }
    }

    // ---- spells -----------------------------------------------------------------
    const critChance = () => Math.min(CRIT_CAP, stats.charisma * CRIT_PER_CHA);
    const projectiles = [];   // { x, y (tile units, centre), dx, dy (unit), flown, spell, t }
    let heroManaT = 0;        // game time when the hero's next mana point is due

    // a spell's damage lands: roll a critical strike (adds strength)
    function spellHit(base) {
      const crit = Math.random() < critChance();
      const dmg = base + (crit ? stats.strength : 0);
      damageDrip(dmg, crit ? `-${dmg} crit!` : `-${dmg}`, crit ? '#ffe600' : '#ff2bd6');
    }

    function castSpell(slot) {
      const name = skills[slot], sp = name && SPELLS[name];
      if (!sp) return;
      const hx = player.x + 0.5, hy = player.y + 0.5;
      if (stats.mana < sp.mana) { float(`no mana (${sp.mana} ${ICON.mana})`, '#4ea1ff', hx, player.y - 0.7); return; }
      stats.mana -= sp.mana; renderStats();
      // aim at the closest living enemy in this area; with none, shoot where the hero faces
      let dx = facing.x, dy = facing.y;
      if (drip && !drip.dead) { const d = dripPos(); dx = d.x + 0.5 - hx; dy = d.y + 0.5 - hy; }
      if (!dx && !dy) dx = lookX;
      const len = Math.hypot(dx, dy);
      projectiles.push({ x: hx, y: hy, dx: dx / len, dy: dy / len, flown: 0, spell: sp, t: gameTime });
      if (dx) lookX = dx > 0 ? 1 : -1;
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i], step = Math.min(pr.spell.speed * dt / 1000, pr.spell.range - pr.flown);
        pr.x += pr.dx * step; pr.y += pr.dy * step; pr.flown += step;
        let gone = false;
        if (drip && !drip.dead) {   // hit check first, so a target right at the end of the range still counts
          const d = dripPos();
          if (Math.hypot(d.x + 0.5 - pr.x, d.y + 0.5 - pr.y) < 0.55) {   // hit: root + damage over time (refreshes if already on)
            drip.stunUntil = gameTime + pr.spell.rootMs;
            drip.dot = { spell: pr.spell, left: pr.spell.ticks, next: gameTime + pr.spell.tickMs };
            drip.aggro = true;
            float('stuck!', '#ff2bd6', drip.x + 0.5, drip.y - 1.3);
            gone = true;
          }
        }
        gone = gone || pr.flown >= pr.spell.range - 1e-6 || !inGrid(Math.floor(pr.x), Math.floor(pr.y)) || !!wallAt(Math.floor(pr.x), Math.floor(pr.y));
        if (gone) projectiles.splice(i, 1);
      }
    }

    function updateHeroMana() {
      if (stats.mana >= CAPS.mana) { heroManaT = gameTime + HERO_MANA_REGEN_MS; return; }
      if (gameTime >= heroManaT) { stats.mana = capped('mana', stats.mana + 1); heroManaT = gameTime + HERO_MANA_REGEN_MS; renderStats(); }
    }

    // beaten Drip with loot on the tile the hero faces (or stands on)
    const lootable = () => drip && drip.dead && drip.loot &&
      ((drip.x === player.x + facing.x && drip.y === player.y + facing.y) || (drip.x === player.x && drip.y === player.y));

    // put n of an item into the inventory: fills existing stacks first, then empty slots. Returns what didn't fit.
    function addItem(name, n) {
      const def = itemDef(name) || {}, max = def.stack || 1;
      if (max > 1) for (const it of inventory) {
        if (it.name !== name || (it.count || 1) >= max) continue;
        const k = Math.min(n, max - (it.count || 1)); it.count = (it.count || 1) + k; n -= k;
        if (!n) return 0;
      }
      while (n > 0 && inventory.length < INVENTORY_SLOTS) {
        const k = Math.min(n, max); inventory.push({ name, class: def.class, kind: def.kind, count: k }); n -= k;
      }
      return n;
    }

    // loot window: one row per thing on the puddle; Space takes the highlighted one. Closes when the puddle is empty.
    function lootRows() {
      if (!drip || !drip.loot) return [];
      const L = drip.loot, list = [];
      const taken = () => {   // after taking something: close when empty, keep the highlight in range
        if (!L.money && !L.items.length) { drip.loot = null; ui = null; return; }
        ui.cursor = Math.min(ui.cursor, (L.money ? 1 : 0) + L.items.length - 1);
      };
      if (L.money) list.push({ left: 'money', item: { name: 'money' }, pic: 'money', right: `${L.money}$`, act() {
        const m = L.money; stats.money += m; L.money = 0;
        taken(); return `Took ${m}$.`;
      } });
      for (const it of L.items) list.push({ left: it.name, item: { name: it.name, count: it.count }, pic: it.name, right: `×${it.count}`, act() {
        const left = addItem(it.name, it.count), got = it.count - left;
        if (!got) return 'Your inventory is full.';
        it.count = left;
        if (!left) L.items.splice(L.items.indexOf(it), 1);
        taken(); return left ? `Took ${got} ${it.name}. Inventory full.` : `Took ${it.name}.`;
      } });
      return list;
    }

    function gameOver() {
      closePanels();
      ui = { kind: 'gameover', cursor: 0, msg: `${heroName || DEFAULT_NAME} fell in the ${areaName}. Deals made: ${dealsDone}.` };
      held.clear(); tapped.clear();
    }

    // ---- movement -------------------------------------------------------------
    const KEYS = ['w', 'a', 's', 'd'];
    const held = new Set();      // movement keys currently held
    const tapped = new Set();    // keys pressed since the last step, even if already released
    const COMBO_MS = 60;         // short wait so W+D pressed together counts as one diagonal step
    const MOVE_MS = 180;         // time to glide from one tile to the next (steady speed)
    let comboTimer = null;
    // glide state: player.x/y is the tile we are on or heading to; from* is where the glide started
    let moving = false, fromX = player.x, fromY = player.y, moveStart = 0;

    function direction() {
      const keys = new Set([...held, ...tapped]);
      tapped.clear();
      return [
        (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0),
        (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0),
      ];
    }

    function tryStep(startTime) {
      if (anyOpen() || gameTime < rootedUntil) return false;   // Tart holds the hero in place
      const [dx, dy] = direction();
      if (!dx && !dy) return false;
      if (dx && dy && dripAt(player.x + dx, player.y + dy)) return false;   // pushing into an enemy on a diagonal just faces him
      // try the full step; if blocked diagonally, slide along the free axis instead
      const options = [[dx, dy], dx && dy ? [dx, 0] : null, dx && dy ? [0, dy] : null].filter(Boolean);
      // a diagonal step also needs both side tiles free, so the hero can't squeeze past a wall's corner
      const ok = options.find(([ox, oy]) =>
        heroFree(player.x + ox, player.y + oy) &&
        (!ox || !oy || (heroFree(player.x + ox, player.y) && heroFree(player.x, player.y + oy))));
      if (!ok) return false;
      fromX = player.x; fromY = player.y;
      player.x += ok[0]; player.y += ok[1];
      moveStart = startTime; moving = true; stepsTaken++;
      moveDir = { x: ok[0], y: ok[1] };
      facing.x = dx; facing.y = dy; if (dx) lookX = dx;   // face where the keys point (e.g. back to right after letting go of W)
      return true;
    }

    function press(keys) {
      if (!ui && focus && panels[focus]) {   // focused panel: inventory A/D along the slots, hero W/S (or A/D) through equipped slots
        const pn = panels[focus];
        const d = (keys.includes('d') ? 1 : 0) - (keys.includes('a') ? 1 : 0);
        const v = (keys.includes('s') ? 1 : 0) - (keys.includes('w') ? 1 : 0);
        const step = focus === 'inventory' ? d : v || d, n = focus === 'inventory' ? INVENTORY_SLOTS : EQUIP_SLOTS;
        if (step) { pn.cursor = (pn.cursor + step + n) % n; pn.msg = ''; }
        return;
      }
      if (ui) {                              // inside a window W/S move the highlight
        if (keys.includes('w')) moveCursor(-1);
        if (keys.includes('s')) moveCursor(1);
        return;
      }
      keys.forEach(k => { held.add(k); tapped.add(k); });
      // face along every movement key held, so W+D faces diagonally (needed to hit an enemy standing on a diagonal)
      facing.x = (held.has('d') ? 1 : 0) - (held.has('a') ? 1 : 0);
      facing.y = (held.has('s') ? 1 : 0) - (held.has('w') ? 1 : 0);
      if (!facing.x && !facing.y) { facing.x = (keys.includes('d') ? 1 : 0) - (keys.includes('a') ? 1 : 0); facing.y = (keys.includes('s') ? 1 : 0) - (keys.includes('w') ? 1 : 0); }
      if (facing.x) lookX = facing.x;
      if (moving || comboTimer) return;   // a glide in progress picks the keys up when it lands
      comboTimer = setTimeout(() => { comboTimer = null; tryStep(performance.now()); }, COMBO_MS);
    }

    function release(keys) { keys.forEach(k => held.delete(k)); }

    // ---- drawing ------------------------------------------------------------
    let rowRects = [];   // canvas-space hit areas of window rows, for taps/clicks

    function frame(now) {
      const dt = !anyOpen() && !naming() ? Math.min(100, now - lastFrame) : 0;
      gameTime += dt;   // game clock pauses behind windows
      lastFrame = now;
      if (dt) { updateDrip(); updateProjectiles(dt); updateHeroMana(); }
      // keys still held when Tart wears off (or a blocking enemy moves): start walking again
      if (!moving && !comboTimer && held.size && !anyOpen()) tryStep(now);
      let rx = player.x, ry = player.y;
      if (moving) {
        const t = (now - moveStart) / MOVE_MS;
        if (t >= 1) {
          moving = false;
          const ex = exitAt(player.x, player.y);
          if (ex) enterArea(ex.to, ex.arriveX - 1, player.y, ex.face);
          // keep going without a pause if keys are still held, so speed stays constant
          const landed = moveStart + MOVE_MS;
          if ((held.size || tapped.size) && tryStep(now - landed < MOVE_MS ? landed : now)) {
            const t2 = Math.min(1, (now - moveStart) / MOVE_MS);
            rx = fromX + (player.x - fromX) * t2; ry = fromY + (player.y - fromY) * t2;
          }
        } else {
          rx = fromX + (player.x - fromX) * t; ry = fromY + (player.y - fromY) * t;
        }
      }
      draw(rx, ry);
      requestAnimationFrame(frame);
    }

    // ground: seamless floor texture repeated every 6 x 6 tiles, built once into an offscreen canvas.
    // It has no joints, so the grid is invisible; decals (cracks, manholes…) will snap to tiles on top of it.
    let groundLayer = null;   // rebuilt when the area changes
    let areaFade = 0, areaBanner = 0;   // timestamps for the transition fade and the area name banner
    function enterArea(name, x, y, face, instant) {
      areaName = name; WALLS = AREAS[name].walls;
      player.x = x; player.y = y; fromX = x; fromY = y;
      facing.x = face; facing.y = 0; lookX = face; moving = false;
      groundLayer = null;
      drip = null; rootedUntil = 0; projectiles.length = 0;
      if (name === 'slums') spawnDrip();   // Drip is back at full health every time the slums are entered
      if (!instant) { areaFade = performance.now(); areaBanner = areaFade; setTimeout(() => autosave(), 0); }
      renderStats();
    }
    const GROUND_REPEAT = 6;   // tiles per texture repeat
    function buildGround() {
      const im = ART.ground;
      if (!ready(im)) return null;
      const g = document.createElement('canvas'); g.width = canvas.width; g.height = canvas.height;
      const gx = g.getContext('2d'); gx.imageSmoothingQuality = 'high';
      const B = GROUND_REPEAT * TILE;
      for (let y = 0; y < g.height; y += B) for (let x = 0; x < g.width; x += B) gx.drawImage(im, x, y, B, B);
      if (AREAS[areaName].decals) placeDecals(gx);
      drawCoils(gx);
      drawTar(gx);
      return g;
    }

    // tar puddle: its straight edge sits on the map edge, flowing in from outside; flat, walkable
    const TAR_H = 2.8;   // height in tiles (covers both exit rows with some spill above and below)
    function drawTar(gx) {
      const t = AREAS[areaName].tar, im = ART.tar;
      if (!t || !ready(im)) return;
      const h = TAR_H * TILE, w = h * im.naturalWidth / im.naturalHeight, cy = (t.row - 0.5) * TILE;
      gx.save();
      if (t.side === 'right') gx.drawImage(im, canvas.width - w, cy - h / 2, w, h);
      else { gx.translate(w, 0); gx.scale(-1, 1); gx.drawImage(im, 0, cy - h / 2, w, h); }
      gx.restore();
    }

    // razor wire is flat on the ground layer (drawn once, under the hero)
    function drawCoils(gx) {
      for (const c of AREAS[areaName].coils || []) {
        if (wallAt(c.x - 1, c.y - 1)) continue;
        const im = ART[c.kind === 'corner' ? 'wireCorner' : 'wireStraight'];
        if (!ready(im)) continue;
        gx.save();
        gx.translate((c.x - 0.5) * TILE, (c.y - 0.5) * TILE); gx.rotate(c.rot * Math.PI / 2);
        gx.drawImage(im, -TILE / 2, -TILE / 2, TILE, TILE);
        gx.restore();
      }
    }

    // floor details: one per chosen tile, snapped to the tile centre. Fixed seed, so the street is the same every game.
    // weight = how often; size = fraction of a tile; turn: 'free' (any quarter turn + mirror), 'quarter', 'half',
    // 'mirror' (left/right only, e.g. puddles keep vertical reflections), 'none'; alpha = how strongly it shows.
    const DECALS = [   // weight 0 = not used
      { name: 'crack',       weight: 3,   size: 0.95, turn: 'free' },
      { name: 'crack web',   weight: 3,   size: 0.8,  turn: 'free' },
      { name: 'manhole',     weight: 1,   size: 0.72, turn: 'free' },
      { name: 'drain grate', weight: 0,   size: 0.7,  turn: 'quarter' },
      { name: 'puddle cyan', weight: 1.5, size: 0.85, turn: 'mirror' },
      { name: 'puddle pink', weight: 1.5, size: 0.85, turn: 'mirror' },
      { name: 'oil stain',   weight: 2,   size: 0.8,  turn: 'free' },
      { name: 'litter',      weight: 2,   size: 0.75, turn: 'free' },
      { name: 'yellow line', weight: 0,   size: 0.85, turn: 'quarter', alpha: 0.75 },
      { name: 'crosswalk',   weight: 0, size: 0.85, turn: 'quarter', alpha: 0.75 },
      { name: 'arrow',       weight: 0, size: 0.75, turn: 'quarter', alpha: 0.75 },
      { name: 'metal plate', weight: 0,   size: 0.6,  turn: 'quarter' },
      { name: 'floor light', weight: 0, size: 0.6,  turn: 'half' },
      { name: 'cable',       weight: 0,   size: 0.95, turn: 'free' },
      { name: 'graffiti',    weight: 0.5, size: 0.75, turn: 'none', alpha: 0.75 },
      { name: 'leaves',      weight: 2,   size: 0.8,  turn: 'free' },
    ];
    const DECAL_CHANCE = 1 / 6;   // city: share of free tiles that get a detail (areas can override: decals.chance)
    function placeDecals(gx) {
      const sheet = ART.decals;
      if (!ready(sheet)) return;
      const cell = sheet.naturalWidth / 4;
      const cfg = typeof AREAS[areaName].decals === 'object' ? AREAS[areaName].decals : {};
      const weight = d => cfg.weights ? (cfg.weights[d.name] ?? 0) : d.weight;
      const chance = cfg.chance ?? DECAL_CHANCE;
      let seed = cfg.seed ?? 20260923;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const total = DECALS.reduce((t, d) => t + weight(d), 0);
      const pick = () => { let r = rnd() * total; for (let i = 0; i < DECALS.length; i++) { r -= weight(DECALS[i]); if (r <= 0 && weight(DECALS[i]) > 0) return i; } return 0; };
      const placed = {};   // "x,y" -> decal index
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (rnd() >= chance || wallAt(x, y) || coilAt(x, y) || exitAt(x, y) || (areaName === 'city' && x === START.x && y === START.y)) continue;
        let i = pick(), tries = 0;
        const nearSame = k => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (placed[(x + dx) + ',' + (y + dy)] === k) return true; return false; };
        while (nearSame(i) && tries++ < 8) i = pick();
        if (nearSame(i)) continue;
        placed[x + ',' + y] = i;
        const d = DECALS[i], sz = d.size * TILE;
        let rot = 0, fx = 1;
        if (d.turn === 'free' || d.turn === 'quarter') rot = Math.floor(rnd() * 4) * Math.PI / 2;
        if (d.turn === 'half') rot = rnd() < 0.5 ? 0 : Math.PI;
        if (d.turn === 'free' || d.turn === 'mirror') fx = rnd() < 0.5 ? -1 : 1;
        gx.save();
        gx.globalAlpha = d.alpha ?? 0.9;
        gx.translate((x + 0.5) * TILE, (y + 0.5) * TILE); gx.rotate(rot); gx.scale(fx, 1);
        gx.drawImage(sheet, (i % 4) * cell, Math.floor(i / 4) * cell, cell, cell, -sz / 2, -sz / 2, sz, sz);
        gx.restore();
      }
    }

    function draw(rx, ry) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const wantDecals = AREAS[areaName].decals && ready(ART.decals);
      const wantWire = !!AREAS[areaName].coils && ready(ART.wireStraight) && ready(ART.wireCorner);
      const wantTar = !!AREAS[areaName].tar && ready(ART.tar);
      if (!groundLayer || (wantDecals && !groundLayer.hasDecals) || (wantWire && !groundLayer.hasWire) || (wantTar && !groundLayer.hasTar)) {
        groundLayer = buildGround();
        if (groundLayer) { groundLayer.hasDecals = wantDecals; groundLayer.hasWire = wantWire; groundLayer.hasTar = wantTar; }
      }
      if (groundLayer) ctx.drawImage(groundLayer, 0, 0);

      // grid lines only until the floor texture is loaded (its slab joints are the grid)
      if (!groundLayer) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= COLS; x++) { const px = Math.min(Math.max(x * TILE, 1), canvas.width - 1); ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height); }
      for (let y = 0; y <= ROWS; y++) { const py = Math.min(Math.max(y * TILE, 1), canvas.height - 1); ctx.moveTo(0, py); ctx.lineTo(canvas.width, py); }
      ctx.stroke();
      }

      // tile the hero is facing: a soft, blurred yellow triangle (3%) with its tip toward the hero, widening away from him
      ctx.save();
      ctx.translate((rx + facing.x + 0.5) * TILE, (ry + facing.y + 0.5) * TILE);
      ctx.rotate(Math.atan2(facing.y, facing.x));
      ctx.globalAlpha = 0.03;
      const fm = facingMarker(), fs = fm.width;
      ctx.drawImage(fm, -fs / 2, -fs / 2, fs, fs);
      ctx.restore();

      // exits: soft glow fading toward the map edge, with a chevron pointing out
      for (const e of AREAS[areaName].exits) for (const [tx, ty] of e.tiles) {
        const x0 = (tx - 1) * TILE, y0 = (ty - 1) * TILE, out = tx === 1 ? -1 : 1;
        const gr = ctx.createLinearGradient(out > 0 ? x0 : x0 + TILE, 0, out > 0 ? x0 + TILE : x0, 0);
        gr.addColorStop(0, 'rgba(0, 229, 255, 0)'); gr.addColorStop(1, 'rgba(0, 229, 255, 0.08)');
        ctx.fillStyle = gr; ctx.fillRect(x0, y0, TILE, TILE);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)'; ctx.lineWidth = 4; ctx.beginPath();
        const cx = x0 + TILE / 2, cy = y0 + TILE / 2;
        ctx.moveTo(cx - 8 * out, cy - 12); ctx.lineTo(cx + 8 * out, cy); ctx.lineTo(cx - 8 * out, cy + 12); ctx.stroke();
      }

      // depth sort: things higher on screen first, so whatever is lower is drawn in front
      // buildings: split around the hero by their bottom row; among buildings, "front" ones are drawn last
      const order = (a, b) => (a.y + (a.front ? 10 : 0)) - (b.y + (b.front ? 10 : 0));
      WALLS.filter(w => w.y - 1 <= ry).sort(order).forEach(drawWall);
      if (gameTime < rootedUntil) drawTart(rx, ry);
      // hero and enemies: lower on screen is drawn in front; a beaten enemy lies flat under everyone
      const actors = [{ y: ry, draw: () => drawHeroSprite(rx, ry) }];
      if (drip) { const d = dripPos(); actors.push({ y: drip.dead ? -1e9 : d.y, draw: () => drawDrip(d) }); }
      actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());
      WALLS.filter(w => w.y - 1 > ry).sort(order).forEach(drawWall);
      drawProjectiles();
      drawFloaters();
      if (drip && drip.aggro && !drip.dead) drawFoePanel();

      // name of the tile the yellow highlight is on
      const looked = wallAt(Math.round(rx) + facing.x, Math.round(ry) + facing.y);
      if (looked && looked.label && !anyOpen()) {
        ctx.fillStyle = '#fff';
        ctx.font = '600 28px ' + MONO;
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(looked.label, footCX(looked) * TILE, Math.max(40, wallTop(looked) - 10));   // keep tall buildings' names on screen
      }

      // area change: quick fade from black and the area's name
