<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Game</title>
<style>
  :root { color-scheme: dark; --bg: #000; --grid: #fff; --player: #808080; --muted: #8a8a8a;
          /* on-screen width of the grid; one tile is --w / 21 */
          --w: min(100vw - 32px, 1680px, calc((100vh - 140px) * 21 / 13)); }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--grid); margin: 0;
    padding-inline: 16px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    user-select: none; -webkit-user-select: none;
  }
  /* stage and HUD share one width so the HUD lines up with the grid's edges */
  #stage, .hud { width: var(--w); }
  #stage { aspect-ratio: 21 / 13; position: relative; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
  /* HUD: left (portrait + body stats) · middle (ability tiles) · right (charisma, money, deals) */
  .hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px 24px; align-items: center;
         font-size: 26px; font-variant-numeric: tabular-nums; }
  .hud-left, .hud-right { display: flex; gap: 24px; align-items: center; }
  .hud-right { justify-self: end; }
  .abilities { display: flex; gap: 8px; }
  .inv-btn { width: calc(var(--w) / 21); aspect-ratio: 1; margin-left: 24px; padding: 0; box-sizing: border-box;
             background: transparent; color: var(--grid); border: 2px solid var(--grid); font: 1.3em/1 ui-monospace, monospace; cursor: pointer; }
  .inv-btn { background: center / 62% no-repeat, center / 100% no-repeat; border: 0; }
  .inv-btn:hover { background-color: rgba(255, 255, 255, 0.08); }
  .inv-btn:focus-visible { outline: 2px solid #ffdc00; outline-offset: 2px; }
  .ability[data-key]:not([data-key=""])::after { content: attr(data-key); position: absolute; right: 8%; bottom: 4%; font-size: 1.4em; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .ability { position: relative;
             width: calc(var(--w) / 21); aspect-ratio: 1; box-sizing: border-box; background: center / 100% no-repeat;
             display: grid; place-items: center; padding: 8%; text-align: center; font-size: 0.42em; font-weight: 600; line-height: 1.05; color: #ff2bd6; }   /* learned skill's name until it has art */
  @media (max-width: 760px) {
    .hud { display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 16px; gap: 8px 12px; }
    .abilities { order: 3; width: 100%; justify-content: center; }
    .hud-left, .hud-right, .stats, .right-row { gap: 10px; }
    .abilities { gap: 4px; }
    .inv-btn { margin-left: 12px; }
  }
  /* naming screen, shown over the grid at the start of a game */
  .naming[hidden] { display: none; }
  .naming { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
  .naming-box { background: #000; border: 2px solid var(--grid); padding: 28px 32px; display: grid; gap: 16px; max-width: calc(100% - 32px); box-sizing: border-box; }
  .naming-box h2 { margin: 0; font-size: 28px; }
  .naming-box input { font: 600 28px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--grid); background: transparent;
                      border: 0; border-bottom: 2px solid var(--grid); padding: 4px 0; width: 12ch; max-width: 100%; outline: none; }
  .naming-box input:focus-visible { border-bottom-color: #ffdc00; }
  .naming-box p { margin: 0; color: var(--muted); font-size: 16px; }
  .naming-box label { display: grid; gap: 4px; color: var(--muted); font-size: 16px; }
  .naming-box [hidden] { display: none; }
  .naming-box.form input { font-size: 22px; width: 22ch; }
  .naming-box .err { color: #e5484d; min-height: 1.4em; max-width: 30ch; }
  .naming-box .err.ok { color: #3ddc84; }
  .naming-box button:disabled { opacity: 0.5; cursor: default; }
  .naming-box button { font: 600 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #000; background: var(--grid); border: 0; padding: 10px 16px; cursor: pointer; justify-self: start; }
  .naming-box button:focus-visible { outline: 2px solid #ffdc00; outline-offset: 2px; }
  .naming-box a { color: #00e5ff; }
  .portrait { width: calc(var(--w) / 21); aspect-ratio: 1; background: #1B2233 center / cover no-repeat; flex: none; }   /* same size as a grid tile; placeholder for the hero's picture */
  .hero-col { display: grid; gap: 2px; }
  .hero-name { font-size: 0.7em; font-weight: 600; color: var(--grid); line-height: 1.1; }
  .counter { color: var(--muted); white-space: nowrap; }
  .right-col { display: grid; gap: 2px; justify-items: end; }
  .right-row { display: flex; gap: 24px; align-items: center; }
  .area-name { font-size: 0.7em; font-weight: 600; color: var(--muted); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.08em; }
  .counter b { color: var(--grid); font-weight: 600; }
  .stats { display: flex; gap: 24px; color: var(--grid); }
  .stat { display: inline-flex; align-items: baseline; gap: 10px; }
  .stat i { font-style: normal; font-size: 1.3em; line-height: 1; }
  .stat b { font-weight: 600; }
  .stat.hp i { color: #e5484d; }
  .stat.str i { color: #ff8a3d; }
  .stat.mana i { color: #4ea1ff; }
  .stat.nrg i { color: #9dff5c; }
  .stat.cha i { color: #b58cff; }
  .stat.gold i { color: #f5c542; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1680" height="1040" aria-label="Game grid, 21 by 13 tiles"></canvas>
  <!-- account screen at the start: create an account (name, email, password) or log in. Accounts live in Supabase;
       a new account must be confirmed through the link Supabase emails before it can log in. -->
  <div class="naming" id="account" hidden>
    <form class="naming-box form" id="acc-form" role="dialog" aria-labelledby="acc-title" novalidate>
      <h2 id="acc-title">Create account</h2>
      <label id="acc-name-row">Hero name <input id="acc-name" maxlength="10" autocomplete="username" spellcheck="false"></label>
      <label>Email <input id="acc-email" type="email" autocomplete="email" spellcheck="false"></label>
      <label>Password <input id="acc-pass" type="password" autocomplete="new-password"></label>
      <p class="err" id="acc-err" role="alert"></p>
      <button type="submit" id="acc-submit">Create account</button>
      <p id="acc-resend-row" hidden><a href="#" id="acc-resend">Resend the confirmation email</a></p>
      <p><a href="#" id="acc-switch">Already have an account? Log in</a></p>
      <p><a href="#" id="acc-guest">Play as guest (no saving)</a></p>
      <p id="acc-hint">Name: letters only, up to 10 · password: 6+ characters. You'll get an email to confirm it's yours.</p>
    </form>
  </div>
  <!-- cheat password prompt (P) -->
  <div class="naming" id="cheat-lock" hidden>
    <form class="naming-box form" id="cheat-form" role="dialog" aria-labelledby="cheat-title">
      <h2 id="cheat-title">Cheats</h2>
      <label>Password <input id="cheat-pass" type="password" autocomplete="off"></label>
      <p class="err" id="cheat-err" role="alert"></p>
      <p>Enter to unlock · Esc to cancel</p>
    </form>
  </div>
</div>

<div class="hud">
  <div class="hud-left">
    <div class="portrait" id="portrait" role="img" aria-label="Hero portrait (placeholder)"></div>
    <div class="hero-col">
    <div class="hero-name" id="hud-name">hero</div>
    <div class="stats" aria-label="Hero stats">
      <span class="stat hp" title="Health"><i aria-hidden="true">&#x2665;&#xFE0E;</i><b id="stat-health">10</b></span>
      <span class="stat str" title="Strength"><i aria-hidden="true">&#x2694;&#xFE0E;</i><b id="stat-strength">1</b></span>
      <span class="stat mana" title="Mana"><i aria-hidden="true">&#x25C6;</i><b id="stat-mana">0</b></span>
    </div>
    </div>
  </div>
  <div class="abilities" aria-label="Abilities (empty)">
    <div class="ability"></div><div class="ability"></div><div class="ability"></div>
    <button class="inv-btn" id="inv-btn" title="Inventory (I)" aria-label="Inventory (I)"></button>
  </div>
  <div class="hud-right">
    <div class="right-col">
    <div class="area-name" id="area-name" title="Current area">city</div>
    <div class="right-row">
    <div class="stats">
      <span class="stat nrg" title="Energy"><i aria-hidden="true">&#x26A1;&#xFE0E;</i><b id="stat-energy">10</b></span>
      <span class="stat cha" title="Charisma"><i aria-hidden="true">&#x2726;</i><b id="stat-charisma">1</b></span>
      <span class="stat gold" title="Money"><i aria-hidden="true">$</i><b id="stat-money">0</b></span>
    </div>
    <div class="counter" title="Deals made at work">deals <b id="stat-deals">0</b></div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
  const COLS = 21, ROWS = 13, TILE = 80;   // every zone is 21 x 13 tiles
  // cheat menu (P) is locked behind a password; only its SHA-256 is kept here
  const CHEAT_HASH = '97c10efe01d5c9c88704a12d361d8429b3a6aa2412290a0773109d5d2d603d5e';
  // accounts + saves: Supabase (auth + a "saves" table, one row per player, protected by row-level security).
  // The publishable key is meant to be public; what each player can touch is decided by the table's rules.
  const SUPABASE_URL = 'https://kyrgawnhrqqkclyxldmx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ji4v4gBwHUkccCxS--2Yrg_VHulKUTM';
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;   // null if the library couldn't load
  const RETURN_URL = location.origin + location.pathname;   // the confirmation email links back to this page
  const STORE = { last: 'littlegame.lastEmail' };   // only used to pre-fill the email field
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  // ---- sound --------------------------------------------------------------------
  // Web Audio: the whole track is decoded once and looped sample-exact (no click at the loop point).
  // Music starts only when the player enters the game; browsers also need a key press or tap before any sound.
  const MUSIC_SRC = 'audio/background_music.m4a';
  const SETTINGS_KEY = 'littlegame.settings';
  const settings = Object.assign({ music: 2, sfx: 2 }, store.get(SETTINGS_KEY) || {});   // 0-5 steps of 20%, per device
  const volumeBar = n => '[' + '='.repeat(n) + '\u00b7'.repeat(5 - n) + '] ' + String(n * 20).padStart(3) + '%';
  const audio = { ctx: null, music: null, sfx: null, buffer: null, loading: null, source: null, wanted: false, el: null };
  function audioCtx() {
    if (audio.ctx) return audio.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audio.ctx = new AC();
    audio.music = audio.ctx.createGain(); audio.music.connect(audio.ctx.destination);
    audio.sfx = audio.ctx.createGain(); audio.sfx.connect(audio.ctx.destination);   // sound effects will play through this one
    applyVolumes();
    return audio.ctx;
  }
  const curve = n => Math.pow(n / 5, 2);   // ears hear volume logarithmically: squared steps feel even
  function applyVolumes() {
    if (audio.ctx) {
      const t = audio.ctx.currentTime;
      audio.music.gain.setTargetAtTime(audio.wanted ? curve(settings.music) : 0, t, 0.15);
      audio.sfx.gain.setTargetAtTime(curve(settings.sfx), t, 0.05);
    }
    if (audio.el) audio.el.volume = audio.wanted ? curve(settings.music) : 0;
  }
  function stepVolume(which, d, wrap = true) {
    let n = settings[which] + d;
    n = wrap ? (n + 6) % 6 : Math.max(0, Math.min(5, n));   // Space / tap: 0-20-…-100-0; A/D stop at the ends
    settings[which] = n; store.set(SETTINGS_KEY, { music: settings.music, sfx: settings.sfx });
    applyVolumes();
    if (which === 'music' && n > 0) startMusic();
  }
  async function loadMusic() {
    const res = await fetch(MUSIC_SRC);
    if (!res.ok) throw new Error('music ' + res.status);
    const data = await res.arrayBuffer();
    const buf = await new Promise((ok, fail) => { const p = audio.ctx.decodeAudioData(data, ok, fail); if (p && p.catch) p.catch(fail); });
    // AAC files carry a few ms of digital silence at the start/end (encoder padding): loop only the real music
    const ch = [...Array(buf.numberOfChannels)].map((_, c) => buf.getChannelData(c)), lim = Math.floor(buf.sampleRate * 0.2);
    const loud = i => ch.some(d => Math.abs(d[i]) > 1e-5);
    let a = 0, b = buf.length;
    while (a < lim && !loud(a)) a++;
    while (buf.length - b < lim && b > a + 1 && !loud(b - 1)) b--;
    audio.loop = [a / buf.sampleRate, b / buf.sampleRate];
    return buf;
  }
  function startMusic() {
    audio.wanted = true;
    if (!settings.music) { applyVolumes(); return; }
    const ac = audioCtx();
    if (!ac) return fallbackMusic();
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    applyVolumes();
    if (audio.source || audio.el) { if (audio.el) audio.el.play().catch(() => {}); return; }
    if (!audio.loading) audio.loading = loadMusic().then(buf => {
      audio.buffer = buf;
      if (audio.wanted && !audio.source) {
        const src = ac.createBufferSource();
        src.buffer = buf; src.loop = true; src.loopStart = audio.loop[0]; src.loopEnd = audio.loop[1];
        src.connect(audio.music); src.start(0, audio.loop[0]);
        audio.source = src;
      }
    }).catch(() => fallbackMusic());   // an old browser that can't decode it: a plain looping <audio>
  }
  function fallbackMusic() {
    if (audio.el) return;
    audio.el = new Audio(MUSIC_SRC); audio.el.loop = true;
    applyVolumes(); audio.el.play().catch(() => {});
  }
  function stopMusic() {   // log out: fade out, stay silent until the next game starts
    audio.wanted = false; applyVolumes();
    if (audio.el) setTimeout(() => { if (!audio.wanted) audio.el.pause(); }, 400);
  }
  // autoplay rules: the first key press / tap after entering unlocks the sound
  const unlockAudio = () => {
    if (audio.ctx && audio.ctx.state === 'suspended' && audio.wanted && !document.hidden) audio.ctx.resume().catch(() => {});
    if (audio.el && audio.wanted && audio.el.paused) audio.el.play().catch(() => {});
  };
  addEventListener('keydown', unlockAudio, true); addEventListener('pointerdown', unlockAudio, true);
  document.addEventListener('visibilitychange', () => {   // tab in the background: pause the sound (saves battery)
    if (document.hidden) { audio.ctx && audio.ctx.suspend().catch(() => {}); audio.el && audio.el.pause(); }
    else unlockAudio();
  });

  async function sha256(text) {
    if (crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (const ch of text) h = (h * 33 + ch.charCodeAt(0)) >>> 0; return 'x' + h.toString(16);   // fallback (non-https)
  }
  const SAVE_VERSION = 1;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  // ---- rules --------------------------------------------------------------
  const START_STATS = { health: 10, strength: 1, mana: 0, charisma: 1, money: 0, energy: 10 };
  // max values; mana's cap is 0 for now (things may raise it later). Other stats have no cap.
  const CAPS = { health: 10, energy: 20, mana: 0 };
  const BASE_CAPS = { ...CAPS };   // the cheat menu can raise CAPS; "new game" puts these back
  const capped = (st, v) => st in CAPS ? Math.min(CAPS[st], v) : v;
  const REST = { price: 1, gain: { health: 5, energy: 5, mana: 1 }, cooldownMs: 5 * 60 * 1000 };   // HomeDome: Space asks to rest for 1$; then 5 min (real time) until the next rest

  // price here is the starting price. Patches (patch: true): each purchase installs the next level (shown as "lvl N"
  // in the shop, starting at lvl 0) and raises that patch's price by 15%, rounded up.
  // Food: never rises on purchase; instead it inflates by FOOD_INFLATION after every work shift (shown rounded up).
  const SHOP_ITEMS = [
    { name: 'food',      price: 1,   gain: { energy: 10, health: 1 }, art: 'food', rarity: 'common' },
    { name: 'smile patch',   price: 30,  gain: { charisma: 1 }, patch: true, art: 'smilePatch', rarity: 'common' },
    { name: 'social patch',  price: 90,  gain: { charisma: 2 }, patch: true, art: 'socialPatch', rarity: 'common' },
    { name: 'persona patch', price: 240, gain: { charisma: 3 }, patch: true, art: 'personaPatch', rarity: 'common' },
    // class 'equipment': goes to the inventory, gives its bonus only once equipped (I → A/D → Space).
    // kind: only one item per kind (e.g. one sword), counting inventory and equipped items. Bought once.
    { name: 'banana sword', price: 400, gain: { strength: 4, charisma: 1 }, class: 'equipment', kind: 'sword', art: 'bananaSword', rarity: 'common' },
  ];
  // items that are never sold, only looted
  // class 'resource': stacks (up to `stack` per inventory slot), used for crafting later.
  // class 'skill': doesn't stack; Space in the inventory learns it and puts it in an ability slot (effects come later).
  const LOOT_ITEMS = [
    { name: 'tar',        class: 'resource', stack: 64, gain: {}, art: 'tart', value: 2, rarity: 'common' },   // value: price per piece (the Scrap Dealer pays this for resources)
    { name: 'magic tar',  class: 'skill', gain: {}, art: 'magicTart', value: 90, rarity: 'rare' },
    { name: 'scrap',      class: 'resource', stack: 64, gain: {}, value: 1, art: 'scrap', rarity: 'common' },   // from selling equipment; also sold by the Scrap Dealer
    // not obtainable yet (code only; the cheat menu can give them)
    { name: 'MutaGen',    class: 'resource', stack: 32, gain: {}, value: 26, rarity: 'rare', art: 'mutagen' },
    { name: 'Tar Orb',    class: 'upgrade',  stack: 16, gain: {}, value: 60, rarity: 'rare', art: 'tarOrb',   // crafted at SpellTech; Space in the inventory consumes one: +1 mana cap
      desc: 'A magic orb that fuses magic power and body', consume: { manaCap: 1 } },
    { name: 'AI chip',    class: 'resource', stack: 32, gain: {}, value: 24, rarity: 'rare', art: 'aiChip' },
  ];
  // Scrap Dealer (slums): buys equipment for 40% of its shop price plus 1% of that price in scrap (rounded down),
  // resources for 100% of their value (whole stack at once), and sells scrap for 2$ each. Skills and equipped items can't be sold.
  // SpellTech (city): crafting station for magic items. Each recipe: what it makes, what it costs (items + energy).
  const RECIPES = [
    { make: 'Tar Orb', count: 1, cost: [['tar', 10], ['MutaGen', 1]], energy: 20 },
  ];
  const SCRAP_DEALER = { equipShare: 0.4, scrapPerCost: 0.01, scrapPrice: 2 };
  const INVENTORY_SLOTS = 4;
  const ABILITY_SLOTS = 3;   // spell slots in the bar; keys 1 2 3 cast them
  // spells (learned from 'skill' items). Magic tar: a projectile toward the closest enemy, up to `range` tiles.
  // On hit the enemy can't move for `rootMs` and takes dot[0]–dot[1] damage every second, `ticks` times.
  const SPELLS = {
    'magic tar': { mana: 3, range: 5, speed: 9, rootMs: 2000, dot: [1, 2], ticks: 2, tickMs: 1000 },   // root 2 s + 1-2 damage per second for 2 s
  };
  // critical strike (spells only): 0.03% per charisma point, capped at 15%. A crit adds the hero's strength to the damage.
  const CRIT_PER_CHA = 0.0003, CRIT_CAP = 0.15;
  const HERO_MANA_REGEN_MS = 30000;   // hero gets 1 mana back every 30 s of game time (up to the mana cap)
  const EQUIP_SLOTS = 3;   // shown on the right of the hero view (H)
  // item rarity: the colour of the item's name, and a coloured edge in its slot (not for common)
  const RARITY = { common: '#ffffff', rare: '#4ea1ff', mythical: '#b36bff', legendary: '#ff9a2e', titanic: '#ff3b3b', transcendent: '#ff5fd2' };
  const rarityOf = name => (itemDef(name) || {}).rarity || 'common';
  const rarityColor = name => RARITY[rarityOf(name)];
  const itemDef = name => SHOP_ITEMS.find(it => it.name === name) || LOOT_ITEMS.find(it => it.name === name);
  const DEFAULT_NAME = 'hero';
  const cleanName = v => v.replace(/[^\p{L}]/gu, '').slice(0, 10);   // letters only (any alphabet), up to 10
  const startPrices = () => Object.fromEntries(SHOP_ITEMS.map(it => [it.name, it.price]));
  const raisePrice = p => Math.ceil(p * 115 / 100);   // integer maths avoids float drift (60 * 1.15 = 68.999…)
  const FOOD_INFLATION = 0.0062;   // +0.62% food price per work shift → average run ≈ 1000 turns (see design notes)
  const shown = (name, p) => name === 'food' ? Math.ceil(p - 1e-9) : p;   // food keeps a fractional price internally

  // work: trade health for money, 3 random deals, all reroll after one is taken
  // charisma 1 → 1-4 health for 2-5 money; each extra charisma point adds +1 to max health risk
  // and +2 to max money, so risk keeps growing but each health point pays more
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const newDeals = cha => Array.from({ length: 3 }, () => ({ energy: rand(1, 3 + cha), money: rand(2, 3 + 2 * cha) }));   // work costs energy

  // solid things the hero can't walk through, in on-screen coordinates (column, row — counted from 1).
  // x, y = bottom-right tile of the footprint for even widths, bottom-centre for odd; w × h = footprint in tiles,
  // spreading left of x (and right for odd widths) and up from y. Art is centred on the whole footprint.
  // label: shown above it while the hero faces any of its tiles; opens: which window Space opens; art: picture key.
  // ---- world map ----------------------------------------------------------------
  // Zones sit on a map grid; id "a:b" = map coordinates (a grows upward, b grows to the right).
  // City is 0:0, the first slums 0:1 (right of the city). Neighbours: up a+1, down a-1, right b+1, left b-1.
  const ZONE_TYPES = {
    city:       { name: 'city', floor: 'ground' },   // floor: seamless ground texture (ART key)
    slums:      { name: 'slums', floor: 'groundSlums' },
    lake:       { name: 'toxic lake', floor: 'groundLake' },
    factoryIn:  { name: 'factory entrance', floor: 'groundFactory' },
    factory:    { name: 'abandoned factory', floor: 'groundFactory' },
  };
  const ZONE_LIST = {
    '0:0': 'city',
    '0:1': 'slums', '1:0': 'slums', '1:1': 'slums', '1:2': 'slums', '1:3': 'slums',
    '2:1': 'slums', '2:3': 'slums', '2:4': 'slums', '3:3': 'slums',
    '1:-1': 'factoryIn', '1:-2': 'factory',
    '0:-1': 'lake', '0:-2': 'lake', '-1:-1': 'lake', '-1:-2': 'lake',
  };
  // passages between neighbouring zones: [zone, zone, where along the shared edge (0 = top/left end, 1 = bottom/right end)]

  // Tiles counted from 1. Some straight tiles are demolished ('broken'), never two in a row; fixed seed, same every game.

        c.push({ x, y, kind: broken ? 'broken' : 'straight', rot: flat ? 0 : 1 });

    function moveCursor(d) {

    }

    // equip the selected inventory item: only class 'equipment'; bonuses apply from now on
    // Space in the inventory: equipment is equipped, a skill is learned, resources just sit there
    function useSelected(pn) {
      const item = inventory[pn.cursor];
      if (!item) { pn.msg = 'This slot is empty.'; return; }
      const def = itemDef(item.name) || {};
      if (def.class === 'skill') {
        if (skills.includes(item.name)) { pn.msg = `You already know ${item.name}.`; return; }
        if (skills.length >= ABILITY_SLOTS) { pn.msg = 'No free spell slot.'; return; }
        inventory.splice(pn.cursor, 1); skills.push(item.name);
        pn.msg = `Learned ${item.name}: spell slot ${skills.length}, key ${skills.length}.`;
        renderStats(); return;
      }
      if (def.class === 'resource') { pn.msg = `${item.name} is a resource, used for crafting later.`; return; }
      if (def.consume) {   // consumable: use one (Tar Orb: +1 mana cap)

        if ((item.count || 1) > 1) item.count--; else inventory.splice(pn.cursor, 1);
        pn.msg = `Consumed ${item.name}: mana cap +${def.consume.manaCap} (now ${CAPS.mana}).`;

      for (const [st, n] of gains) stats[st] -= n;

      pn.cursor = Math.min(pn.cursor, Math.max(0, equipped.length - 1));
      pn.msg = `Unequipped the ${item.name}: ${gains.map(([st, n]) => `-${n} ${ICON[st]}`).join(' ')}`;

    // Space: open the tile the hero faces, pick the highlighted row, or equip in the inventory

      if (moving) return;

      if (lootable()) { lootTarget = lootable(); openWindow('loot'); return; }

    }
    function goBack() { const b = ui.back; openWindow(b.kind, b.cursor, b.back); }

    let lootTarget = null;   // the beaten Drip whose loot window is open

    discovered.add(areaName);

    let rootTotal = 2000;  // length of the current root (for the puddle's fade)

    // ---- hero states ----------------------------------------------------------------

    const STATES = { root: { label: 'rooted', icon: 'statusRooted', color: '#ff2bd6', symbol: '⛓' },

    const heroStates = () => {
      const s = [];

      return s;

    const hasState = key => heroStates().some(s => s.key === key);
    // status icons: a row in the bottom-left corner of the map, just above the hero panel; timed ones show seconds left
    function drawStates() {
      const list = heroStates(), size = 56, gap = 8;
      list.forEach((s, i) => {
        const def = STATES[s.key], x = 16 + i * (size + gap), y = canvas.height - 16 - size, im = ART[def.icon];
        ctx.save();
        if (ready(im)) { ctx.imageSmoothingQuality = 'high'; ctx.drawImage(im, x, y, size, size); }
        else {   // placeholder badge until the icon art exists

          ctx.strokeStyle = def.color; ctx.lineWidth = 4; ctx.strokeRect(x + 3, y + 3, size - 6, size - 6);
          ctx.fillStyle = def.color; ctx.font = '700 28px ' + MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(def.symbol, x + size / 2, y + size / 2 + 1);

          ctx.font = '700 18px ' + MONO; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
          ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(s.left.toFixed(1), x + size - 2, y + size - 4);
          ctx.fillStyle = '#fff'; ctx.fillText(s.left.toFixed(1), x + size - 2, y + size - 4);

    }
    let heroNextAttack = 0, heroHurtStart = -1e9, heroAttackStart = -1e9, heroAttackDir = 'side';
    const hasSword = () => equipped.some(it => it.kind === 'sword');
    const floaters = [];   // rising combat text: { text, color, x, y, t } (x, y in tiles)
    const float = (text, color, x, y) => floaters.push({ text, color, x, y, t: gameTime });
    const dripAt = (x, y) => drips.find(d => !d.dead && d.x === x && d.y === y) || null;
    const heroFree = (x, y) => free(x, y) && !dripAt(x, y);
    const cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));

    // every zone's Drips, kept for the whole game (zone id -> list); `drips` is the current zone's list
    let zoneDrips = {};
    function spawnAllDrips() {   // start of a game (new game, load, page open): every enemy is spawned
      zoneDrips = {};
      for (const id in AREAS) {
        zoneDrips[id] = [];
        const nd = AREAS[id].drips || 0;
        for (let i = 0; i < nd; i++) zoneDrips[id].push(makeDrip(DRIP.spawns[nd - 1][i], id, 'drip'));
        for (const f of AREAS[id].foes) zoneDrips[id].push(makeDrip(f.spawn, id, f.kind));
      }
      drips = zoneDrips[areaName] || []; drip = null;
    }
    // enemy timers in saves. Game time restarts at 0 on every page load, so times are stored relative:
    // how long ago a Drip died and how long until he respawns. Living Drips keep their health.
    function saveEnemies() {
      const out = {};
      for (const id in zoneDrips) out[id] = zoneDrips[id].map(d => d.dead
        ? { dead: true, x: d.x, y: d.y, since: gameTime - d.deadAt, respawnIn: Math.max(0, d.respawnAt - gameTime), loot: d.loot || null }
        : { hp: d.hp });

    }
    function loadEnemies(saved) {
      if (!saved) return;
      for (const id in saved) (saved[id] || []).forEach((e, i) => {
        const d = zoneDrips[id] && zoneDrips[id][i];
        if (!d) return;
        if (!e.dead) { d.hp = Math.max(1, Math.min(ET(d).hp, e.hp ?? ET(d).hp)); return; }
        Object.assign(d, { dead: true, hp: 0, x: e.x, y: e.y, fromX: e.x, fromY: e.y, aggro: false,

    }
    // hero enters a zone: its living Drips are back at their spawn spot, not locked on, with no mana (they keep their health)

    }
    const takenByDrip = (x, y, self, list = drips) => list.some(o => o !== self && !o.dead && o.x === x && o.y === y);
    function makeDrip(spawn, zoneId = areaName, kind = 'drip') {
      const saveWalls = WALLS; WALLS = AREAS[zoneId].walls;   // free() checks the walls of the zone being filled
      const list = zoneDrips[zoneId] || [], here = zoneId === areaName;
      const blocked = (x, y) => !free(x, y) || takenByDrip(x, y, null, list) || (here && x === player.x && y === player.y);
      let sx = spawn.x - 1, sy = spawn.y - 1;
      if (blocked(sx, sy)) {   // nearest free tile

    function updateDrips() {
      // world-wide timers: loot expiry, fade-out and respawn run in every zone (cheap: a few timestamps)
      for (const id in zoneDrips) zoneDrips[id].forEach((d, i, list) => {
        if (!d.dead) return;
        if (d.loot && gameTime >= d.deadAt + ET(d).lootMs) { d.loot = null; if (lootTarget === d) lootTarget = null; }
        if (gameTime >= d.respawnAt) list[i] = makeDrip(d.spawn, id, d.kind);
      });
      drips.forEach(d => { drip = d; updateDrip(); });   // only the hero's zone is simulated
    }
    function updateDrip() {
      if (!drip) return;
      const t = gameTime;
      if (drip.dead) return;
      while (drip.dot && t >= drip.dot.next) {   // magic tar damage over time
        const sp = drip.dot.spell;
        spellHit(rand(sp.dot[0], sp.dot[1]));
        if (drip.dead) return;
        if (--drip.dot.left <= 0) drip.dot = null; else drip.dot.next += sp.tickMs;
      }
      if (drip.kind === 'scav') { updateScav(); return; }
      const dist = cheb(player.x, player.y, drip.x, drip.y);
      if (!drip.aggro && dist <= DRIP.aggro) { drip.aggro = true; drip.manaT = t; }
      if (!drip.aggro) return;

      if (drip.mana >= DRIP.mana) drip.manaT = t;

        projectiles.push({ x: sx, y: sy, dx: dx / len, dy: dy / len, flown: 0, spell: sp, t, enemy: true });
        drip.attackStart = t;   // casting pose

      let best = null;

        if ((!dx && !dy) || !free(nx, ny) || exitAt(nx, ny) || takenByDrip(nx, ny, drip) || (nx === player.x && ny === player.y)) continue;
        if (dx && dy && (!free(drip.x + dx, drip.y) || !free(drip.x, drip.y + dy))) continue;

    function damageDrip(dmg, text, color) {

      if (stats.mana < sp.mana) { float(`no mana (${sp.mana} ${ICON.mana})`, '#4ea1ff', hx, player.y - 0.7); return; }
      stats.mana -= sp.mana; renderStats();
      // aim at the selected target; without one, at the closest living enemy in this area; with none, where the hero faces
      let dx = facing.x, dy = facing.y;
      const near = hasTarget() ? (() => { drip = target; return { q: dripPos() }; })() : drips.filter(d => !d.dead).map(d => { drip = d; const q = dripPos(); return { q, dist: Math.hypot(q.x + 0.5 - hx, q.y + 0.5 - hy) }; })
        .sort((a, b) => a.dist - b.dist)[0];
      if (near) { dx = near.q.x + 0.5 - hx; dy = near.q.y + 0.5 - hy; }
      if (!dx && !dy) dx = lookX;
      const len = Math.hypot(dx, dy);
      projectiles.push({ x: hx, y: hy, dx: dx / len, dy: dy / len, flown: 0, spell: sp, t: gameTime });
      if (dx) lookX = dx > 0 ? 1 : -1;
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i], step = Math.min(pr.spell.speed * dt / 1000, pr.spell.range - pr.flown);
        pr.x += pr.dx * step; pr.y += pr.dy * step; pr.flown += step;
        let gone = false;
        if (pr.enemy && Math.hypot(player.x + 0.5 - pr.x, player.y + 0.5 - pr.y) < 0.55) {   // an enemy's Magic Tar hits the hero
          rootedUntil = Math.max(rootedUntil, gameTime + pr.spell.rootMs); rootTotal = pr.spell.rootMs;
          heroDot = { spell: pr.spell, left: pr.spell.ticks, next: gameTime + pr.spell.tickMs };
          heroHurtStart = gameTime;
          float('rooted!', '#ff2bd6', player.x + 0.5, player.y - 1.1);
          gone = true;
        }
        for (const e of (pr.enemy ? [] : drips)) {   // hit check first, so a target right at the end of the range still counts
          if (gone || e.dead) continue;
          drip = e;
          const d = dripPos();
          if (Math.hypot(d.x + 0.5 - pr.x, d.y + 0.5 - pr.y) < 0.55) {   // hit: root + damage over time (refreshes if already on)
            drip.stunUntil = gameTime + pr.spell.rootMs;
            drip.dot = { spell: pr.spell, left: pr.spell.ticks, next: gameTime + pr.spell.tickMs };
            drip.aggro = true;
            float('stuck!', '#ff2bd6', drip.x + 0.5, drip.y - 1.3);
            gone = true;
          }
        }
        gone = gone || pr.flown >= pr.spell.range - 1e-6 || !inGrid(Math.floor(pr.x), Math.floor(pr.y)) || !!wallAt(Math.floor(pr.x), Math.floor(pr.y));
        if (gone) projectiles.splice(i, 1);
      }
    }

    // damage over time on the hero (enemy Magic Tar)
    function updateHeroDot() {
      while (heroDot && gameTime >= heroDot.next && stats.health > 0) {
        const dmg = rand(heroDot.spell.dot[0], heroDot.spell.dot[1]);
        stats.health = Math.max(0, stats.health - dmg); heroHurtStart = gameTime;
        float(`-${dmg}`, '#ff2bd6', player.x + 0.5, player.y - 0.6);
        renderStats();
        if (stats.health <= 0) { heroDot = null; gameOver(); return; }
        if (--heroDot.left <= 0) heroDot = null; else heroDot.next += heroDot.spell.tickMs;
      }
    }
    function updateHeroMana() {
      if (stats.mana >= CAPS.mana) { heroManaT = gameTime + HERO_MANA_REGEN_MS; return; }
      if (gameTime >= heroManaT) { stats.mana = capped('mana', stats.mana + 1); heroManaT = gameTime + HERO_MANA_REGEN_MS; renderStats(); }
    }

    // beaten Drip with loot on the tile the hero faces (or stands on)
    const lootable = () => drips.find(d => d.dead && d.loot &&
      ((d.x === player.x + facing.x && d.y === player.y + facing.y) || (d.x === player.x && d.y === player.y))) || null;

    // put n of an item into the inventory: fills existing stacks first, then empty slots. Returns what didn't fit.
    function addItem(name, n) {
      const def = itemDef(name) || {}, max = def.stack || 1;
      if (max > 1) for (const it of inventory) {
        if (it.name !== name || (it.count || 1) >= max) continue;
        const k = Math.min(n, max - (it.count || 1)); it.count = (it.count || 1) + k; n -= k;
        if (!n) return 0;
      }
      while (n > 0 && inventory.length < INVENTORY_SLOTS) {
        const k = Math.min(n, max); inventory.push({ name, class: def.class, kind: def.kind, count: k }); n -= k;
      }
      return n;
    }

    // loot window: one row per thing on the puddle; Space takes the highlighted one. Closes when the puddle is empty.
    function lootRows() {
      const src = lootTarget;
      if (!src || !src.loot) return [];
      const L = src.loot, list = [];
      const taken = () => {   // after taking something: close when empty, keep the highlight in range
        if (!L.money && !L.items.length) { src.loot = null; ui = null; return; }
        ui.cursor = Math.min(ui.cursor, (L.money ? 1 : 0) + L.items.length - 1);
      };
      if (L.money) list.push({ left: 'money', item: { name: 'money' }, pic: 'money', right: `${L.money}$`, act() {
        const m = L.money; stats.money += m; L.money = 0;
        taken(); return `Took ${m}$.`;
      } });
      for (const it of L.items) list.push({ left: it.name, item: { name: it.name, count: it.count }, pic: it.name, right: `×${it.count}`, act() {
        const left = addItem(it.name, it.count), got = it.count - left;
        if (!got) return 'Your inventory is full.';
        it.count = left;
        if (!left) L.items.splice(L.items.indexOf(it), 1);
        taken(); return left ? `Took ${got} ${it.name}. Inventory full.` : `Took ${it.name}.`;
      } });
      return list;
    }

    // death sequence (real time from deathStart): the screen dims to black over 4 s; the fall plays over the first 2 s;
    // from 3 s to 4 s the defeated picture and the Game over text fade in. "new game" can be chosen once they appear.
    const DEATH = { dimMs: 4000, fallMs: 2000, showAt: 3000, showMs: 1000, fall: { cellW: 296, cellH: 285, ax: 139.3, foot: 7.5 } };
    let deathStart = 0;
    const deathT = () => performance.now() - deathStart;
    function gameOver() {
      closePanels(); deathStart = performance.now(); moving = false;
      ui = { kind: 'gameover', cursor: 0, msg: `${heroName || DEFAULT_NAME} fell in the ${areaLabel(areaName)}. Deals made: ${dealsDone}.` };
      held.clear(); tapped.clear();
    }

    // ---- movement -------------------------------------------------------------
    const KEYS = ['w', 'a', 's', 'd'];
    const held = new Set();      // movement keys currently held
    const tapped = new Set();    // keys pressed since the last step, even if already released
    const COMBO_MS = 60;         // short wait so W+D pressed together counts as one diagonal step
    const MOVE_MS = 180;         // time to glide from one tile to the next (steady speed)
    let stepMs = MOVE_MS;        // this step's duration: longer while injured
    const currentStepMs = () => hasState('injured') ? MOVE_MS / STATES.injured.speed : MOVE_MS;
    let comboTimer = null;
    // glide state: player.x/y is the tile we are on or heading to; from* is where the glide started
    let moving = false, fromX = player.x, fromY = player.y, moveStart = 0;

    function direction() {
      const keys = new Set([...held, ...tapped]);
      tapped.clear();
      return [
        (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0),
        (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0),
      ];
    }

    function tryStep(startTime) {
      if (anyOpen() || hasState('root')) return false;   // root state holds the hero in place
      const [dx, dy] = direction();
      if (!dx && !dy) return false;
      if (dx && dy && dripAt(player.x + dx, player.y + dy)) return false;   // pushing into an enemy on a diagonal just faces him
      // try the full step; if blocked diagonally, slide along the free axis instead
      const options = [[dx, dy], dx && dy ? [dx, 0] : null, dx && dy ? [0, dy] : null].filter(Boolean);
      // a diagonal step also needs both side tiles free, so the hero can't squeeze past a wall's corner
      const ok = options.find(([ox, oy]) =>
        heroFree(player.x + ox, player.y + oy) &&
        (!ox || !oy || (heroFree(player.x + ox, player.y) && heroFree(player.x, player.y + oy))));
      if (!ok) return false;
      fromX = player.x; fromY = player.y;
      player.x += ok[0]; player.y += ok[1];
      moveStart = startTime; moving = true; stepsTaken++; stepMs = currentStepMs();
      moveDir = { x: ok[0], y: ok[1] };
      facing.x = dx; facing.y = dy; if (dx) lookX = dx;   // face where the keys point (e.g. back to right after letting go of W)
      return true;
    }

    function press(keys) {
      if (!ui && focus && panels[focus]) {   // focused panel: inventory A/D along the slots, hero W/S (or A/D) through equipped slots
        const pn = panels[focus];
        const d = (keys.includes('d') ? 1 : 0) - (keys.includes('a') ? 1 : 0);
        const v = (keys.includes('s') ? 1 : 0) - (keys.includes('w') ? 1 : 0);
        const step = focus === 'inventory' ? d : v || d, n = focus === 'inventory' ? INVENTORY_SLOTS : EQUIP_SLOTS;
        if (step) { pn.cursor = (pn.cursor + step + n) % n; pn.msg = ''; }
        return;
      }
      if (ui) {                              // inside a window W/S move the highlight
        const vr = ui.kind === 'sound' && rows()[ui.cursor];   // sound window: A/D turn the highlighted volume down/up
        if (vr && vr.vol && (keys.includes('a') || keys.includes('d'))) { stepVolume(vr.vol, keys.includes('d') ? 1 : -1, false); ui.msg = ''; return; }
        if (keys.includes('w')) moveCursor(-1);
        if (keys.includes('s')) moveCursor(1);
        return;
      }
      keys.forEach(k => { held.add(k); tapped.add(k); });
      // face along every movement key held, so W+D faces diagonally (needed to hit an enemy standing on a diagonal)
      facing.x = (held.has('d') ? 1 : 0) - (held.has('a') ? 1 : 0);
      facing.y = (held.has('s') ? 1 : 0) - (held.has('w') ? 1 : 0);
      if (!facing.x && !facing.y) { facing.x = (keys.includes('d') ? 1 : 0) - (keys.includes('a') ? 1 : 0); facing.y = (keys.includes('s') ? 1 : 0) - (keys.includes('w') ? 1 : 0); }
      if (facing.x) lookX = facing.x;
      if (moving || comboTimer) return;   // a glide in progress picks the keys up when it lands
      comboTimer = setTimeout(() => { comboTimer = null; tryStep(performance.now()); }, COMBO_MS);
    }

    function release(keys) { keys.forEach(k => held.delete(k)); }

    // ---- drawing ------------------------------------------------------------
    let rowRects = [];   // canvas-space hit areas of window rows, for taps/clicks

    function frame(now) {
      const dt = !anyOpen() && !naming() ? Math.min(100, now - lastFrame) : 0;
      gameTime += dt;   // game clock pauses behind windows
      lastFrame = now;
      if (dt) { updateDrips(); updateProjectiles(dt); updateHeroDot(); updateHeroMana(); }
      // keys still held when Tart wears off (or a blocking enemy moves): start walking again
      if (!moving && !comboTimer && held.size && !anyOpen()) tryStep(now);
      let rx = player.x, ry = player.y;
      if (moving) {
        const t = (now - moveStart) / stepMs;
        if (t >= 1) {
          moving = false;
          const ex = exitAt(player.x, player.y);
          if (ex) { const [nx, ny, fx, fy] = ARRIVE[ex.dir](player.x, player.y); enterArea(ex.to, nx, ny, fx, false, fy); }
          // keep going without a pause if keys are still held, so speed stays constant
          const landed = moveStart + stepMs;
          if ((held.size || tapped.size) && tryStep(now - landed < stepMs ? landed : now)) {
            const t2 = Math.min(1, (now - moveStart) / stepMs);
            rx = fromX + (player.x - fromX) * t2; ry = fromY + (player.y - fromY) * t2;
          }
        } else {
          rx = fromX + (player.x - fromX) * t; ry = fromY + (player.y - fromY) * t;
        }
      }
      draw(rx, ry);
      requestAnimationFrame(frame);
    }

    // ground: seamless floor texture repeated every 6 x 6 tiles, built once into an offscreen canvas.
    // It has no joints, so the grid is invisible; decals (cracks, manholes…) will snap to tiles on top of it.
    let groundLayer = null;   // rebuilt when the area changes
    let areaFade = 0, areaBanner = 0;   // timestamps for the transition fade and the area name banner
    function enterArea(name, x, y, face, instant, faceY = 0) {
      areaName = name; WALLS = AREAS[name].walls; discovered.add(name);
      player.x = x; player.y = y; fromX = x; fromY = y;
      facing.x = face; facing.y = faceY; if (face) lookX = face; moving = false;
      groundLayer = null;
      rootedUntil = 0; heroDot = null; projectiles.length = 0; target = null;
      settleZoneDrips(name);
      if (!instant) { areaFade = performance.now(); areaBanner = areaFade; setTimeout(() => autosave(), 0); }
      renderStats();
    }
    const GROUND_REPEAT = 6;   // tiles per texture repeat
    function buildGround() {
      const im = ART[ZONE_TYPES[AREAS[areaName].type].floor];
      if (!ready(im)) return null;
      const g = document.createElement('canvas'); g.width = canvas.width; g.height = canvas.height;
      const gx = g.getContext('2d'); gx.imageSmoothingQuality = 'high';
      const B = GROUND_REPEAT * TILE;
      for (let y = 0; y < g.height; y += B) for (let x = 0; x < g.width; x += B) gx.drawImage(im, x, y, B, B);
      if (AREAS[areaName].decals) placeDecals(gx);
      const lake = AREAS[areaName].lake;   // toxic lake quarter, flat on the ground
      if (lake && ready(ART[lake.art])) gx.drawImage(ART[lake.art], lake.x, lake.y);
      drawTar(gx);
      drawCoils(gx);   // walls on top of the tar puddles at the passages
      return g;
    }

    // tar puddle: its straight edge sits on the map edge, flowing in from outside; flat, walkable
    const TAR_H = 2.8;   // height in tiles (covers both exit rows with some spill above and below)
    // one puddle per passage, its straight edge on the map edge (the art's straight edge is on its right side)
    function drawTar(gx) {
      const im = ART.tar;
      if (!ready(im)) return;
      const h = TAR_H * TILE, w = h * im.naturalWidth / im.naturalHeight;
      for (const e of AREAS[areaName].exits) {
        const mx = (e.tiles[0][0] + e.tiles[1][0] + 1) / 2 * TILE, my = (e.tiles[0][1] + e.tiles[1][1] + 1) / 2 * TILE;
        gx.save();
        if (e.dir === 'right') { gx.translate(canvas.width, my); }
        else if (e.dir === 'left') { gx.translate(0, my); gx.scale(-1, 1); }
        else if (e.dir === 'up') { gx.translate(mx, 0); gx.rotate(-Math.PI / 2); }
        else { gx.translate(mx, canvas.height); gx.rotate(Math.PI / 2); }
        gx.drawImage(im, -w, -h / 2, w, h);
        gx.restore();
      }
    }

    // razor wire is flat on the ground layer (drawn once, under the hero)
    function drawCoils(gx) {
      for (const c of AREAS[areaName].coils || []) {
        if (wallAt(c.x - 1, c.y - 1)) continue;
        const im = ART[{ corner: 'wallCorner', broken: 'wallBroken', end: 'wallEnd' }[c.kind] || 'wallStraight'];
        if (!ready(im)) continue;
        gx.save();
        gx.translate((c.x - 0.5) * TILE, (c.y - 0.5) * TILE); gx.rotate(c.rot * Math.PI / 2);
        gx.drawImage(im, -TILE / 2, -TILE / 2, TILE, TILE);
        gx.restore();
      }
    }

    // floor details: one per chosen tile, snapped to the tile centre. Fixed seed, so the street is the same every game.
    // weight = how often; size = fraction of a tile; turn: 'free' (any quarter turn + mirror), 'quarter', 'half',
    // 'mirror' (left/right only, e.g. puddles keep vertical reflections), 'none'; alpha = how strongly it shows.
    const DECALS = [   // weight 0 = not used
      { name: 'crack',       weight: 3,   size: 0.95, turn: 'free' },
      { name: 'crack web',   weight: 3,   size: 0.8,  turn: 'free' },
      { name: 'manhole',     weight: 1,   size: 0.72, turn: 'free' },
      { name: 'drain grate', weight: 0,   size: 0.7,  turn: 'quarter' },
      { name: 'puddle cyan', weight: 1.5, size: 0.85, turn: 'mirror' },
      { name: 'puddle pink', weight: 1.5, size: 0.85, turn: 'mirror' },
      { name: 'oil stain',   weight: 2,   size: 0.8,  turn: 'free' },
      { name: 'litter',      weight: 2,   size: 0.75, turn: 'free' },
      { name: 'yellow line', weight: 0,   size: 0.85, turn: 'quarter', alpha: 0.75 },
      { name: 'crosswalk',   weight: 0, size: 0.85, turn: 'quarter', alpha: 0.75 },
      { name: 'arrow',       weight: 0, size: 0.75, turn: 'quarter', alpha: 0.75 },
      { name: 'metal plate', weight: 0,   size: 0.6,  turn: 'quarter' },
      { name: 'floor light', weight: 0, size: 0.6,  turn: 'half' },
      { name: 'cable',       weight: 0,   size: 0.95, turn: 'free' },
      { name: 'graffiti',    weight: 0.5, size: 0.75, turn: 'none', alpha: 0.75 },
      { name: 'leaves',      weight: 2,   size: 0.8,  turn: 'free' },
    ];
    const DECAL_CHANCE = 1 / 6;   // city: share of free tiles that get a detail (areas can override: decals.chance)
    function placeDecals(gx) {
      const sheet = ART.decals;
      if (!ready(sheet)) return;
      const cell = sheet.naturalWidth / 4;
      const cfg = typeof AREAS[areaName].decals === 'object' ? AREAS[areaName].decals : {};
      const weight = d => cfg.weights ? (cfg.weights[d.name] ?? 0) : d.weight;
      const chance = cfg.chance ?? DECAL_CHANCE;
      let seed = cfg.seed ?? 20260923;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const total = DECALS.reduce((t, d) => t + weight(d), 0);
      const pick = () => { let r = rnd() * total; for (let i = 0; i < DECALS.length; i++) { r -= weight(DECALS[i]); if (r <= 0 && weight(DECALS[i]) > 0) return i; } return 0; };
      const placed = {};   // "x,y" -> decal index
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (rnd() >= chance || wallAt(x, y) || coilAt(x, y) || exitAt(x, y) || (areaName === '0:0' && x === START.x && y === START.y)) continue;
        let i = pick(), tries = 0;
        const nearSame = k => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (placed[(x + dx) + ',' + (y + dy)] === k) return true; return false; };
        while (nearSame(i) && tries++ < 8) i = pick();
        if (nearSame(i)) continue;
        placed[x + ',' + y] = i;
        const d = DECALS[i], sz = d.size * TILE;
        let rot = 0, fx = 1;
        if (d.turn === 'free' || d.turn === 'quarter') rot = Math.floor(rnd() * 4) * Math.PI / 2;
        if (d.turn === 'half') rot = rnd() < 0.5 ? 0 : Math.PI;
        if (d.turn === 'free' || d.turn === 'mirror') fx = rnd() < 0.5 ? -1 : 1;
        gx.save();
        gx.globalAlpha = d.alpha ?? 0.9;
        gx.translate((x + 0.5) * TILE, (y + 0.5) * TILE); gx.rotate(rot); gx.scale(fx, 1);
        gx.drawImage(sheet, (i % 4) * cell, Math.floor(i / 4) * cell, cell, cell, -sz / 2, -sz / 2, sz, sz);
        gx.restore();
      }
    }

    function draw(rx, ry) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const wantDecals = AREAS[areaName].decals && ready(ART.decals);
      const wantWire = !!AREAS[areaName].coils && ['wallStraight', 'wallBroken', 'wallCorner', 'wallEnd'].every(k => ready(ART[k]));
      const wantTar = AREAS[areaName].exits.length > 0 && ready(ART.tar);
      const wantLake = !!AREAS[areaName].lake && ready(ART[AREAS[areaName].lake.art]);
      if (!groundLayer || (wantDecals && !groundLayer.hasDecals) || (wantWire && !groundLayer.hasWire) || (wantTar && !groundLayer.hasTar) || (wantLake && !groundLayer.hasLake)) {
        groundLayer = buildGround();
        if (groundLayer) { groundLayer.hasDecals = wantDecals; groundLayer.hasWire = wantWire; groundLayer.hasTar = wantTar; groundLayer.hasLake = wantLake; }
      }
      if (groundLayer) ctx.drawImage(groundLayer, 0, 0);

      // grid lines only until the floor texture is loaded (its slab joints are the grid)
      if (!groundLayer) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= COLS; x++) { const px = Math.min(Math.max(x * TILE, 1), canvas.width - 1); ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height); }
      for (let y = 0; y <= ROWS; y++) { const py = Math.min(Math.max(y * TILE, 1), canvas.height - 1); ctx.moveTo(0, py); ctx.lineTo(canvas.width, py); }
      ctx.stroke();
      }

      // tile the hero is facing: a soft, blurred yellow triangle (3%) with its tip toward the hero, widening away from him
      ctx.save();
      ctx.translate((rx + facing.x + 0.5) * TILE, (ry + facing.y + 0.5) * TILE);
      ctx.rotate(Math.atan2(facing.y, facing.x));
      ctx.globalAlpha = 0.03;
      const fm = facingMarker(), fs = fm.width;
      ctx.drawImage(fm, -fs / 2, -fs / 2, fs, fs);
      ctx.restore();

      // exits: soft glow fading toward the map edge, with a chevron pointing out
      for (const e of AREAS[areaName].exits) for (const [tx, ty] of e.tiles) {
        const x0 = tx * TILE, y0 = ty * TILE, cx = x0 + TILE / 2, cy = y0 + TILE / 2;
        const [ox, oy] = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] }[e.dir];
        const gr = ctx.createLinearGradient(cx - ox * TILE / 2, cy - oy * TILE / 2, cx + ox * TILE / 2, cy + oy * TILE / 2);
        gr.addColorStop(0, 'rgba(0, 229, 255, 0)'); gr.addColorStop(1, 'rgba(0, 229, 255, 0.08)');
        ctx.fillStyle = gr; ctx.fillRect(x0, y0, TILE, TILE);
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(oy, ox));   // chevron pointing out of the zone
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.55)'; ctx.lineWidth = 4; ctx.beginPath();
        ctx.moveTo(-8, -12); ctx.lineTo(8, 0); ctx.lineTo(-8, 12); ctx.stroke(); ctx.restore();
      }

      // depth sort: things higher on screen first, so whatever is lower is drawn in front
      // buildings: split around the hero by their bottom row; among buildings, "front" ones are drawn last
      const order = (a, b) => (a.y + (a.front ? 10 : 0)) - (b.y + (b.front ? 10 : 0));
      WALLS.filter(w => w.y - 1 <= ry).sort(order).forEach(drawWall);
      if (gameTime < rootedUntil) drawTart(rx, ry);
      // hero and enemies: lower on screen is drawn in front; a beaten enemy lies flat under everyone
      const actors = [{ y: ry, draw: () => drawHeroSprite(rx, ry) }];
      for (const e of drips) { drip = e; const d = dripPos(); actors.push({ y: e.dead ? -1e9 : d.y, draw: () => { drip = e; drawDrip(d); } }); }
      actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());

    function panelFrame(x, y, w, h, title, on) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = on ? '#fff' : 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      ctx.fillStyle = on ? '#fff' : '#8a8a8a'; ctx.font = '600 28px ' + MONO; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(title, x + 24, y + 34);
    }
    function selFrame(x, y, size, on) {   // yellow frame on the selected slot (grey when the panel isn't focused)
      ctx.strokeStyle = on ? '#ffdc00' : 'rgba(255, 220, 0, 0.35)'; ctx.lineWidth = 4;
      ctx.strokeRect(x - 5, y - 5, size + 10, size + 10);
    }
    const bonusText = def => def ? Object.entries(def.gain || {}).map(([st, n]) => `+${n} ${ICON[st]}`).join(' ') : '';

    // inventory: bottom right, just above the info bar. Backpack slots only (equipped items are in the hero panel).
    function drawInventoryPanel() {
      const pn = panels.inventory, on = focus === 'inventory', w = INV_PANEL.w, h = INV_PANEL.h;
      const x = canvas.width - w - 16, y = canvas.height - h - 16;
      panelFrame(x, y, w, h, 'Inventory', on);
      const size = 96, gap = 16, total = INVENTORY_SLOTS * size + (INVENTORY_SLOTS - 1) * gap, x0 = x + (w - total) / 2, sy = y + 62;
      for (let i = 0; i < INVENTORY_SLOTS; i++) {
        const sx = x0 + i * (size + gap);
        drawSlot(sx, sy, size, inventory[i] || null);
        rowRects.push({ x: sx, y: sy, w: size, h: size, i, panel: 'inventory' });
        if (i === pn.cursor) selFrame(sx, sy, size, on);
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '18px ' + MONO;
      const ly = sy + size + 26, sel = inventory[pn.cursor];
      if (pn.msg) { ctx.fillStyle = '#f5c542'; ctx.fillText(pn.msg, x + 24, ly); }
      else if (sel) {   // what the selected item is, and its total price
        const def = itemDef(sel.name) || {}, n = sel.count || 1;
        ctx.fillStyle = rarityColor(sel.name);   // name in its rarity colour
        ctx.fillText(`${sel.name} · ${rarityOf(sel.name)} ${def.class || sel.class || 'item'}${def.stack > 1 ? ` · ${n}/${def.stack}` : ''}`, x + 24, ly);
        ctx.fillStyle = '#cfcfcf';
        ctx.fillText(def.class === 'skill' ? 'Space to learn' : def.class === 'resource' ? 'crafting resource' : def.consume ? 'Space to consume: +1 mana cap' : def.class === 'upgrade' ? 'upgrade material (use comes later)'
          : `${bonusText(def)} when equipped · Space equip`, x + 24, ly + 26);
        const unit = def.class === 'equipment' ? def.price : def.value;   // equipment: shop price; resources: value per piece
        ctx.fillStyle = '#f5c542';
        ctx.fillText(unit === undefined ? 'total price: —' : `total price: ${unit * n}$${n > 1 ? `  (${n} × ${unit}$)` : ''}`, x + 24, ly + 52);
      } else { ctx.fillStyle = '#8a8a8a'; ctx.fillText('empty slot', x + 24, ly); }
      ctx.fillStyle = '#8a8a8a'; ctx.font = '16px ' + MONO;
      ctx.fillText('A/D choose · Space use · I or Esc close', x + 24, y + h - 18);
    }

    // hero: middle left. Full-body picture, stats, and the equipped slots (W/S choose, Space unequips).
    function drawHeroPanel() {
      const pn = panels.hero, on = focus === 'hero', w = HERO_PANEL.w, h = HERO_PANEL.h;
      const x = 16, y = (canvas.height - h) / 2, top = y + 64;
      panelFrame(x, y, w, h, heroName || DEFAULT_NAME, on);
      const bw = 180, bh = 320;
      ctx.fillStyle = '#1B2233'; ctx.fillRect(x + 24, top, bw, bh);
      const full = ART.heroFull;
      if (ready(full)) {   // full-body art, fitted into the box
        const ih = bh - 24, iw = Math.min(bw - 16, ih * full.naturalWidth / full.naturalHeight), ih2 = iw * full.naturalHeight / full.naturalWidth;
        ctx.imageSmoothingQuality = 'high'; ctx.drawImage(full, x + 24 + (bw - iw) / 2, top + (bh - ih2) / 2, iw, ih2);
      }
      const lines = [
        [`${ICON.health} health`, stats.health, 'health'], [`${ICON.strength} strength`, stats.strength, 'strength'],
        [`${ICON.mana} mana`, stats.mana, 'mana'], [`${ICON.charisma} charisma`, stats.charisma, 'charisma'],
        [`${ICON.energy} energy`, stats.energy, 'energy'],
        ['crit (spells)', `${(critChance() * 100).toFixed(2)}%`, 'crit'],
      ];
      const bonus = {};   // equipment bonus, shown as "base +bonus" with the bonus in green
      for (const it of equipped) for (const [st, n] of Object.entries((itemDef(it.name) || {}).gain || {})) bonus[st] = (bonus[st] || 0) + n;
      const lx = x + 24 + bw + 24, rx = x + w - 24 - 96 - 24;
      ctx.font = '20px ' + MONO; ctx.textBaseline = 'middle';
      lines.forEach(([k, v, key], i) => {
        const ly = top + 16 + i * 38, b = bonus[key] || 0;
        ctx.textAlign = 'left'; ctx.fillStyle = '#8a8a8a'; ctx.fillText(k, lx, ly);
        ctx.textAlign = 'right';
        if (b) {
          const extra = ` +${b}`;
          ctx.fillStyle = '#3ddc84'; ctx.fillText(extra, rx, ly);
          ctx.fillStyle = '#fff'; ctx.fillText(String(v - b), rx - ctx.measureText(extra).width, ly);
        } else { ctx.fillStyle = '#fff'; ctx.fillText(String(v), rx, ly); }
      });
      const size = 96, gap = 16, sx = x + w - 24 - size;
      for (let i = 0; i < EQUIP_SLOTS; i++) {
        const sy = top + i * (size + gap);
        drawSlot(sx, sy, size, equipped[i] || null);
        rowRects.push({ x: sx, y: sy, w: size, h: size, i, panel: 'hero' });
        if (i === pn.cursor) selFrame(sx, sy, size, on);
      }
      ctx.textAlign = 'left'; ctx.font = '18px ' + MONO;
      const ly = top + bh + 30, sel = equipped[pn.cursor];
      if (pn.msg) { ctx.fillStyle = '#f5c542'; ctx.fillText(pn.msg, x + 24, ly); }
      else if (sel) { ctx.fillStyle = '#cfcfcf'; ctx.fillText(`${sel.name} · ${bonusText(itemDef(sel.name))} · Space to unequip`, x + 24, ly); }
      else { ctx.fillStyle = '#8a8a8a'; ctx.fillText('empty equipment slot', x + 24, ly); }
      ctx.fillStyle = '#8a8a8a'; ctx.font = '16px ' + MONO;
      ctx.fillText('W/S choose · Space unequip · H or Esc close', x + 24, y + h - 18);
    }

    function toggleInventory() { if (!ui) togglePanel('inventory'); }
    document.getElementById('inv-btn').addEventListener('click', e => { e.currentTarget.blur(); if (!naming()) toggleInventory(); });

    // ---- account screen + cheat password -------------------------------------------
    const accEl = document.getElementById('account'), lockEl = document.getElementById('cheat-lock');
    const naming = () => !accEl.hidden || !lockEl.hidden;   // an overlay with text fields is open: the game ignores keys
    const $ = id => document.getElementById(id);
    let accMode = 'create';
    const accMsg = (m, ok) => { $('acc-err').textContent = m; $('acc-err').classList.toggle('ok', !!ok); };
    function setAccMode(mode) {
      accMode = mode; accMsg(''); $('acc-resend-row').hidden = true;
      $('acc-title').textContent = mode === 'create' ? 'Create account' : 'Log in';
      $('acc-submit').textContent = mode === 'create' ? 'Create account' : 'Log in';
      $('acc-name-row').hidden = mode !== 'create';
      $('acc-pass').autocomplete = mode === 'create' ? 'new-password' : 'current-password';
      $('acc-switch').textContent = mode === 'create' ? 'Already have an account? Log in' : 'New here? Create an account';
    }
    function showAccount(mode, msg, ok) {
      accEl.hidden = false; held.clear(); tapped.clear();
      const last = store.get(STORE.last);
      setAccMode(mode || (last ? 'login' : 'create'));
      $('acc-email').value = last || ''; $('acc-pass').value = '';
      if (msg) accMsg(msg, ok);
      $('acc-guest').textContent = heroName && !account ? 'Back to the game (guest)' : 'Play as guest (no saving)';
      if (!sb) accMsg("Can't reach the account server. Check your connection and reload, or play as a guest.");
      setTimeout(() => (accMode === 'login' && last ? $('acc-pass') : accMode === 'create' ? $('acc-name') : $('acc-email')).focus(), 0);
    }
    $('acc-switch').addEventListener('click', e => {
      e.preventDefault();
      setAccMode(accMode === 'create' ? 'login' : 'create');
    });
    // guest: play without an account (no saving). If a guest run is already going, just go back to it.
    $('acc-guest').addEventListener('click', e => {
      e.preventDefault();
      if (heroName && !account) { accEl.hidden = true; document.activeElement?.blur(); return; }
      enterGame(null);
    });
    // from the guest prompt: park the current run so it survives the email-confirmation reload, then show the form
    function toAccount(mode) {
      ui = null; closePanels();
      store.set(GUEST_RUN, { at: Date.now(), state: snapshot() });
      showAccount(mode);
      if (mode === 'create') $('acc-name').value = '';
    }
    $('acc-name').addEventListener('input', () => { const v = cleanName($('acc-name').value); if (v !== $('acc-name').value) $('acc-name').value = v; });
    let pendingEmail = '';   // email waiting for confirmation (for "resend")
    $('acc-resend').addEventListener('click', async e => {
      e.preventDefault();
      if (!pendingEmail) return;
      const { error } = await sb.auth.resend({ type: 'signup', email: pendingEmail, options: { emailRedirectTo: RETURN_URL } });
      accMsg(error ? error.message : `Sent again to ${pendingEmail}. Check your inbox (and spam).`, !error);
    });
    $('acc-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!sb) return;
      const email = $('acc-email').value.trim().toLowerCase(), pass = $('acc-pass').value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return accMsg('Enter a valid email.');
      if (pass.length < 6) return accMsg('Password needs at least 6 characters.');
      $('acc-submit').disabled = true; $('acc-resend-row').hidden = true;
      try {
        if (accMode === 'create') {
          const name = cleanName($('acc-name').value);
          if (!name) return accMsg('Enter a hero name (letters only).');
          const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { hero_name: name }, emailRedirectTo: RETURN_URL } });
          if (error) return accMsg(error.message);
          // Supabase answers an already-registered email with a user that has no identities (so it doesn't reveal who is signed up)
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0)
            return accMsg('This email already has an account. Log in instead.');
          store.set(STORE.last, email);
          if (data.session) return enterGame(data.session.user);   // confirmation switched off in Supabase: straight in
          pendingEmail = email; setAccMode('login'); $('acc-email').value = email;
          accMsg(`Almost done! We sent a confirmation link to ${email}. Open it to activate your account; it brings you back here.`, true);
          $('acc-resend-row').hidden = false;
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
          if (error) {
            if (/confirm/i.test(error.message)) { pendingEmail = email; $('acc-resend-row').hidden = false; return accMsg('Please confirm your email first: open the link we sent you.'); }
            return accMsg(/invalid/i.test(error.message) ? 'Wrong email or password.' : error.message);
          }
          store.set(STORE.last, email);
          enterGame(data.user);
        }
      } finally { $('acc-submit').disabled = false; }
    });
    // logged in (or offline with user = null): start a new run, then continue from the online save if there is one
    async function enterGame(user) {
      account = user ? { id: user.id, email: user.email } : null;
      heroName = user ? (user.user_metadata?.hero_name || user.email.split('@')[0]).slice(0, 10) : 'guest';
      accEl.hidden = true; document.activeElement?.blur();
      startMusic();
      newGame(); renderStats();
      lastAutosave = Date.now();   // don't autosave the fresh run over an existing save
      const { slots } = await listSlots();   // continue from the newest slot (autosave or manual)
      const latest = Object.values(slots || {}).sort((a, b) => new Date(b.at) - new Date(a.at))[0];
      const guestRun = account && store.get(GUEST_RUN);
      if (guestRun) store.set(GUEST_RUN, null);
      if (!account || account.id !== user.id) return;
      if (guestRun && guestRun.state && !latest && Date.now() - guestRun.at < 7 * 24 * 3600 * 1000) {   // a brand-new account takes over the guest run
        applySave(guestRun.state); await writeSlot(1);
        float('guest run saved', '#3ddc84', player.x + 0.5, player.y - 0.8);
      } else if (latest) { applySave(latest.state); float('welcome back', '#3ddc84', player.x + 0.5, player.y - 0.8); }
      lastAutosave = Date.now();
    }
    async function logOut() {
      ui = null; closePanels(); cheatsUnlocked = false;
      if (account) await writeSlot(1);   // autosave before leaving
      if (sb && account) await sb.auth.signOut();
      account = null; heroName = null; slotInfo = { state: 'loading', slots: {} };
      stopMusic();
      newGame(); renderStats(); showAccount('login');
    }
    // on page load: already logged in (Supabase keeps the session), or just back from the confirmation link?
    (async () => {
      const hash = new URLSearchParams(location.hash.slice(1));
      const linkError = hash.get('error_description');
      if (!sb) return showAccount();
      const { data } = await sb.auth.getSession();
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);   // tidy the address bar
      if (data.session) {
        const confirmedNow = hash.get('type') === 'signup';
        await enterGame(data.session.user);
        if (confirmedNow) float('email confirmed!', '#3ddc84', player.x + 0.5, player.y - 1.2);
      } else if (linkError) showAccount('login', `That link didn't work (${linkError.replace(/\+/g, ' ')}). Log in to get a new one.`);
      else showAccount();
    })();

    function openCheats() {
      if (cheatsUnlocked) { openWindow('cheat'); return; }
      lockEl.hidden = false; $('cheat-err').textContent = ''; $('cheat-pass').value = ''; held.clear(); tapped.clear();
      setTimeout(() => $('cheat-pass').focus(), 0);
    }
    $('cheat-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (await sha256($('cheat-pass').value) !== CHEAT_HASH) { $('cheat-err').textContent = 'Wrong password.'; $('cheat-pass').select(); return; }
      cheatsUnlocked = true; lockEl.hidden = true; document.activeElement?.blur(); openWindow('cheat');
    });
    $('cheat-pass').addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); lockEl.hidden = true; document.activeElement?.blur(); } });

    // ---- input --------------------------------------------------------------
    // keys are read by their physical position (e.code), so WASD, H, I, P and 1-3 work on any keyboard layout
    // (Cyrillic, AZERTY, Greek…). Arrow keys also move, and the number pad works for numbers.
    const CODE_KEYS = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', ArrowUp: 'w', ArrowLeft: 'a', ArrowDown: 's', ArrowRight: 'd',
                        KeyH: 'h', KeyI: 'i', KeyP: 'p', KeyM: 'm' };
    const keyOf = e => CODE_KEYS[e.code] || (/^(Digit|Numpad)[0-9]$/.test(e.code) ? e.code.slice(-1) : e.key.toLowerCase());
    addEventListener('keydown', e => {
      if (naming() || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = keyOf(e);
      if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) spacePressed(); return; }
      if (k === 'p') { e.preventDefault(); if (!e.repeat && !locked()) { if (ui && ui.kind === 'cheat') closeWindow(); else openCheats(); } return; }   // CHEAT menu (testing) — remove before release
      if (k === 'i') { e.preventDefault(); if (!e.repeat && !ui) togglePanel('inventory'); return; }
      if (k === 'm') { e.preventDefault(); if (!e.repeat && !locked()) { if (ui && ui.kind === 'map') closeWindow(); else if (!ui) openWindow('map'); } return; }
      if (k === 'h') { e.preventDefault(); if (!e.repeat && !ui) togglePanel('hero'); return; }
      if (e.key === 'Escape') { e.preventDefault(); if (!e.repeat) escPressed(); return; }
      if (e.code === 'Tab') { e.preventDefault(); if (!e.repeat && !anyOpen()) cycleTarget(); return; }
      if (ui && /^[1-9]$/.test(k)) { choose(+k - 1); return; }
      if (!anyOpen() && /^[1-3]$/.test(k)) { e.preventDefault(); if (!e.repeat) castSpell(+k - 1); return; }
      if (!KEYS.includes(k)) return;
      e.preventDefault();
      if (anyOpen()) { press([k]); return; }        // cursor moves, repeat allowed
      if (!e.repeat) press([k]);
    });
    addEventListener('keyup', e => {
      const k = keyOf(e);
      if (KEYS.includes(k)) release([k]);
    });
    addEventListener('blur', () => held.clear());

    // tap/click a row in a window to pick it
    canvas.addEventListener('pointerdown', e => {
      if (!anyOpen() || naming()) return;
      const r = canvas.getBoundingClientRect();
      const s = Math.min(r.width / canvas.width, r.height / canvas.height);   // object-fit: contain
      const ox = (r.width - canvas.width * s) / 2, oy = (r.height - canvas.height * s) / 2;
      const cx = (e.clientX - r.left - ox) / s, cy = (e.clientY - r.top - oy) / s;
      const hit = rowRects.find(b => (!ui || !b.panel) && cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h);
      if (hit && hit.panel) { focus = hit.panel; panels[hit.panel].cursor = hit.i; panels[hit.panel].msg = ''; }   // click a panel slot: focus + select
      else if (hit) choose(hit.i);
    });

    spawnAllDrips();   // start of the game: every enemy in the world is spawned
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
