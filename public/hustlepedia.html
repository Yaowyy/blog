<head>

<style>
  :root {
    --bg: #0a0d16; --panel: #111726; --panel2: #161e31; --line: #222d45; --text: #e6ebf5; --muted: #8a96ad; --faint: #5b6680;
    --cyan: #00e5ff; --pink: #ff2bd6; --yellow: #ffe600; --green: #9dff5c; --red: #e5484d; --orange: #ff9a2e; --blue: #4ea1ff;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 120px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--mono); -webkit-font-smoothing: antialiased; }
  a { color: var(--cyan); }
  img { image-rendering: auto; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* hero banner */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 40%; opacity: .55; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 5%, rgba(10,13,22,.4) 60%, rgba(10,13,22,.2)); }
  .hero .wrap { position: relative; z-index: 1; padding-top: 72px; padding-bottom: 28px; }
  .hero h1 { margin: 0; font-size: clamp(38px, 8vw, 72px); letter-spacing: -.02em; line-height: 1; text-shadow: 0 0 24px rgba(255,43,214,.55); }
  .hero h1 span { color: var(--pink); }
  .hero p { margin: 10px 0 0; color: #c7cfe0; max-width: 560px; }
  .back { position: absolute; top: 16px; left: 16px; z-index: 2; display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border: 1px solid var(--cyan);
          color: var(--cyan); background: rgba(10,13,22,.7); border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; }
  .back:hover { background: var(--cyan); color: #000; }

  /* sticky tabs + search */
  .bar { position: sticky; top: 0; z-index: 10; background: rgba(10,13,22,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; gap: 10px; align-items: center; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { flex: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 13px; border: 1px solid transparent; }
  .tabs a:hover, .tabs a.on { color: var(--text); border-color: var(--line); background: var(--panel); }
  .tabs a.on { color: var(--yellow); }
  #q { flex: 1 1 200px; max-width: 280px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 14px; }
  #q:focus { outline: none; border-color: var(--cyan); }

  section { padding: 34px 0 10px; }
  h2 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 .k { color: var(--cyan); }
  .lead { color: var(--muted); margin: 0 0 18px; }
  h3 { font-size: 17px; margin: 26px 0 10px; color: var(--yellow); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .grid.small { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card.big { grid-column: 1 / -1; }
  .card h4 { margin: 0; font-size: 16px; }
  .head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .icon { width: 52px; height: 52px; flex: none; border-radius: 10px; background: #1b2233; border: 1px solid var(--line); object-fit: contain; padding: 4px; }
  .portrait { width: 84px; height: 84px; border-radius: 12px; background: #1b2233; border: 1px solid var(--line); object-fit: cover; flex: none; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; margin: 2px 4px 0 0; white-space: nowrap; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .desc { color: #c3cbdc; font-size: 13.5px; margin: 6px 0 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; }
  .stat b { color: var(--text); }
  ul.facts { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: #c3cbdc; }
  ul.facts li { margin: 3px 0; }
  ul.facts b { color: var(--text); }
  .phase { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--orange); background: var(--panel2); border-radius: 0 8px 8px 0; }
  .phase h5 { margin: 0 0 4px; font-size: 14px; color: var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .tablebox { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
  kbd { font: 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel2); color: var(--text); white-space: nowrap; }
  .keys { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .key { display: flex; gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .key kbd { flex: none; }
  .key span { color: #c3cbdc; }
  .branch { border-top: 3px solid var(--c); }
  .branch h4 { color: var(--c); }
  .ranks { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12.5px; margin-top: 6px; }
  .ranks span:nth-child(odd) { color: var(--faint); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); padding: 20px 0; }
  footer { color: var(--faint); font-size: 12px; padding: 30px 0 50px; border-top: 1px solid var(--line); margin-top: 30px; }
  @media (max-width: 600px) { body { font-size: 14px; } .grid, .keys { grid-template-columns: 1fr; } .key { flex-wrap: wrap; } .portrait { width: 64px; height: 64px; } }
</style>

function basics() {

    ['$', `Money. Earned at TradeCorp, from quests and from enemy loot. You lose what you carry when you die (see below).`],

  const kv = list => `<div class="keys">${list.map(([k, v]) => `<div class="key" data-s="${esc((k + ' ' + v).toLowerCase())}"><kbd>${esc(k)}</kbd><span>${esc(v)}</span></div>`).join('')}</div>`;
  const statusList = Object.values(D.states).filter(st => !/^Top 1/.test(st.label)).map(st =>
    card(`<div class="head">${st.icon ? img(st.icon) : `<div class="icon" style="display:grid;place-items:center;color:${st.color};font-size:22px">${esc(st.symbol)}</div>`}<h4 style="color:${st.color}">${esc(st.label)}</h4></div>`, st.label)).join('');
  const lvRows = L.map(l => [l.L, l.L < D.maxLevel ? l.exp : 'max', l.hp, l.str, l.mana, l.nrg, `${l.crit}%`, l.quest ? `${l.quest.exp} exp · ${l.quest.money}$` : '—']);

  return `<section id="basics">
    <h2><span class="k">01</span> Basics</h2><p class="lead">How to play, what your stats do and how you grow.</p>

    <h3>Level difference</h3>

    <p class="muted">Kill exp = enemy max HP × ${D.killExp} × that factor. Enemy damage = a share of a same-level hero's max HP × that factor (the shares are listed with each enemy).</p>

      <li>You wake up in the city with 1 HP and 1$.</li>

      <li>A worn <b>Vault Pack</b> keeps 10% of your money safe (two don't make 20%).</li>
      <li>HomeDome (city): rest for ${D.rest.price}$ to get back ${pct(D.rest.share.health)} of max HP, NRG and mana, once every ${D.rest.cooldownMs / 60000} minutes.</li></ul>`, 'death die pile respawn homedome rest vault', 'big')}
  </section>`;
}

const lootLine = E => {
  const l = E.loot || {}, out = [];
  if (l.money) out.push(`${range(l.money)}$${l.zoneMoney ? ' + zone bonus (|x|+|y| of the zone)' : ''}`);
  if (l.tar) out.push(`${range(l.tar)} Tar`);
  const ch = { magicTarChance: 'Magic tar', mutagenChance: 'MutaGen', aiChipChance: 'AI chip', sporeSacChance: 'Spore Sac', coreChance: 'Loader Core' };
  for (const k in ch) if (l[k]) out.push(`${ch[k]} ${pct(l[k], 1)}`);
  if (l.queenRare) { const t = l.queenTarShare ?? 0.5; out.push(`always 1 spell: Magic tar ${pct(t)} / Magic Nozzle ${pct(1 - t)}`); }
  return out.join(' · ');
};

function enemies() {
  const hitboxLine = E => { const B = (D.foeBox || {})[E.key]; if (!B) return '';
    return `<li><b>Hitbox:</b> body ${B.w} × ${B.h} m${E.key === 'drone' ? ' (up in the air with it)' : ''}${E.key === 'queen' ? ' (10% taller in stage 2)' : ''} · ground circle ${+(B.gr * 2).toFixed(2)} m across${E.key === 'drone' ? ' (only when it drops low after a ram)' : ''}.${E.key === 'scav' ? '' : ` Its melee reaches ${D.hitReach} m from its body.`}</li>`; };
  const order = ['drip', 'scav', 'drone', 'spore', 'crawler', 'loader', 'queen'];
  const list = order.map(k => D.enemies.find(e => e.key === k)).filter(Boolean);
  const cards = list.map(E => {
    const zs = foeZones(E.key), lv = zs.map(z => z.level), count = zs.reduce((t, z) => t + z.foes[E.key], 0);
    const hp = [...new Set(lv)].sort((a, b) => a - b).slice(0, 4).map(l => `lvl ${l}: <b>${E.hpByLevel[l - 1]}</b>`).join(' · ');
    const f = enemyFacts(E), boss = E.key === 'queen', mini = E.key === 'loader';
    const exp = E.key === 'queen' ? `${E.exp} at your level (less once you out-level her)` : `max HP × ${D.killExp} (${Math.round(E.hpByLevel[(lv[0] || 1) - 1] * D.killExp)} for a lvl ${lv[0] || 1} at your level)`;
    const resp = E.respawnMs ? `${range(E.respawnMs.map(m => Math.round(m / 1000)))} s` : '';
    const body = Array.isArray(f) ? `<ul class="facts">${f.map(t => `<li>${t}</li>`).join('')}</ul>`
      : f.phases.map(([t, items]) => `<div class="phase"><h5>${t}</h5><ul class="facts">${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`).join('');
    return card(`<div class="head">${img(E.portrait, 'portrait')}<div>
        <h4>${esc(E.name)} ${boss ? '<span class="tag" style="color:var(--orange)">boss</span>' : mini ? '<span class="tag" style="color:var(--green)">mini-boss</span>' : ''}</h4>
        <div class="muted" style="font-size:13px">${zs.length ? `${zoneNames(zs)} · level ${levelSpan(zs)} · ${count} in the world` : '—'}</div>
        <div class="stats"><span class="stat">HP ${hp}</span><span class="stat">respawn <b>${resp}</b></span></div></div></div>
      ${body}
      <ul class="facts"><li><b>Loot:</b> ${lootLine(E)}</li><li><b>Exp:</b> ${exp}</li>${hitboxLine(E)}</ul>`,
      [E.name, zoneNames(zs), lootLine(E)].join(' '), boss ? 'big' : '');
  });
  return `<section id="enemies"><h2><span class="k">02</span> Enemies &amp; bosses</h2>
    <p class="lead">Every enemy moves freely: it walks around buildings to reach you, and ranges are measured in metres from its feet to yours. Enemies never walk through each other, and small ones stop when they bump into you. Melee hits only land if you're still in reach when the wind-up ends, so step back to dodge. Your hits push them back for real, and walls stop the push. Beat an enemy, then stand next to its body and press Space (or tap it) to loot. Loot stays for 30 s (bosses 60 s). Damage shown for a hero of the enemy's level; see Level difference for other levels.</p>
    <div class="grid">${cards.join('')}</div></section>`;
}

// ---------- ITEMS ----------
const hvWhere = k => [...new Set(k.zones.map(t => (ZTYPE[t] || [])[0]).filter(Boolean).map(z => z.name))].join(' + ');
const sellPrice = it => D.shopSell && D.shopSell.classes.includes(it.class) ? Math.floor((it.value || 0) * D.shopSell.share) : 0;   // ATB-Market Resources tab, per piece
const howToGet = it => {
  const out = [];
  if (it.tab) out.push(`ATB-Market · ${(D.shopTabs.find(t => t.key === it.tab) || {}).name || it.tab}${it.buyLevel ? ` (from level ${it.buyLevel})` : it.minLevel && it.class === 'patch' ? ` (from level ${it.minLevel})` : ''}`);
  const keys = { 'Magic tar': ['magicTarChance', 'queenRare'], 'MutaGen': ['mutagenChance'], 'AI chip': ['aiChipChance'], 'Spore Sac': ['sporeSacChance'], 'Loader Core': ['coreChance'], 'Tar': ['tar'], 'Magic Nozzle': ['queenRare'] };
  for (const E of D.enemies) for (const k of keys[it.name] || []) if (E.loot && E.loot[k]) out.push(`loot: ${E.name}`);
  const r = D.recipes.find(r => r.make === it.name);
  if (r) out.push(r.soon ? 'MutaTech (recipe coming soon)' : `MutaTech: ${r.cost.map(([n, c]) => `${c} ${n}`).join(' + ')} + ${r.energy} NRG (level ${r.minLevel})`);
  if (D.deals.salePool.common.includes(it.name) || D.deals.salePool.rare.includes(it.name)) out.push('TradeCorp sale deals');
  if (it.name === 'Scrap') out.push('Scrap Dealer (scrapping armor, weapons and bags)');
  const hv = D.harvest && D.harvest.kinds.find(k => k.item === it.name);
  if (hv) out.push(`harvest: ${hvWhere(hv)} (hold ${D.harvest.holdMs / 1000} s)`);
  if (D.shopSell && D.shopSell.buy.includes(it.name)) out.push(`ATB-Market · Resources (${it.value}$ each)`);
  return [...new Set(out)].join(' · ') || '—';
};
function itemCard(it) {
  const chips = [statChips(it.gain), statChips(it.capGain).replace(/<\/b> (HP|NRG)/g, '</b> max $1')];
  if (it.hit) chips.push(`<span class="stat"><b>+${it.hit}</b> HIT</span>`);
  if (it.attackMs) chips.push(`<span class="stat"><b>${-it.attackMs / 1000} s</b> faster swings</span>`);
  if (it.meleeArea) chips.push(`<span class="stat"><b>×${it.meleeArea}</b> swing area</span>`);
  if (it.speed) chips.push(`<span class="stat"><b>+${pct(it.speed)}</b> speed</span>`);
  if (it.hpRegen) chips.push(`<span class="stat"><b>+${it.hpRegen}</b> HP/min</span>`);
  if (it.slots) chips.push(`<span class="stat"><b>${it.slots}</b> slots</span>`);
  if (it.keepMoney) chips.push(`<span class="stat">keeps <b>${pct(it.keepMoney)}</b> money on death</span>`);
  if (it.minLevel && it.class !== 'patch') chips.push(`<span class="stat">level <b>${it.minLevel}</b> to equip</span>`);
  if (it.stack) chips.push(`<span class="stat">stacks <b>${it.stack}</b></span>`);
  if (it.consume && it.consume.manaCap) chips.push(`<span class="stat">use: <b>+${it.consume.manaCap}</b> max mana</span>`);
  const sp = D.spells[it.name];
  if (sp) chips.push(`<span class="stat"><b>${sp.mana}</b> mana</span>`);
  const sell = sellPrice(it);
  if (sell) chips.push(`<span class="stat">shop buys for <b>${sell}$</b></span>`);
  if (D.scrap && (it.kind || it.slot || it.class === 'bag') && it.price) chips.push(`<span class="stat">scraps for <b>${Math.round(it.price * D.scrap.scrapPerCost)}</b> Scrap</span>`);
  const price = it.price ? `${it.price}$` : it.value ? `worth ${it.value}$` : '';
  const extra = it.class === 'patch' ? ' · +12% price per install' : D.foodClimb[it.name] ? ` · +${D.foodClimb[it.name]}$ per 100 food bought` : '';
  const spellText = it.name === 'Magic tar' ? `Spell: a blob of tar flies ${sp.range} m toward your cursor (your Tab target if you have one; on phones the closest enemy): roots it ${sec(sp.rootMs)} and burns ${range(sp.dot)} per second for ${sp.ticks} s.`
    : it.name === 'Magic Nozzle' ? `Spell <b>Fuel Spray</b>: a cone (${sp.range} m) toward your cursor (or Tab target) hitting every enemy in it: ${pct(sp.slow)} slower for ${sec(sp.slowMs)} and ${range(sp.dot)} damage per second for ${sp.ticks} s.` : '';
  return card(`<div class="head">${img(it.icon)}<div><h4 style="color:${RC(it.rarity)}">${esc(it.name)}</h4>
      <div>${rarityTag(it.rarity || 'common')}${it.set ? `<span class="tag" style="color:var(--green)">${esc(it.set)} set</span>` : ''}<span class="muted" style="font-size:12.5px">${price}${extra}</span></div></div></div>
    ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ''}${spellText ? `<p class="desc">${spellText}</p>` : ''}
    <div class="stats">${chips.join('')}</div>
    <p class="desc faint" style="font-size:12.5px">Get it: ${howToGet(it)}</p>`, [it.name, it.rarity, it.class, it.set, it.desc, howToGet(it)].join(' '));
}
function items() {
  const groups = [
    ['Food', it => it.class === 'food'],
    ['Patches (charisma)', it => it.class === 'patch'],
    ['Weapons', it => it.kind === 'sword'],
    ['Armor', it => it.slot],
    ['Bags', it => it.class === 'bag'],
    ['Spells', it => it.class === 'skill'],
    ['Resources, loot & upgrades', it => ['resource', 'upgrade'].includes(it.class)],
  ];
  const bagRules = card(`<ul class="facts">
      <li><b>Two bag slots</b> at the top of the inventory window. A new hero starts wearing a <b>BackBag</b>.</li>
      <li>Both bags' slots add up into <b>one shared inventory</b> (e.g. BackBag 2 + BackBag X 4 = 6 slots). Their stat bonuses add up too, even for two of the same bag.</li>
      <li>Buying a bag with a free bag slot puts it on at once. With both slots full, Space on a bag in the inventory swaps it for your <b>smaller</b> worn bag. The shop asks first only if both worn bags are as good or better.</li>
      <li>Space on a worn bag (or right-click / tap it) takes it off, if everything you carry still fits without it.</li>
      <li>The Vault Pack's money keep doesn't stack: two of them still keep 10%.</li></ul>`, 'bag slots two bags shared inventory backbag');
  const sets = D.sets.map(st => card(`<h4 style="color:var(--green)">${esc(st.name)} set</h4>
    <p class="desc">${st.items.map(esc).join(' + ')}</p><div class="stats">${statChips(st.gain)}${statChips(st.capGain).replace(/<\/b> (HP|NRG)/g, '</b> max $1')}<span class="stat">new look</span></div>`, st.name + ' set ' + st.items.join(' '))).join('');
  const rec = D.recipes.map(r => [esc(r.make), r.soon ? '<span class="faint">coming soon</span>' : r.cost.map(([n, c]) => `${c} ${esc(n)}`).join(' + '), r.soon ? '' : `${r.energy} NRG`, r.soon ? '' : r.minLevel]);
  return `<section id="items"><h2><span class="k">03</span> Items, shop &amp; sets</h2>
    <p class="lead">Equipment goes to your bag: equip it from there (one weapon, head, chest and boots). You have <b>two bag slots</b> and start with a BackBag: the slots of both worn bags add up into one shared inventory.</p>
    ${groups.map(([t, f]) => { const l = D.items.filter(f).sort((a, b) => (a.price || a.value || 0) - (b.price || b.value || 0)); return l.length ? `<h3>${t}</h3>${t === 'Bags' ? bagRules : ''}<div class="grid">${l.map(itemCard).join('')}</div>` : ''; }).join('')}
    <h3>Sets</h3><p class="muted">Wear every piece of a set for its bonus and a new look.</p><div class="grid small">${sets}</div>
    <h3>MutaTech crafting (city)</h3>${table(['Makes', 'Needs', 'Energy', 'Level'], rec)}
    <h3>Scrap Dealer (slums 0:1)</h3>
    ${card(`<ul class="facts"><li>Turns <b>armor, weapons and bags</b> from your bag into Scrap: <b>${pct(D.scrap.scrapPerCost, 2)}</b> of the item's full price, rounded (e.g. a ${D.items.find(i => i.name === 'Banana sword').price}$ Banana sword = ${Math.round(D.items.find(i => i.name === 'Banana sword').price * D.scrap.scrapPerCost)} Scrap). <b>No money.</b></li><li>Worn items can't be scrapped. If the Scrap wouldn't fit in your bag, the dealer refuses.</li><li>Doesn't buy resources, spells or food, and doesn't sell Scrap. Sell loot at the ATB-Market instead.</li></ul>`, 'scrap dealer scrap gear', 'big')}
    ${D.harvest ? `<h3>Harvesting</h3>
    ${card(`<ul class="facts"><li>Glowing piles lie on the ground in the wild. Stand on one or face it and <b>hold Space</b> (phone: <b>hold A</b>) for <b>${D.harvest.holdMs / 1000} s</b>. Moving, letting go, opening a window or <b>taking any damage</b> cancels it.</li>
      <li>Each pile gives <b>1</b> item, then regrows somewhere else, always ${D.harvest.near[0]}–${D.harvest.near[1]} m from an enemy's home, so there's always danger nearby.</li></ul>
      ${table(['Resource', 'Where', 'How many', 'Regrows after'], D.harvest.kinds.map(k => [`<b style="color:${RC((D.items.find(i => i.name === k.item) || {}).rarity)}">${esc(k.item)}</b>`, esc(hvWhere(k)), k.per > 1 ? `1 per ${k.per} zones` : '1 per zone', `${k.cooldownMs / 60000} min`]))}`, 'harvest harvesting hold gather pile ' + D.harvest.kinds.map(k => k.item).join(' '), 'big')}` : ''}
    <h3>Selling loot (ATB-Market · Resources tab)</h3>
    ${card(`<ul class="facts"><li>Sells <b>${D.shopSell.buy.join(', ')}</b> at full value.</li><li>Buys resources, upgrades and spells from your bag for <b>${pct(D.shopSell.share)}</b> of their value, rounded down per piece: ${D.items.filter(i => sellPrice(i) > 0).sort((a, b) => sellPrice(a) - sellPrice(b)).map(i => `${esc(i.name)} ${sellPrice(i)}$`).join(' · ')}.</li><li>Pick a stack, then <b>Sell 1</b> or <b>Sell all</b>.</li></ul>`, 'sell selling shop resources tar loot', 'big')}
  </section>`;
}

// ---------- TALENTS ----------
function talents() {
  const br = D.talents.map(b => card(`<h4>${esc(b.name)}</h4><p class="desc">Every point: ${esc(b.per)}<br>Full branch (12/12): ${esc(b.full)}</p>
    ${b.talents.map((t, i) => `<div style="margin-top:12px"><div class="head">${img(t.icon)}<div><b>${i + 1}. ${esc(t.name)}</b>${i ? `<div class="faint" style="font-size:12px">needs ${D.talentMax}/${D.talentMax} in ${esc(b.talents[i - 1].name)}</div>` : ''}</div></div>
      <div class="ranks">${t.ranks.map((r, k) => `<span>${k + 1}/${D.talentMax}</span><span>${esc(r)}</span>`).join('')}</div></div>`).join('')}`,
    [b.name, b.per, b.full, ...b.talents.map(t => t.name + ' ' + t.ranks.join(' '))].join(' '), 'branch').replace('class="card branch"', `class="card branch" style="--c:${b.color}"`)).join('');
  return `<section id="talents"><h2><span class="k">04</span> Talents</h2>
    <p class="lead">Spend talent points at TechVersity (city). You get 1 point per level (${D.maxLevel - 1} by level ${D.maxLevel}). Each talent takes up to ${D.talentMax} points, and the next talent in a branch opens once the one before it is full. Resetting costs ${D.talentReset}$ × your level.</p>
    <div class="grid">${br}</div></section>`;
}

// ---------- QUESTS & WORK ----------
function quests() {
  const qm = D.questMult;
  const q = D.quests.map(r => [`<b style="color:${RC(r.rarity)}">${esc(r.name)}</b>${r.boss ? ' <span class="tag" style="color:var(--orange)">boss</span>' : ''}`, r.lvl, esc(r.rarity), esc(r.goal), r.after ? esc(r.after) : 'Rogue\'s lessons', `${r.pay.exp} exp · ${r.pay.money}$`]);
  const t = D.tutorial;
  const del = D.deliveries.map(d => [esc(d.zone), d.level, `${Math.floor(d.seconds / 60)}:${String(d.seconds % 60).padStart(2, '0')}`, `${d.common.exp} exp · ${d.common.money}$`, `${d.rare.exp} exp · ${d.rare.money}$`]);
  const ch = D.deals.chances.map(([type, rare, p]) => [`${rare ? 'Rare ' : ''}${rare ? type : type[0].toUpperCase() + type.slice(1)}`, pct(p, 2)]);
  const promo = D.promotions.map(p => [esc(p.name), p.deals, p.charisma, `×${p.mult}`]);
  const lb = Object.entries(D.lbBuffs).map(([k, b]) => [({ exp: 'Top 1 Exp', deals: 'Top 1 Dealer', kills: 'Top 1 Slayer' })[k], `${Object.entries(b.gain).map(([s, n]) => `+${n} ${STAT[s]}`).join(' ')}${b.speed ? ` · +${pct(b.speed)} speed` : ''}`]);
  return `<section id="quests"><h2><span class="k">05</span> Quests &amp; work</h2>
    <p class="lead">Up to ${D.maxQuests} active quests at once (Q). Quest rewards: exp = (exp from the quest's level to the next) × 0.1 × rarity, money = the same × 0.04. Rarity: ${Object.entries(qm).map(([k, v]) => `${k} ×${v}`).join(', ')}. Boss quests pay double.</p>
    <h3>The Rogue (city)</h3>
    <p class="muted">${esc(t.name)}: her ${t.steps}-step tutorial and a 3-question quiz, level ${t.lvl} ${t.rarity}: ${t.pay.exp} exp · ${t.pay.money}$ (each wrong answer takes a little off). After it she offers these, one after another. Finished quests are handed in to her.</p>
    ${table(['Quest', 'Level', 'Rarity', 'Goal', 'Unlocked by', 'Reward'], q)}
    <h3>Deliveries (TradeCorp)</h3>
    <p class="muted">A delivery deal gives you a parcel for the Netizen Chef's food cart. Get it there before the timer runs out. Scheduled = common, Priority = rare.</p>
    ${table(['Destination', 'Level', 'Time', 'Scheduled', 'Priority'], del)}
    <h3>TradeCorp deals (city)</h3>
    <p class="muted">Three deals at a time; all reroll after you take one. Calls cost energy and pay money (more with level and charisma; rare calls pay ×${D.deals.w.rare} instead of ×${D.deals.w.common}). Sales sell you items at full price. Each deal also gives exp (calls: 1 + 1 per 5$ profit).</p>
    <div class="grid"><div>${table(['Deal', 'Chance'], ch)}</div><div>${table(['Promotion', 'Deals', 'CHSM', 'Deal cost'], promo)}</div></div>
    <h3>Leaderboard buffs</h3><p class="muted">The leaderboard (L) has three lists (Top Exp, Top Dealers, Top Slayers), each shown for this month and for all time, with the top 10 and your own place. Monthly lists count what you earned since the 1st (London time) and start from zero every month. Being number 1 on a <b>monthly</b> list gives you its buff while you hold the spot; all-time lists are for glory.</p>
    ${table(['Spot', 'Buff'], lb)}
  </section>`;
}

// ---------- WORLD ----------
function world() {
  const typeOrder = ['city', 'slums', 'greaser', 'factoryIn', 'factory', 'wasteland', 'pit', 'lake', 'forest', 'deepForest'];
  const NAMES = { drip: 'Drip', scav: 'Toxic Scav', drone: 'Mav-1K', spore: 'Sporeling', crawler: 'Scrap Crawler', loader: 'Overgrown Loader', queen: 'Pump Queen' };
  const rows = typeOrder.filter(t => ZTYPE[t]).map(t => {
    const zs = ZTYPE[t], foes = {};
    for (const z of zs) for (const k in z.foes) foes[k] = (foes[k] || 0) + z.foes[k];
    const places = [...new Set(zs.flatMap(z => z.places))];
    return [`<b>${esc(zs[0].name)}</b>`, zs.length, levelSpan(zs), Object.entries(foes).map(([k, n]) => `${n} ${NAMES[k] || k}`).join(', ') || '<span class="faint">safe</span>', places.map(esc).join(', ') || '—'];
  });
  const city = [
    ['ATB-Market', 'Shop: food, patches, weapons, armor and bags. Resources tab: buy Tar, sell loot for half its value.'], ['TradeCorp', 'Work: customer calls, sales and deliveries; promotions from the Boss.'],
    ['HomeDome', `Rest for ${D.rest.price}$: ${pct(D.rest.share.health)} of max HP, NRG and mana back, every ${D.rest.cooldownMs / 60000} min.`],
    ['MutaTech', 'Crafting: Tar Orbs, the baNano Sword and more.'], ['TechVersity', 'Spend talent points.'], ['Rogue', 'Tutorial and quests.'], ['Pixi', 'In front of TradeCorp: the city\'s announcer. A pink "!" over her means news: talk to her to hear what just opened.'],
    ['Scrap Dealer', 'Slums 0:1: turns armor, weapons and bags into Scrap (no money).'], ['Netizen Chef', 'Delivery destination in the slums.'],
    ['CredBank', `Vault: ${D.vault.sockets.length} bag sockets, bought in order for ${D.vault.sockets.map(c => c.toLocaleString('en') + '$').join(', ')}. The bags you put in them add up into one storage (3 BackBags = 6 slots). Storing an item costs ${D.vault.fees.store}$, taking it out ${D.vault.fees.withdraw}$ (a whole stack counts as one item). Everything in the Vault is kept when you die. Exchange tab: under construction.`],
    ['Metro Station · Ripperdoc Clinic', 'Coming soon.'],
  ];
  return `<section id="world"><h2><span class="k">06</span> World</h2>
    <p class="lead">Zones have map coordinates (M opens the map). A zone's level is the bigger of its two coordinates, and every enemy there has that level. Discovering a zone gives |x| + |y| exp.</p>
    ${table(['Area', 'Zones', 'Level', 'Enemies', 'Places'], rows)}
    <h3>Places</h3><div class="grid small">${city.map(([n, t]) => card(`<h4 style="color:var(--cyan)">${esc(n)}</h4><p class="desc">${esc(t)}</p>`, n + ' ' + t)).join('')}</div>
  </section>`;
}

// ---------- page ----------
$('#banner').src = D.art.startScreen || '';
$('#main').innerHTML = basics() + enemies() + items() + talents() + quests() + world();
$('#foot').textContent = `Hustlepedia · numbers read from the game on ${new Date(D.version).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}.`;
// opened from the game in a new tab: "back" closes this tab and returns to the game
$('#back').addEventListener('click', e => { if (window.opener) { e.preventDefault(); window.close(); } });

// search: hides cards and table rows that don't match, and sections left empty
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('[data-s]').forEach(el => el.classList.toggle('hidden', !!q && !el.dataset.s.includes(q)));
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.toggle('hidden', !!q && !tr.textContent.toLowerCase().includes(q)));
  document.querySelectorAll('section').forEach(s => {
    const any = !q || [...s.querySelectorAll('[data-s], tbody tr')].some(el => !el.classList.contains('hidden'));
    s.classList.toggle('hidden', !any);
  });
});
// highlight the tab of the section in view
const tabs = [...document.querySelectorAll('#tabs a')];
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) tabs.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('section').forEach(s => io.observe(s));
</script>
</body>
</html>
