<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hustlepedia · Neon Hustle</title>

<meta name="theme-color" content="#0a0d16">
<style>
  :root {
    --bg: #0a0d16; --panel: #111726; --panel2: #161e31; --line: #222d45; --text: #e6ebf5; --muted: #8a96ad; --faint: #5b6680;
    --cyan: #00e5ff; --pink: #ff2bd6; --yellow: #ffe600; --green: #9dff5c; --red: #e5484d; --orange: #ff9a2e; --blue: #4ea1ff;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 120px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--mono); -webkit-font-smoothing: antialiased; }
  a { color: var(--cyan); }
  img { image-rendering: auto; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* hero banner */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 40%; opacity: .55; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 5%, rgba(10,13,22,.4) 60%, rgba(10,13,22,.2)); }
  .hero .wrap { position: relative; z-index: 1; padding-top: 72px; padding-bottom: 28px; }
  .hero h1 { margin: 0; font-size: clamp(38px, 8vw, 72px); letter-spacing: -.02em; line-height: 1; text-shadow: 0 0 24px rgba(255,43,214,.55); }
  .hero h1 span { color: var(--pink); }
  .hero p { margin: 10px 0 0; color: #c7cfe0; max-width: 560px; }
  .back { position: absolute; top: 16px; left: 16px; z-index: 2; display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border: 1px solid var(--cyan);
          color: var(--cyan); background: rgba(10,13,22,.7); border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; }
  .back:hover { background: var(--cyan); color: #000; }

  /* sticky tabs + search */
  .bar { position: sticky; top: 0; z-index: 10; background: rgba(10,13,22,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; gap: 10px; align-items: center; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { flex: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 13px; border: 1px solid transparent; }
  .tabs a:hover, .tabs a.on { color: var(--text); border-color: var(--line); background: var(--panel); }
  .tabs a.on { color: var(--yellow); }
  #q { flex: 1 1 200px; max-width: 280px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 14px; }
  #q:focus { outline: none; border-color: var(--cyan); }

  section { padding: 34px 0 10px; }
  h2 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 .k { color: var(--cyan); }
  .lead { color: var(--muted); margin: 0 0 18px; }
  h3 { font-size: 17px; margin: 26px 0 10px; color: var(--yellow); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .grid.small { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card.big { grid-column: 1 / -1; }
  .card h4 { margin: 0; font-size: 16px; }
  .head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .icon { width: 52px; height: 52px; flex: none; border-radius: 10px; background: #1b2233; border: 1px solid var(--line); object-fit: contain; padding: 4px; }
  .portrait { width: 84px; height: 84px; border-radius: 12px; background: #1b2233; border: 1px solid var(--line); object-fit: cover; flex: none; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; margin: 2px 4px 0 0; white-space: nowrap; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .desc { color: #c3cbdc; font-size: 13.5px; margin: 6px 0 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; }
  .stat b { color: var(--text); }
  ul.facts { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: #c3cbdc; }
  ul.facts li { margin: 3px 0; }
  ul.facts b { color: var(--text); }
  .phase { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--orange); background: var(--panel2); border-radius: 0 8px 8px 0; }
  .phase h5 { margin: 0 0 4px; font-size: 14px; color: var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .tablebox { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
  kbd { font: 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel2); color: var(--text); white-space: nowrap; }
  .keys { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .key { display: flex; gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .key kbd { flex: none; }
  .key span { color: #c3cbdc; }
  .branch { border-top: 3px solid var(--c); }
  .branch h4 { color: var(--c); }
  .ranks { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12.5px; margin-top: 6px; }
  .ranks span:nth-child(odd) { color: var(--faint); }
  .hidden { display: none !important; }
  .sti { height: 1.2em; width: auto; vertical-align: -0.25em; margin: 0 0.1em; }   /* stat icon inside text */
  .empty { color: var(--muted); padding: 20px 0; }
  footer { color: var(--faint); font-size: 12px; padding: 30px 0 50px; border-top: 1px solid var(--line); margin-top: 30px; }
  @media (max-width: 600px) { body { font-size: 14px; } .grid, .keys { grid-template-columns: 1fr; } .key { flex-wrap: wrap; } .portrait { width: 64px; height: 64px; } }
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = (x, d = 0) => `${+(x * 100).toFixed(d)}%`;

const dmg = (mult, L) => Math.round(hpAt(L) * mult);
const card = (html, search, cls = '') => `<div class="card ${cls}" data-s="${esc(String(search).replace(/[\uE100-\uE108]/g, '').toLowerCase())}">${html}</div>`;

function basics() {

  const statCards = [
    ['HP', `Health. You start with ${s.health} and max HP grows every level (${L[1].hp} at level 2, ${L[9].hp} at 10, ${L[19].hp} at 20). Regenerates ${D.levelMult.healthRegen > 1 ? 'about 1 point per minute (a little more every level)' : '1 point per minute'}. Below ${pct(D.states.injured.healthShare)} you are <b>injured</b> and walk ${pct(1 - D.states.injured.speed)} slower.`],
    ['NRG', `Energy for TradeCorp calls and crafting. Max ${D.caps.energy} at level 1, +${pct(0.1)} per level (${L[9].nrg} at 10). Refill it with food or a HomeDome rest.`],
    ['STR', `Strength: the damage of every hit. ${s.strength} at the start, your own STR grows ×${D.levelMult.strength} per level (${L[9].str} at 10, ${L[19].str} at 20). Weapons, talents and set bonuses add more.`],
    ['CHSM', `Charisma: better TradeCorp deals and crit chance (+${pct(D.crit.perCha, 2)} crit per point above the starting 1, capped at ${pct(D.crit.cap)}). Patches from the ATB-Market raise it.`],

    ['HIT', `Hit chance: ${pct(D.hit.base)} against enemies of your level, 100% against lower levels, −${pct(D.hit.perLvl)} for every level the enemy is above you. Each HIT point (from weapons) adds +${pct(D.hit.perPt, 2)}, up to ${D.hit.cap} points.`],
    ['Crit', `Critical strike: your STR is added to the hit once more. Chance = a base that grows with your level (${pct(D.crit.base.min)} at level 1 = 1 crit in 100 hits, up to ${pct(D.crit.base.max)} at level ${D.maxLevel} = 1 in 20) + the CHSM bonus (CHSM above the starting 1) + talents.`],
    ...(D.hurtFx ? [['Getting hit', `When you take damage you flash (pale for small hits, red when a hit takes more than ${D.hurtFx.redAt * 100}% of your max HP), then blink, and the screen edges flash red, stronger for bigger hits. Direct hits also shake the screen (harder from ${D.hurtFx.bigAt * 100}% of your max HP) and knock a few red sparks out of you, away from the attacker. Poison, burning, tar and fuel ticks only give a faint red edge.`]] : []),
    ...(D.melee ? [['Swing', `Your swing reaches enemies whose body touches a cone in front of you, aimed at the cursor (phones: where you face): ${D.melee.arcDeg.fists}° with fists, ${D.melee.arcDeg.sword}° with a sword. It starts at the centre of your body and reaches ${D.melee.fistReach} m with fists; with a sword ${+(D.melee.radius * Math.sqrt(1.2) + D.melee.innerReach).toFixed(1)}–${+(D.melee.radius * Math.sqrt(1.3) + D.melee.innerReach).toFixed(1)} m depending on the sword. Fists hit only the first enemy in the cone; a sword hits the first one fully and every other one in the cone for ${D.melee.splash * 100}% (half the push too). The first enemy is your Tab target if it's in the cone, otherwise the closest one; if it dodges, that main hit is lost. The hit lands after a wind-up: ${D.melee.windupMs.fists / 1000} s with fists, ${D.melee.windupMs.sword / 1000} s with a sword. Whoever is in the cone at that moment gets hit, so a fleeing enemy can escape it.`]] : []),
    ...(D.knockback ? [['Knockback', `Melee hits push the enemy back: ${D.knockback.fists} m with fists, +${D.knockback.perRarity} per weapon rarity step (common ${+(D.knockback.fists + D.knockback.perRarity).toFixed(2)}, rare ${+(D.knockback.fists + 2 * D.knockback.perRarity).toFixed(2)}…). Crits ×${D.knockback.crit}; ×${D.knockback.tougher} if the enemy has more HP than you. Walls stop it. You bounce back ${D.hitFx.recoil} m yourself.`], ['Hit impact', `A melee hit that lands makes the enemy flash, bursts particles out of it (ooze, spores or dust from creatures, sparks from machines), freezes the action for ${D.hitFx.stopMs} ms and shakes the screen a little. Crits freeze for ${D.hitFx.critStopMs} ms, shake harder and throw more particles.`]] : []),
    ['Move', `You walk freely in any direction at ${+(1000 / D.moveMs).toFixed(1)} m/s (1 tile = 1 m), the same speed diagonally. Injured, slowed and speed buffs change it. On a phone, pushing the joystick less walks slower.`],
    ['Hitbox', `You get hit on an upright oval 0.6 m wide and 1.7 m tall (your whole body, feet to head). Bites, slaps, rams, sprays and Magic Tar must touch it; bites and slaps reach 0.9 m from the enemy's body. Every enemy has its own body oval (the size of its model) that your swings, Magic tar and Fuel Spray must touch, plus a ground circle at its feet. Ground attacks (Crawler pounce, Loader slam and vines, spore clouds, burning oil) only hit your feet (a 0.5 m circle), the same circle that bumps into walls.`],
    ['Aim', `On a computer the hero always faces the mouse cursor. It turns into a red reticle over enemies, a pointing hand over buildings and NPCs you can open, and a grab hand over loot and harvest piles (dimmed when they're too far to use). Clicking a hand next to you opens, loots or harvests it (hold to harvest). Left click swings toward it, hold to keep swinging; Magic tar and Fuel Spray fly toward it too, unless you picked a Tab target. Space opens, loots or harvests whatever is right next to you without aiming. On a phone, swings follow your walk and spells aim at the closest enemy.`],
    ['$', `Money. Earned at TradeCorp, from quests and from enemy loot. You lose what you carry when you die (see below).`],

  const kv = list => `<div class="keys">${list.map(([k, v]) => `<div class="key" data-s="${esc((k + ' ' + v).replace(/[\uE100-\uE108]/g, '').toLowerCase())}"><kbd>${esc(k)}</kbd><span>${esc(v)}</span></div>`).join('')}</div>`;

  const factor = D.dmgTable.map((f, i) => [`${i - 4 > 0 ? '+' : ''}${i - 4}`, `×${f}`]);
  return `<section id="basics">
    <h2><span class="k">01</span> Basics</h2><p class="lead">How to play, what your stats do and how you grow.</p>
    <p class="muted"><b>How chances work:</b> no chance in Neon Hustle is a flat roll. A 25% chance is a bag of 4 answers (1 yes, 3 no): each try takes one out, so after a "no" it's 1 in 3, then 1 in 2, and the 4th try is a sure yes; then the bag is refilled. The same goes for hits, crits, drops (a 3% drop is 3 in every 100 kills), deal types, loot amounts (each amount once per bag) and more. Every kind of roll has its own bag, and your bags are saved with the game.</p>

    <h3>Stats</h3>
    <div class="grid small">${statCards.map(([k, t]) => card(`<h4 style="color:var(--cyan)">${({ HP: GL.health, NRG: GL.energy, STR: GL.strength, CHSM: GL.charisma, MANA: GL.mana, Move: GL.speed, $: GL.money })[k] || ''} ${k === '$' ? 'Money' : k}</h4><p class="desc">${t}</p>`, k + ' ' + t)).join('')}</div>

    ${table(['Level', 'Exp to next', 'Max HP', 'Own STR', 'Max mana', 'Max NRG', 'Crit bonus', 'Common quest pays'], lvRows)}

    ${table(['Destination', 'Level', 'Time', 'Scheduled', 'Priority'], del)}
    <h3>TradeCorp deals (city)</h3>
    <p class="muted">Three deals at a time; all reroll after you take one. Calls cost energy and pay money (more with level and charisma; rare calls pay ×${D.deals.w.rare} instead of ×${D.deals.w.common}). Sales sell you a batch of one common or rare resource, upgrade or food item (about your level × 20${GL.money} worth at full price, up to a full stack) with a 5% discount, plus your promotion's discount (15 / 25 / 35%). Each deal also gives exp (calls: 1 + 1 per 5${GL.money} profit; sales: 1 per 20${GL.money} paid). <b>My Office</b> has 5 chip sockets: socket 1 is open from the start, the others open with promotions (Data Clerk: socket 2, Neurodiversity Manager: socket 3, AI Overseer: sockets 4 and 5). Selecting an open, empty socket installs a chip for good. <b>Streak chip</b> (1,000${GL.money}): taking a customer call boosts one random call among the new deals by +1${GL.money} for 2 s (its reward turns green, with a green timer line under the row). Take that call in time and the next boost is one bigger (+1, +2, +3 …) but shorter: 2 s at +1 down to 1 s from +7 on; a boosted call also twinkles with small amber sparkles; let it run out, or take a sale or delivery, and it starts again at +1. More chips come later.</p>
    <div class="grid"><div>${table(['Deal', 'Chance'], ch)}</div><div>${table(['Promotion', 'Deals', 'CHSM', 'Cost', 'Socket'], promo)}</div></div>
    <h3>Leaderboard buffs</h3><p class="muted">The leaderboard (L) has four lists (Top Exp, Top Dealers, Top Slayers, Top Achievers), each shown for this month and for all time, with the top 10 and your own place. Monthly lists count what you earned since the 1st (London time) and start from zero every month. Being number 1 on a <b>monthly</b> list gives you its buff while you hold the spot; all-time lists are for glory. Each row shows the hero's chosen title after the name.</p>
    ${table(['Spot', 'Buff'], lb)}
  </section>`;
}

// ---------- ACHIEVEMENTS ----------
function achievements() {
  const A = D.ach; if (!A) return '';
  const ROM = ['I', 'II', 'III', 'IV', 'V'], mk = n => n ? `${n} ⬢` : '—';
  const tiers = (ns, pts, marks, word) => ns.map((n, i) => [ROM[i], `${n.toLocaleString('en')} ${n === 1 ? word.replace(/s$/, '') : word}`, pts[i], mk(marks[i])]);
  const killT = A.kill.map(k => [`<b>${esc(k.name)}</b>`, esc(k.t3), esc(k.t5)]);
  const bossT = A.boss.map(b => [`<b>${esc(b.name)}</b>`, esc(b.t1), esc(b.t5)]);
  const regions = A.list.filter(a => a.group === 'region').map(a => esc(a.name.replace('First steps: ', ''))).join(', ');
  const uniq = A.list.filter(a => a.tab === 'unique').map(a => [`<b>${esc(a.name)}</b>`, esc(a.desc), a.pts, mk(a.marks), a.title ? esc(a.title) : '—']);
  const total = A.list.reduce((t, a) => t + a.pts, 0), totalM = A.list.reduce((t, a) => t + a.marks, 0);
  const hof = A.hof.map(h => [`<b>${esc(h.name)}</b>`, `${h.price} ⬢`, esc(h.desc)]);
  return `<section id="achievements"><h2><span class="k">06</span> Achievements</h2>
    <p class="lead">${A.list.length} achievements, worth ${total.toLocaleString('en')} points and ${totalM} Neon Marks in all. Open the list with <b>K</b> or the medal button at the top. A gold banner drops in when you earn one.</p>
    ${card(`<ul class="facts"><li><b>Points</b> add up to your Top Achievers score on the leaderboard (this month and all time).</li><li><b>Neon Marks</b> (⬢) are a rare currency: only the bigger achievements give them. Collect them now: the Hall of Fame booth where you spend them opens in the city soon.</li><li><b>Titles</b>: some achievements give a title. Pick one in the Titles tab; it shows under your name on the hero plate and next to your name on the leaderboard.</li><li>Kill achievements count kills from the moment achievements arrived (older saves start at zero); summoned Drips don't count.</li></ul>`, 'achievements points neon marks titles')}
    <h3>Kills</h3><p class="muted">Every enemy has five tiers. Tier III and V give a title.</p>
    <div class="grid"><div>${table(['Tier', 'Kills', 'Points', 'Marks'], tiers(A.killTiers, A.killPts, A.killMarks, 'kills'))}</div><div>${table(['Enemy', 'Tier III title', 'Tier V title'], killT)}</div></div>
    <h3>Bosses</h3><p class="muted">Five tiers per boss. Tier I and V give a title.</p>
    <div class="grid"><div>${table(['Tier', 'Kills', 'Points', 'Marks'], tiers(A.bossTiers, A.bossPts, A.bossMarks, 'kills'))}</div><div>${table(['Boss', 'Tier I title', 'Tier V title'], bossT)}</div></div>
    <h3>Exploration</h3><p class="muted">Zones discovered: ${A.zoneSteps.map((n, i) => `${n} (${A.zonePts[i]} pts${A.zoneMarks[i] ? ', ' + mk(A.zoneMarks[i]) : ''})`).join(', ')}; the last one, "Every corner", gives the title Cartographer. Entering each area for the first time gives 10 pts: ${regions}.</p>
    <h3>Unique</h3><p class="muted">Hidden in the game ("???") until you earn them.</p>
    <details><summary>Show the hidden achievements (spoilers)</summary>${table(['Name', 'How', 'Points', 'Marks', 'Title'], uniq)}<p class="muted">Untouchable: the fight must start with the boss at full health; walking away and coming back doesn't clear a hit.</p></details>
  </section>`;
}

// ---------- WORLD ----------
function world() {
  const typeOrder = ['city', 'grid', 'slums', 'greaser', 'factoryIn', 'factory', 'wasteland', 'pit', 'lake', 'forest', 'deepForest', 'overgrowth', 'labs', 'breach'];
  const NAMES = { drip: 'Drip', scav: 'Scav', toxicScav: 'Toxic Scav', drone: 'Mav-1K', spore: 'Sporeling', crawler: 'Scrap Crawler', runner: 'Dispatch Runner', loader: 'Overgrown Loader', queen: 'Pump Queen' };
  const rows = typeOrder.filter(t => ZTYPE[t]).map(t => {
    const zs = ZTYPE[t], foes = {};
    for (const z of zs) for (const k in z.foes) foes[k] = (foes[k] || 0) + z.foes[k];
    const places = [...new Set(zs.flatMap(z => z.places))];
    return [`<b>${esc(zs[0].name)}</b>`, zs.length, levelSpan(zs), Object.entries(foes).map(([k, n]) => `${n} ${NAMES[k] || k}`).join(', ') || '<span class="faint">safe</span>', places.map(esc).join(', ') || '—'];
  });
  const city = [
    ['ATB-Market', 'Shop: food, patches, weapons, armor and bags. Resources tab: buy Tar, sell loot for half its value.'], ['TradeCorp', 'Work: customer calls, sales and deliveries; promotions from the Boss; My Office chip sockets (opened by promotions; Streak chip).'],
    ['HomeDome', `Rest for ${D.rest.price}${GL.money}: ${pct(D.rest.share.health)} of max HP, NRG and mana back, every ${D.rest.cooldownMs / 60000} min.`],
    ['MutaTech', 'Crafting: Tar Orbs, the baNano Sword and more.'], ['TechVersity', 'Spend talent points.'], ['Rogue', 'Tutorial and quests.'], ['Sparky', 'By the east road, south of the noodle bar, next to a powered grid node: the electrician. Gives the Grid quests: Gridlock, Wire me in, Abandoned Factory, Chips, Scav problems.'], ['Vesper', 'In the south of the city, on the pavement right of the noodle bar, by the southern road: the hooded bounty hunter. Weapon, Drip Cleanup, Drone targeting, Gear up, The Queen.'], ['Pixi', 'In front of TradeCorp: the city\'s announcer. Talk to her for the last 3 news, newest first. A pink "!" over her means there\'s something new.'],
    ['Scrap Dealer', 'Slums 0:1: turns armor, weapons and bags into Scrap (no money).'], ['Netizen Chef', 'Delivery destination in the slums.'],
    ['CredBank', `Vault: ${D.vault.sockets.length} bag sockets, bought in order for ${D.vault.sockets.map(c => c.toLocaleString('en') + '$').join(', ')}. The bags you put in them add up into one storage (3 BackBags = 6 slots). Storing an item costs ${D.vault.fees.store}${GL.money}, taking it out ${D.vault.fees.withdraw}${GL.money} (a whole stack counts as one item). Everything in the Vault is kept when you die. Exchange tab: under construction.`],
    ['Metro Station · Ripperdoc Clinic', 'Coming soon.'],
  ];
  return `<section id="world"><h2><span class="k">07</span> World</h2>
    <p class="lead">Zones have map coordinates (M opens the map). A zone's level is the bigger of its two coordinates, and every enemy there has that level. Discovering a zone gives |x| + |y| exp. Forests are full of trees (forest: 5 per zone level, deep forest: 6 per level, the Overgrowth: 40 around a clear middle): you can't walk through a trunk, and a tree turns see-through while you're behind it. The Quarantine Labs (south of slums -7:3) hold 6-8 labs per zone, each with its Toxic Scavs; the Overgrowth (-6:-6, reached from deep forest -6:-7) is Specimen G-0's arena, and the Breach (-8:8, reached from labs -9:8) is empty for now. <b>Sealed airlocks:</b> the way into the Quarantine Labs (-7:3 → -8:3) opens only once you have had the <b>Keycard</b>, and the Breach (-9:8 → -8:8) only with the <b>Special Keycard</b> (both from Chain 3's quests); without one the airlock stops you with "SEALED". Once you have had a card its door stays open for good. A save that was standing behind a sealed door is moved in front of it. <b>No saving in boss areas</b> (the greaser 2:2, the Industrial Pit 4:-4, the Overgrowth -6:-6, the Breach -8:8): neither the autosave nor the save slots work there, so your last save is always outside and every boss fight starts from the zone entrance. Every boss gives up when you are 20 m from its home.</p>
    ${table(['Area', 'Zones', 'Level', 'Enemies', 'Places'], rows)}
    <h3>Places</h3><div class="grid small">${city.map(([n, t]) => card(`<h4 style="color:var(--cyan)">${esc(n)}</h4><p class="desc">${esc(t)}</p>`, n + ' ' + t)).join('')}</div>
  </section>`;
}

// ---------- page ----------
$('#banner').src = D.art.startScreen || '';
$('#main').innerHTML = iconize(basics() + enemies() + items() + talents() + quests() + achievements() + world());
$('#foot').textContent = `Hustlepedia · numbers read from the game on ${new Date(D.version).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}.`;
// opened from the game in a new tab: "back" closes this tab and returns to the game
$('#back').addEventListener('click', e => { if (window.opener) { e.preventDefault(); window.close(); } });

// search: hides cards and table rows that don't match, and sections left empty
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('[data-s]').forEach(el => el.classList.toggle('hidden', !!q && !el.dataset.s.includes(q)));
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.toggle('hidden', !!q && !tr.textContent.toLowerCase().includes(q)));
  document.querySelectorAll('section').forEach(s => {
    const any = !q || [...s.querySelectorAll('[data-s], tbody tr')].some(el => !el.classList.contains('hidden'));
    s.classList.toggle('hidden', !any);
  });
});
// highlight the tab of the section in view
const tabs = [...document.querySelectorAll('#tabs a')];
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) tabs.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('section').forEach(s => io.observe(s));
</script>
</body>
</html>
