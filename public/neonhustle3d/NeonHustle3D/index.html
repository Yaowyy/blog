<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Neon Hustle 3D</title>
  <!-- Neon Hustle 3D web template: full window, black, monospace, a neon loading bar (the web game's style) -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; touch-action: none; }
    /* phones held upright: ask to turn sideways (the game is laid out for landscape) */
    #turn { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #000; z-index: 5;
            font: 18px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfcfcf; padding: 24px; }
    #turn b { color: #fff; font-size: 22px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: grid; } }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #000;
              font: 16px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfcfcf; }
    #loader .box { width: min(520px, 86vw); border: 2px solid #fff; border-radius: 18px; padding: 28px 32px; }
    #loader h1 { margin: 0 0 6px; font-size: 28px; color: #fff; }
    #loader .sub { color: #8a8a8a; font-size: 13px; margin-bottom: 22px; }
    #bar { height: 14px; border-radius: 7px; background: #0b0d14; border: 1px solid rgba(255,255,255,0.3); overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #00e5ff, #b58cff, #ff2bd6); box-shadow: 0 0 12px #00e5ff; transition: width 0.2s; }
    #pct { margin-top: 10px; font-size: 13px; color: #8a8a8a; display: flex; justify-content: space-between; }
    #err { margin-top: 14px; color: #e5484d; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="turn"><div><b>↻ Turn your phone sideways</b><br>Neon Hustle 3D plays in landscape.</div></div>
  <div id="loader">
    <div class="box">
      <h1>NEON HUSTLE 3D</h1>
      <div class="sub">early build · loading the city (the first time can take a minute)</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="pct"><span id="what">downloading…</span><span id="num">0%</span></div>
      <div id="err"></div>
    </div>
  </div>
  <script src="Build/NeonHustle3D.loader.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const fill = document.getElementById('fill'), num = document.getElementById('num'), what = document.getElementById('what');
    createUnityInstance(canvas, {
      dataUrl: "Build/NeonHustle3D.data.unityweb",
      frameworkUrl: "Build/NeonHustle3D.framework.js.unityweb",
      codeUrl: "Build/NeonHustle3D.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Neon Hustle 3D",
      productVersion: "0.1.0",
    }, (p) => {
      const v = Math.round(p * 100);
      fill.style.width = v + '%'; num.textContent = v + '%';
      what.textContent = p < 0.9 ? 'downloading…' : 'starting the city…';
    }).then(() => {
      document.getElementById('loader').style.display = 'none';
      canvas.focus();
    }).catch((e) => {
      const err = document.getElementById('err'); err.style.display = 'block';
      err.textContent = 'Could not start: ' + e + '. Try Chrome, Edge or Firefox on a computer.';
    });
    // clicking the game gives it the keyboard (it lives in an iframe on andrii.blog/game3d)
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
